services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1@sha256:5fa76604a81df6945086e0837b14b56543d137e8ce4f311cc5d9ebe907e74e79  # v3 needs the environment set by the paperless_env role
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - redis
      - gotenberg
      - tika
    env_file: .env
    environment:
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /data/paperless/originals:/usr/src/paperless/media
      - /data/paperless/consumption:/usr/src/paperless/consume
      - /data/paperless/export:/usr/src/paperless/export
      - /data/paperless/thumbnails:/usr/src/paperless/thumbnails
      - /var/lib/paperless/logs:/usr/src/paperless/logs
      - paperless-data:/usr/src/paperless/data

  redis:
    image: redis:7.4.11-alpine@sha256:d9436322172a5b482c187bf1f363d3c4fea086fcca6b9c8a94de8f0f39ed3193
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  gotenberg:
    image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769  # the minor release Paperless v3 ships with
    container_name: paperless-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  tika:
    # Tag and digest: the tag names the version, the digest is what is pulled.
    # 3.3.1.0 is the Tika release Paperless v3's own compose example pins.
    image: apache/tika:3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
    container_name: paperless-tika
    restart: unless-stopped

volumes:
  paperless-data:
  redis-data:
