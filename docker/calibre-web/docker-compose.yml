services:
  calibreweb:
    image: lscr.io/linuxserver/calibre-web:0.6.27-ls404  # pinned; Calibre-Web 0.6.27 released 2026-08-08, image build 2026-10-04
    container_name: calibre-web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "${CW_BIND_ADDRESS}:${CW_PORT}:8083"
    volumes:
      - ${CW_CONFIG}:/config:rw
      - ${CW_BOOKS}:/books:ro
    restart: unless-stopped
