services:
  calibreweb:
    image: lscr.io/linuxserver/calibre-web:0.6.27-ls404@sha256:80b2a77b5925441c76607619fd406694570a50a0e32c229198dbb39e72da6fed
    container_name: calibre-web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "${CW_BIND_ADDRESS}:${CW_PORT}:8083"
    volumes:
      - ${CW_CONFIG}:/config:rw
      - ${CW_BOOKS}:/books:ro
    restart: unless-stopped
