services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION}
      - --web.enable-lifecycle
      - --web.listen-address=${PROM_BIND_ADDRESS}:${PROM_PORT}
      # Longer than the longest off-window, about 35 h from Thursday night to the
      # Saturday wake. At the default of 1h every pending alert restarts its `for:`
      # at each boot (KE-31).
      - --rules.alert.for-outage-tolerance=48h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ${PROM_DATA}:/prometheus
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    network_mode: host
    env_file:
      - ${GF_ENV_FILE}
    volumes:
      - ${GF_DATA}:/var/lib/grafana
      - ./grafana/provisioning/datasources/prometheus.yml:/var/lib/grafana/provisioning/datasources/prometheus.yml:ro
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=${AM_BIND_ADDRESS}:${AM_PORT}
      # Empty value disables the gossip listener, which otherwise binds *:9094 on
      # the host network (the LAN). A single Alertmanager has no cluster peers.
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--web.listen-address=${NE_BIND_ADDRESS}:${NE_PORT}'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    network_mode: host
    # Tailscale's fixed resolver: at boot Docker can copy resolv.conf before
    # tailscaled has written it, leaving MagicDNS names unresolvable (KE-18).
    dns:
      - 100.100.100.100
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
      - '--web.listen-address=${BB_BIND_ADDRESS}:${BB_PORT}'
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
