services:
  prometheus:
    image: prom/prometheus:v3.15.0  # pinned; released 2026-09-25
    container_name: prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION}
      - --web.enable-lifecycle
      - --web.listen-address=${PROM_BIND_ADDRESS}:${PROM_PORT}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ${PROM_DATA}:/prometheus
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.3  # pinned; released 2026-09-29
    container_name: grafana
    network_mode: host
    env_file:
      - ${GF_ENV_FILE}
    volumes:
      - ${GF_DATA}:/var/lib/grafana
      - ./grafana/provisioning/datasources/prometheus.yml:/var/lib/grafana/provisioning/datasources/prometheus.yml:ro
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.34.1  # pinned; released 2026-09-17
    container_name: alertmanager
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=${AM_BIND_ADDRESS}:${AM_PORT}
      # Empty value disables the gossip listener. Without it Alertmanager binds
      # *:9094 on both protocols by default, which on a host-networked container is
      # the LAN - a cluster port offered to the segment by the one node that watches
      # the others. There is no second Alertmanager here and never has been: a
      # cluster of one has nobody to gossip with, so the port carried no traffic and
      # no benefit, only exposure. Found by the 2026-08-20 audit.
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.12.1  # pinned; released 2026-07-14
    container_name: node-exporter
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--web.listen-address=${NE_BIND_ADDRESS}:${NE_PORT}'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0  # pinned; v0.29.0 is younger than seven days
    container_name: blackbox-exporter
    network_mode: host
    # Probes address services by MagicDNS name. Docker copies the node's
    # resolv.conf when the container starts, which at boot can be before
    # tailscaled has written it, leaving the LAN router as resolver until the
    # next restart (KE-18). Naming Tailscale's fixed resolver makes the lookup
    # independent of that order; it answers as soon as tailscaled is up.
    dns:
      - 100.100.100.100
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
      - '--web.listen-address=${BB_BIND_ADDRESS}:${BB_PORT}'
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
