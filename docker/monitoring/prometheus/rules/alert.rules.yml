groups:
  - name: node
    rules:
      - alert: NodeDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for more than 2 minutes."

      # Percentage suits a root filesystem, not an archive designed to fill. Excluded here
      # and covered by ArchivePoolLowSpace instead:
      #   - cifs: a remote view of storage another node owns; that node alerts.
      #   - the MergerFS pool and its member disks on vm102.
      - alert: DiskSpaceCritical
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|cifs|fuse.mergerfs", mountpoint!~"/mnt/disk[0-9]+|/mnt/aux[0-9]+TB"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs|cifs|fuse.mergerfs", mountpoint!~"/mnt/disk[0-9]+|/mnt/aux[0-9]+TB"}
          ) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 15% free ({{ $value | printf \"%.1f\" }}% remaining)."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage on {{ $labels.instance }} is above 90% ({{ $value | printf \"%.1f\" }}% used)."

      # for: 15m because after the nightly power-down the first evaluation can precede the
      # timer's Persistent=true catch-up; the dump lands a few minutes after boot.
      - alert: PostgreSQLBackupStale
        expr: (time() - pg_backup_last_success_timestamp) > 90000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL backup is stale"
          description: "Last successful pg_dumpall on CT260 was more than 25 hours ago."

      # Same 25-hour threshold and the same limit as the PostgreSQL rule: Prometheus runs on
      # the host that powers down overnight, so this means "not 25 hours of uptime without a
      # backup". Covering host-off periods is the job of the external heartbeat (Watchdog).
      - alert: MariaDBBackupStale
        expr: (time() - mariadb_backup_last_success_timestamp) > 90000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "MariaDB backup is stale"
          description: "Last successful mariadb-dump on CT210 was more than 25 hours ago. Nextcloud's file data is on the archive pool; without this database those files are unusable."

      # An absent series compares as nothing, so the staleness rules above go silent rather
      # than red when the textfile collector is not read (wrong exporter on port 9100, for
      # example). absent() keeps only matcher labels, so each absence is tagged with its
      # metric name; otherwise two missing series on one job collapse into one result.
      - alert: DatabaseBackupMetricsMissing
        expr: |
          label_replace(absent(pg_backup_last_success_timestamp{job="node-lxc260-postgres"}),
            "metric", "pg_backup_last_success_timestamp", "", "")
          or label_replace(absent(mariadb_backup_last_success_timestamp{job="node-lxc210-nextcloud"}),
            "metric", "mariadb_backup_last_success_timestamp", "", "")
          or label_replace(absent(pg_restore_test_last_success_timestamp{job="node-lxc260-postgres"}),
            "metric", "pg_restore_test_last_success_timestamp", "", "")
          or label_replace(absent(mariadb_restore_test_last_success_timestamp{job="node-lxc210-nextcloud"}),
            "metric", "mariadb_restore_test_last_success_timestamp", "", "")
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.metric }} is not being reported ({{ $labels.job }})"
          description: "{{ $labels.metric }} is absent on {{ $labels.job }}, so the staleness rule that reads it cannot fire. Either the textfile collector is not being read - check which exporter holds port 9100 on that node - or the job has never completed successfully and written it."

      # 40 days against a monthly schedule: one missed run is slack, two is a fault. A test
      # that has never succeeded has no series; DatabaseBackupMetricsMissing reports that.
      - alert: PostgreSQLRestoreTestStale
        expr: (time() - pg_restore_test_last_success_timestamp) > 3456000
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL restore validation is overdue"
          description: "The last successful restore test on CT260 was more than 40 days ago. Dumps are still being written, but nothing has proven they can be read back."

      # Same 40 days. Nextcloud's files are on the archive pool and its index is in this
      # database; a dump that restores into empty tables imports without an error.
      - alert: MariaDBRestoreTestStale
        expr: (time() - mariadb_restore_test_last_success_timestamp) > 3456000
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "MariaDB restore validation is overdue"
          description: "The last successful restore test on CT210 was more than 40 days ago. Dumps are still being written, but nothing has proven Nextcloud's database can be rebuilt from one."

  - name: postgres
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter cannot reach the database"
          description: "postgres_exporter on {{ $labels.instance }} reports pg_up=0 for more than 2 minutes. The database may be down or unreachable."

      - alert: PostgreSQLConnectionsHigh
        expr: sum by (instance) (pg_stat_activity_count{datname!~"template.*|postgres"}) / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection usage high on {{ $labels.instance }}"
          description: "Active connections exceed 80% of max_connections on {{ $labels.instance }} ({{ $value | printf \"%.1f\" }}% used)."

  - name: snapraid
    rules:
      # for: 30m because the host can be off for more than 26 hours before a scheduled start
      # (homelab_schedule) and the catch-up sync needs a few minutes.
      - alert: SnapRAIDSyncStale
        expr: (time() - snapraid_sync_last_success_timestamp) > 93600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "SnapRAID sync is stale"
          description: "Last successful snapraid sync on VM102 was more than 26 hours ago."

      # Ten days against a weekly scrub: one missed Monday plus room for Persistent=true to
      # catch up at the next boot. Also catches a scrub killed by the nightly shutdown, which
      # never reaches its success metric.
      - alert: SnapRAIDScrubStale
        expr: (time() - snapraid_scrub_last_success_timestamp) > 864000
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "SnapRAID scrub is stale"
          description: "Last successful snapraid scrub on VM102 was more than 10 days ago. The scrub is weekly, so this is one missed run plus catch-up margin - check whether the run was killed before it finished."

      # The rule above says a scrub ran, not what it covered. These four measure coverage.
      # Thresholds sit above the measured baseline so the rules are not red on deployment;
      # the weekly 12% scrub is expected to pull the values below them.
      - alert: SnapRAIDScrubCoverageAging
        expr: snapraid_scrub_oldest_block_age_days > 200
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Oldest SnapRAID block unverified for {{ $value }} days"
          description: "Some part of the array has not been checked against parity for over 200 days. The weekly 12% scrub should pull this down once it has covered the never-scrubbed blocks; above 200 and still rising, the scrub is not keeping up or has stopped."

      - alert: SnapRAIDArrayUnscrubbed
        expr: snapraid_array_unscrubbed_ratio > 0.85
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of the SnapRAID array is unscrubbed"
          description: "The fraction of the array no scrub has ever verified is above 0.85. Parity exists for these blocks; nothing has confirmed it can be used."

      # The two rules above mean coverage was read and is poor; this one means it was not
      # read. The status timer runs independently of the sync. for: 30m as for
      # SnapRAIDSyncStale: the host can be off for more than 48 hours before a start.
      - alert: SnapRAIDStatusStale
        expr: (time() - snapraid_status_last_run_timestamp) > 172800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "SnapRAID coverage has not been read for 48 hours"
          description: "snapraid-status.timer on VM102 has not written coverage metrics for more than two days. The scrub figures in Prometheus are older than they look."

      - alert: SnapRAIDStatusUnreadable
        expr: snapraid_status_parse_ok == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SnapRAID status output could not be parsed"
          description: "The collector ran but could not read the scrub age out of `snapraid status` on VM102 - either the command failed or its output format changed. Coverage metrics are not being updated."

  - name: storage
    rules:
      # The archive is meant to fill, so what matters is whether the next write fits. Write
      # consumers (Nextcloud, Paperless, pg_dumpall to /mnt/backups) hit ENOSPC; read
      # consumers are unaffected. The remedy is capacity, hence a warning with a long window.
      # 100 GiB is about two days of headroom at the observed growth rate. Measured on vm102,
      # which owns the pool; CIFS views of it are excluded from DiskSpaceCritical.
      - alert: ArchivePoolLowSpace
        expr: node_filesystem_avail_bytes{fstype="fuse.mergerfs"} < 100 * 1024 * 1024 * 1024
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "MergerFS archive pool below 100 GiB free on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} has {{ $value | humanize1024 }}B free. Write consumers (Nextcloud, Paperless, pg_dumpall to /mnt/backups) will fail with ENOSPC before read consumers notice. Expand capacity."

      # Access on vm102 is granted through groups only. This metric counts objects that
      # deviate from the matrix, for example read permission for "other", which would let
      # access work regardless of the groups (docs/platform/storage-permissions.md).
      # for: 1h because a repair run produces transient drift while it works.
      - alert: StoragePermissionDrift
        expr: sum(storage_permission_violations) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Storage permission matrix violated on {{ $labels.instance }}"
          description: "{{ $value }} objects on the MergerFS branches deviate from the target matrix in /etc/storage-permissions.conf. Run `storage-permissions.sh --check` on vm102 for the breakdown, `--apply` to repair. See docs/platform/storage-permissions.md."

      # A collector that stops running leaves its last value in place, which looks like a
      # passing check. Every textfile collector here has a staleness rule for that reason.
      - alert: StoragePermissionCheckStale
        expr: (time() - storage_permission_check_timestamp_seconds) > 172800
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Storage permission check is stale"
          description: "The permission matrix on vm102 has not been verified for more than 48 hours. The timer runs daily with Persistent=true, so two missed days means the unit is failing, not that the host was off."

  - name: lvm
    rules:
      # A thin pool has no filesystem, so node_filesystem_* cannot see it. The metrics come
      # from lvm-thin-metrics.sh, a textfile collector on the Proxmox host. Overflowing a
      # thin pool corrupts in-flight writes (KE-7). 85% and 90% leave weeks at the measured
      # growth rate, because the remedy is slow: the VG has no free extents, so lvextend
      # first needs root/swap shrunk or a new PV. See runbooks/platform/lvm-thin-pool-full.md.
      - alert: LvmThinPoolWarning
        expr: lvm_thin_pool_data_percent > 85
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Thin pool {{ $labels.vg }}/{{ $labels.lv }} at {{ $value | printf \"%.2f\" }}% allocated"
          description: "Allocation is above 85% on {{ $labels.instance }}. Run lxc-fstrim.service first - containers cannot trim themselves, so freed blocks stay allocated until the host does it. If that does not help, the pool is genuinely growing and needs capacity, not reclaim."

      - alert: LvmThinPoolCritical
        expr: lvm_thin_pool_data_percent > 90
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Thin pool {{ $labels.vg }}/{{ $labels.lv }} at {{ $value | printf \"%.2f\" }}% allocated"
          description: "Overflow corrupts in-flight writes across every guest on this pool (KE-7). Do not start an apt upgrade. Reclaim via lxc-fstrim.service, then check lvm_vg_free_bytes to see whether lvextend is even available."

      # Metadata exhaustion flips the pool read-only and is harder to recover than a full
      # data area. Usage sits at a few percent, so any approach to 80% is anomalous.
      - alert: LvmThinPoolMetadataCritical
        expr: lvm_thin_pool_metadata_percent > 80
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Thin pool {{ $labels.vg }}/{{ $labels.lv }} metadata at {{ $value | printf \"%.2f\" }}%"
          description: "Metadata exhaustion makes the pool read-only. This is not the same failure as a full data area and is harder to undo."

      # A failed run reaches SystemdUnitFailed; a stopped or masked timer does not, and the
      # last .prom file keeps every rule above evaluating a frozen value. Alert on its age.
      - alert: LvmThinMetricsStale
        # node_exporter labels the file with its full path, so match an anchored regex, not
        # the basename.
        expr: time() - node_textfile_mtime_seconds{file=~".*/lvm-thin\\.prom$"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LVM thin-pool metrics on {{ $labels.instance }} are stale"
          description: "lvm-thin.prom has not been rewritten for over 15 minutes (timer runs every 60s). Every LvmThinPool* rule is now evaluating a frozen value. Check lvm-thin-metrics.timer on the Proxmox host."

  - name: systemd
    rules:
      # A unit stuck in `failed` is invisible to NodeDown and blackbox (KE-15). for: 15m
      # absorbs boot-window failures that succeed on the next trigger. No exception list:
      # units that cannot succeed on a node are masked or removed by `systemd_hygiene`.
      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "systemd unit {{ $labels.name }} failed on {{ $labels.instance }}"
          description: "{{ $labels.name }} has been in the failed state on {{ $labels.instance }} for more than 15 minutes. Check `systemctl status {{ $labels.name }}` and `journalctl -u {{ $labels.name }}` on the node."

  - name: backup
    rules:
      # Weekly job: one missed run plus margin. Persistent=true makes up a slot missed while
      # the host was off, so a tighter threshold would fire on a normal catch-up.
      - alert: GuestBackupStale
        expr: (time() - guest_backup_last_run_timestamp_seconds) > 864000
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Guest backup is stale"
          description: "The last vzdump run of all VMs and LXCs finished more than 10 days ago. Every guest root disk lives in one thin pool on the boot SSD, so this is the only copy of the machines themselves."

      # The script continues past a failed guest, so a partial run exits non-zero and leaves
      # this counter above zero. A run that ends early counts every unfinished guest, so this
      # still fires after a reboot has cleared the unit's failed state.
      - alert: GuestBackupPartial
        expr: guest_backup_failed_guests > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} guest(s) failed to back up"
          description: "The last vzdump run left {{ $value }} guest(s) without a new archive, by a non-zero exit or by ending early. Check `journalctl -u guest-backup.service` for which."

      # Both rules above compare against a metric and go silent if it is absent. absent()
      # fires when the job was never deployed or its collector stopped writing.
      - alert: GuestBackupMetricsMissing
        expr: absent(guest_backup_last_run_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No guest backup metrics are being reported"
          description: "guest_backup_last_run_timestamp_seconds is absent. Either the job was never deployed on this host, or its textfile collector stopped writing - both read as green on every other backup rule."

      # Daily job of a few seconds; four days covers a long weekend with the host off. One
      # rule for both a stale timestamp and a missing one.
      - alert: HostConfigBackupStale
        expr: (time() - host_config_backup_last_success_timestamp_seconds) > 345600 or absent(host_config_backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Host configuration backup is stale or missing"
          description: "No host configuration archive in four days, or no metric at all. Without it a rebuild of the hypervisor has the guest archives and not the host they expect - see runbooks/platform/platform-restore.md."

    # Prometheus runs on the host these backups protect, so these rules cannot see the host
    # being off: they mean "not 10 days of uptime without a backup". The external
    # heartbeat (Watchdog) covers host-off periods.

  - name: offsite
    rules:
      # The run reports its own outcome, so a failure shows within minutes rather than as
      # staleness a day later.
      - alert: OffsiteBackupFailed
        expr: offsite_backup_success == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Off-site backup on {{ $labels.instance }} did not complete"
          description: "The last off-site run exited non-zero. Read `journalctl -u offsite-backup.service` on the node; the runbook is runbooks/backup/offsite-backup.md."

      # 50 hours, not 25: the job runs daily, the host sleeps overnight, and a first upload
      # can outlast one waking day. Like the other staleness rules it counts uptime only.
      - alert: OffsiteBackupStale
        expr: time() - offsite_backup_last_run_timestamp_seconds > 180000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No off-site backup from {{ $labels.instance }} in over two days"
          description: "offsite_backup_last_run_timestamp_seconds is {{ $value | humanizeDuration }} old."

      # Reading data back proves the bytes exist; a structural check alone does not.
      - alert: OffsiteBackupUnverified
        expr: time() - offsite_backup_last_verify_timestamp_seconds > 1296000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Off-site data from {{ $labels.instance }} has not been read back in 15 days"
          description: "The weekly --read-data-subset check has not run. The repository may be structurally sound and unreadable in substance."

      # No absent() rule for this group yet: no node runs offsite_backup until the target
      # VPS exists, so absent(offsite_backup_success) would be red by construction. Add it in
      # the same change as the first successful run. The three rules above read series that
      # do not exist yet, so they are inert rather than red. Open item: remediation plan.

  - name: snapshot
    rules:
      # Fourteen days is one missed Sunday plus margin; Persistent=true makes up a Sunday
      # spent powered down at the next boot.
      - alert: FleetSnapshotStale
        expr: (time() - fleet_snapshot_last_run_timestamp_seconds) > 1209600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Fleet snapshot is stale"
          description: "No fleet snapshot has completed for more than 14 days. Nothing is comparing the fleet's listening sockets, local unit files, crontabs and mounts against last week's."

      # A snapshot taken while nodes were unreachable records them as empty and writes that
      # as the new baseline, so missing hosts are reported as a metric.
      - alert: FleetSnapshotIncomplete
        expr: fleet_snapshot_hosts_recorded < fleet_snapshot_hosts_expected
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Fleet snapshot covered {{ $value }} of the expected hosts"
          description: "At least one inventory host did not answer during the last snapshot. Its file reads [unreachable], which is deliberately not the same as an empty one."

    # No rule on fleet_snapshot_changed_lines: drift is the expected weekly output and
    # cannot be cleared by acting on it. The metric is exported for dashboards; whether a
    # change matters is judged when reading the diff.

  - name: drift
    rules:
      # The weekly sweep runs every playbook in ansible/drift-sweep.conf with --check.
      # `unexpected` is the changed-task count minus the baseline in that file, so drift held
      # on purpose does not keep this red.
      - alert: FleetDriftUnexpected
        expr: fleet_drift_unexpected_total > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} task(s) drifted beyond the recorded baseline"
          description: "The weekly check-mode sweep found changes no baseline entry accounts for. Read /var/lib/fleet-drift/report.txt on lxc250 for the playbook and host."

      # Fourteen days is one missed Saturday plus margin, as for the snapshot rule.
      - alert: FleetDriftStale
        expr: (time() - fleet_drift_last_run_timestamp_seconds) > 1209600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Drift sweep is stale"
          description: "No check-mode sweep has completed for more than 14 days. Nothing is comparing the repository against what the fleet runs."

      # A sweep that could not run some playbooks under-reports drift, so what could not be
      # measured gets its own rule.
      - alert: FleetDriftIncomplete
        expr: (fleet_drift_playbooks_errored > 0) or (fleet_drift_hosts_unreachable > 0)
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Drift sweep could not measure everything"
          description: "At least one playbook produced no usable recap, or a host was unreachable. The drift figures from this run are a lower bound, not a result."

      # prometheus_config promotes the rules file and reloads. If the reload failed, the
      # file on disk matches the repository while Prometheus holds the previous set.
      - alert: FleetRulesMismatch
        expr: fleet_drift_rules_mismatch > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} alert name(s) differ between the repository and Prometheus"
          description: "The alert rules Prometheus has loaded are not the rules this repository holds. Either the rules file was never deployed, or it was deployed and the reload did not take."

      # The rule above means the comparison found a difference; this one means it did not
      # run.
      - alert: FleetRulesUnverified
        expr: fleet_drift_rules_check_ok == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Loaded alert rules could not be compared"
          description: "The last sweep could not read /api/v1/rules from the monitoring node, so nothing is checking that Prometheus loaded what the repository holds."

      # A rule whose expression errors at evaluation produces no result, which a `> 0` rule
      # cannot tell from health. Any failure in fifteen minutes is a blind rule.
      - alert: PrometheusRuleEvaluationFailing
        expr: sum by (rule_group) (increase(prometheus_rule_evaluation_failures_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Rules in {{ $labels.rule_group }} fail to evaluate"
          description: "Prometheus counted evaluation failures in {{ $labels.rule_group }} within 15 minutes, so at least one rule there returns nothing whatever the fleet does. The reason is in the rule's lastError on /api/v1/rules or in the Prometheus container log."

  - name: kernel
    rules:
      # node_exporter sets this when a filesystem does not answer statfs within its mount
      # timeout; it keeps reporting while the rest of the host blocks. Five minutes, not
      # fifteen: a wedged FUSE mount can be fixed by restarting its daemon only while new
      # sessions can still be created; after that only a reset helps.
      - alert: FilesystemMountTimeout
        expr: node_filesystem_device_error > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is not answering"
          description: "node_exporter cannot stat {{ $labels.mountpoint }} ({{ $labels.fstype }}). If this is a FUSE mount, restart its daemon NOW - once systemd is caught, only a hard reset remains. See runbooks/platform/hard-shutdown-recovery.md."

      # A hung unit stays `activating` and never becomes `failed`, so SystemdUnitFailed
      # cannot see it. 30 minutes tolerates slow but legitimate starts.
      # Excluded:
      #   - `.device` units: systemd holds some in `activating (tentative)` indefinitely
      #     while the device works (dev-fuse.device on the hypervisor).
      #   - `snapraid-maintenance@`: a oneshot is `activating` for its whole run, and a 12%
      #     scrub takes over two hours. Hung runs are SnapRAIDSyncStale/ScrubStale.
      - alert: SystemdUnitStuckActivating
        expr: node_systemd_unit_state{state="activating", name!~".*\\.device|snapraid-maintenance@.*\\.service"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} stuck activating on {{ $labels.instance }}"
          description: "Unit {{ $labels.name }} has been activating for over 30 minutes. A hung unit never becomes `failed`, so SystemdUnitFailed cannot see it."

  - name: smart
    rules:
      # The three error counters re-keyed by serial number. smartmon labels attributes with
      # the kernel letter, which moves between boots, so a window over `disk` can see a rise
      # no disk made. After a short reboot two device_info series can share one letter for a
      # few minutes; this map keeps only the newest per letter.
      - record: disk:smartmon_device_info:latest
        expr: |
          smartmon_device_info
          and on (instance, disk, serial_number)
            topk by (instance, disk) (1, timestamp(smartmon_device_info))
      - record: serial:smartmon_reported_uncorrect_raw_value:max
        expr: |
          max by (instance, serial_number) (
            smartmon_reported_uncorrect_raw_value
            * on (instance, disk) group_left (serial_number) disk:smartmon_device_info:latest
          )
      - record: serial:smartmon_current_pending_sector_raw_value:max
        expr: |
          max by (instance, serial_number) (
            smartmon_current_pending_sector_raw_value
            * on (instance, disk) group_left (serial_number) disk:smartmon_device_info:latest
          )
      - record: serial:smartmon_offline_uncorrectable_raw_value:max
        expr: |
          max by (instance, serial_number) (
            smartmon_offline_uncorrectable_raw_value
            * on (instance, disk) group_left (serial_number) disk:smartmon_device_info:latest
          )
      - record: serial:smartmon_udma_crc_error_count_raw_value:max
        expr: |
          max by (instance, serial_number) (
            smartmon_udma_crc_error_count_raw_value
            * on (instance, disk) group_left (serial_number) disk:smartmon_device_info:latest
          )

      # Growth, not level: several disks already carry non-zero counters (the aux-disk,
      # KE-13), so a level rule would be red on deployment. Compared with the 25-hour minimum
      # rather than increase(), because these raw values are gauges that can fall. 25h, not
      # 24h, because the nightly power-down can leave a 24-hour window without scrapes. The
      # join after `or` adds the current kernel letter and model to the alert.
      - alert: SmartAttributeDegrading
        expr: |
          (
            (serial:smartmon_reported_uncorrect_raw_value:max
              > min_over_time(serial:smartmon_reported_uncorrect_raw_value:max[25h]))
            or (serial:smartmon_current_pending_sector_raw_value:max
              > min_over_time(serial:smartmon_current_pending_sector_raw_value:max[25h]))
            or (serial:smartmon_offline_uncorrectable_raw_value:max
              > min_over_time(serial:smartmon_offline_uncorrectable_raw_value:max[25h]))
          )
          * on (instance, serial_number) group_left (disk, device_model)
            max by (instance, serial_number, disk, device_model) (disk:smartmon_device_info:latest)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device_model }} ({{ $labels.disk }} at this boot) on {{ $labels.instance }} gained unreadable sectors in the last day"
          description: "A SMART error counter on serial {{ $labels.serial_number }} rose above its 25-hour minimum and now reads {{ $value }}. The disk is degrading now, not historically. Read `smartctl -A` on the host via /dev/disk/by-id - the kernel letter in this alert is only valid until the next boot."

      # CRC errors are counted on the link between disk and controller, not on the platter, so a
      # rise points at cable, backplane, HBA port or power (KE-14) and gets its own warning. The
      # same 25-hour minimum as above; three disks already carry non-zero counts.
      - alert: SmartUdmaCrcErrorsGrowing
        expr: |
          (serial:smartmon_udma_crc_error_count_raw_value:max
            > min_over_time(serial:smartmon_udma_crc_error_count_raw_value:max[25h]))
          * on (instance, serial_number) group_left (disk, device_model)
            max by (instance, serial_number, disk, device_model) (disk:smartmon_device_info:latest)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device_model }} ({{ $labels.disk }} at this boot) on {{ $labels.instance }} logged new link CRC errors in the last day"
          description: "UDMA_CRC_Error_Count on serial {{ $labels.serial_number }} rose above its 25-hour minimum and now reads {{ $value }}. The fault is on the path to the disk, not on the medium: check its cable and port against KE-14 and read `smartctl -A` via /dev/disk/by-id."

      # A level rule fits here: every disk reads 0, and a reallocation means a spare block
      # has been spent.
      - alert: SmartReallocatedSectors
        expr: smartmon_reallocated_sector_ct_raw_value > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.disk }} on {{ $labels.instance }} has reallocated sectors"
          description: "smartmon_reallocated_sector_ct_raw_value is {{ $value }} on {{ $labels.disk }}. A healthy disk reports 0, so any value is a change worth a look."

      # The normalised value (100 down to the vendor threshold of 0), not the raw cycle
      # count. 20 leaves margin before the vendor calls the drive spent. Only the boot SSD
      # carries this attribute (KE-14).
      - alert: SmartWearLevelingLow
        expr: smartmon_wear_leveling_count_value < 20
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.disk }} on {{ $labels.instance }} is near its rated write endurance"
          description: "Normalised wear leveling is {{ $value }} on {{ $labels.disk }}. This disk carries every guest root disk; see KE-14."

      # Guards the three rules above: a stopped collector exports nothing, which looks
      # healthy to a `> 0` rule. The timer runs every 15 minutes; two hours tolerates a boot
      # window and a missed run.
      - alert: SmartMetricsStale
        expr: time() - max by (instance) (smartmon_smartctl_run) > 7200
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SMART metrics on {{ $labels.instance }} are stale"
          description: "No smartmon collector run in over two hours. Disk degradation is unobserved while this is firing."

    # All disks are attached to the Proxmox host; vm102 sees passthrough virtio-SCSI
    # devices, so SMART data is readable only on the host (KE-14). The metrics come from
    # Debian's prometheus-node-exporter-collectors (`smartmon.sh`), deployed by the
    # `smart_metrics` role. The drive's overall health flag is not used: a disk with
    # thousands of pending sectors still reads PASSED.

  # Patch level from Debian's apt.sh collector, by repository origin: the security
  # pockets are the only ones labelled `-Security`/`-security` on Debian and Ubuntu.
  # The threshold is a duration, not a count: for: 14d is longer than the window in
  # which updates are applied by hand, so the rule fires at a backlog.
  - name: apt
    rules:
      - alert: AptSecurityUpdatesPending
        expr: sum by (instance) (apt_upgrades_pending{origin=~".*[Ss]ecurity.*"}) > 0
        for: 14d
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} security update(s) pending on {{ $labels.instance }} for two weeks"
          description: "Security updates have been outstanding on this node for fourteen days. apt-upgrade.yml is run by hand and is excluded from the weekly drift sweep, so nothing else reports this."

      # Staleness of the collector itself. It runs daily; a day and a half is one missed
      # run plus the nightly power-down.
      - alert: AptMetricsStale
        expr: (time() - max by (instance) (node_textfile_mtime_seconds{file="apt.prom"})) > 129600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Package metrics on {{ $labels.instance }} are stale"
          description: "No apt collector run in 36 hours. Patch level is unobserved on this node while this is firing."

  # Services bind the Tailscale address or loopback. listener_metrics exports every
  # listening socket outside that rule which the node's inventory does not allow.
  # 30 minutes is two missed checks: tolerant of a restart during an upgrade.
  - name: listeners
    rules:
      - alert: ListenerOutsideBindingRule
        expr: node_listener_outside_binding_rule == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.process }} listens on {{ $labels.address }}:{{ $labels.port }}/{{ $labels.proto }} ({{ $labels.job }})"
          description: "A socket outside loopback and the Tailscale overlay that the node's listener_metrics_allowed does not name. Either bind it correctly or record the decision that allows it."

      - alert: ListenerMetricsStale
        expr: (time() - max by (job) (node_listener_check_timestamp_seconds)) > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Listener check on {{ $labels.job }} has not run for an hour"
          description: "listener-metrics.timer runs every 15 minutes. While this fires, a new wildcard listener on the node would not be reported."

      # A node that is scraped but carries no listener series was never reached by the role
      # or reads a different textfile directory. lxc200's containerised exporter reads no
      # textfile directory; its native twin carries the series.
      - alert: ListenerMetricsMissing
        expr: up{job=~"node-.*", job!="node-lxc200-monitoring"} == 1 unless on (job) node_listener_check_timestamp_seconds
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No listener metrics from {{ $labels.job }}"
          description: "The node is scraped and exports no node_listener_check_timestamp_seconds. Run listener-metrics.yml against it."

  # Watchdog fires permanently and is routed to an external receiver operated by
  # somebody else; its absence there is the signal. Prometheus runs on the host it
  # watches, so no rule here can report the host, Prometheus, Alertmanager or the
  # network between them being down. Routing: the `heartbeat` receiver in
  # alertmanager.yml.
  - name: heartbeat
    rules:
      - alert: Watchdog
        expr: vector(1)
        for: 0m
        labels:
          severity: none
        annotations:
          summary: "The alerting chain is alive"
          description: "This alert always fires. Its purpose is to prove that Prometheus and Alertmanager are running and that notifications leave the site. If the external receiver stops seeing it, the chain is broken - starting with the possibility that the host is simply off, which is normal overnight and not overnight only."

  - name: blackbox
    rules:
      - alert: ServiceDown
        expr: probe_success == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "blackbox probe for {{ $labels.service }} ({{ $labels.instance }}) reports probe_success=0 for more than 3 minutes. A node can be up while its service is not answering (see KE-8)."

  - name: jellyfin
    rules:
      # Written by jellyfin-cuda-watchdog.sh on vm100 every minute (KE-10). The watchdog
      # restarts Jellyfin when no stream plays or a video transcode is among them. Ten
      # minutes of 0 means direct streams are holding the restart back, or a restart did
      # not bring CUDA back; the held gauge says which.
      - alert: JellyfinCudaLost
        expr: jellyfin_cuda_ok == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Jellyfin has no CUDA access on {{ $labels.instance }}"
          description: "nvidia-smi fails inside the Jellyfin container. If jellyfin_watchdog_restart_held is 1, the restart waits for direct streams to end and transcoding is unavailable until then; if it is 0, the watchdog has restarted Jellyfin and CUDA did not come back."

  - name: ingest
    rules:
      # Written hourly by scan-paperless-inbox.sh on lxc210 from `occ files_external:verify`
      # (KE-29: both mounts failed for four weeks with nothing red). Two hours, so a single
      # failed check during a reboot of vm102 or lxc210 stays quiet.
      - alert: PaperlessIngestStorageDown
        expr: paperless_ingest_storage_up == 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Nextcloud cannot reach Paperless ingest mount {{ $labels.mount_id }}"
          description: "files_external:verify fails for mount {{ $labels.mount_id }} on lxc210, so documents uploaded to that ingest folder never reach Paperless. Check the mount host (`occ files_external:config {{ $labels.mount_id }} host`), Rule 15 of the Tailscale policy and TCP 445 to vm102 (KE-29)."

      # Three hours against an hourly timer. for: 15m covers the Persistent=true catch-up
      # after the nightly power-down, when the last value is from the evening before.
      - alert: PaperlessInboxScanStale
        expr: (time() - paperless_inbox_scan_last_run_timestamp_seconds) > 10800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Paperless inbox scan has not completed for three hours"
          description: "paperless-inbox-scan.service on lxc210 last finished more than three hours ago, so PaperlessIngestStorageDown reads an old value and Nextcloud's view of the ingest folders is stale."

      # A script that never ran writes no series, and the two rules above go silent.
      - alert: PaperlessIngestMetricsMissing
        expr: absent(paperless_inbox_scan_last_run_timestamp_seconds{job="node-lxc210-nextcloud"})
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Paperless ingest metrics are not being reported"
          description: "paperless_inbox_scan_last_run_timestamp_seconds is absent on node-lxc210-nextcloud. Either the textfile collector is not read or paperless-inbox-scan.service has never completed since the script gained its mount check."
