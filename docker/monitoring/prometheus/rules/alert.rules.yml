groups:
  - name: node
    rules:
      - alert: NodeDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for more than 2 minutes."

      # Percentage is the right measure for a root filesystem and the wrong one for
      # an archive. Before 2026-07-10 this rule fired 21 times at once, all of them
      # the same fact: the MergerFS pool, its five member disks, and the twelve CIFS
      # mounts through which other nodes see that pool, each nearly full. 15% of a
      # multi-terabyte archive is a large absolute amount - a threshold a pool
      # designed to fill will never meet again. An alert that is always red is
      # not read.
      #
      # Excluded here, and covered by ArchivePoolLowSpace below instead:
      #   - cifs: a remote view of storage some other node owns; that node alerts.
      #   - the MergerFS pool and its member disks on vm102.
      - alert: DiskSpaceCritical
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|cifs|fuse.mergerfs", mountpoint!~"/mnt/disk[0-9]+|/mnt/aux[0-9]+TB"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs|cifs|fuse.mergerfs", mountpoint!~"/mnt/disk[0-9]+|/mnt/aux[0-9]+TB"}
          ) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 15% free ({{ $value | printf \"%.1f\" }}% remaining)."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage on {{ $labels.instance }} is above 90% ({{ $value | printf \"%.1f\" }}% used)."

      - alert: PostgreSQLBackupStale
        expr: (time() - pg_backup_last_success_timestamp) > 90000
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL backup is stale"
          description: "Last successful pg_dumpall on CT260 was more than 25 hours ago."

      # Same 25-hour threshold and the same blind spot as the PostgreSQL rule
      # above: it means "not more than 25 hours of uptime without a backup", not
      # "a backup every day", because Prometheus runs on the host that powers
      # down overnight and the timer's Persistent=true catch-up refreshes the
      # timestamp before Prometheus is back to look. Deliberately not corrected
      # here -- on a host that sleeps by design, an alert for "the host was off"
      # is noise, and the honest fix is the external heartbeat on the backlog.
      - alert: MariaDBBackupStale
        expr: (time() - mariadb_backup_last_success_timestamp) > 90000
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "MariaDB backup is stale"
          description: "Last successful mariadb-dump on CT210 was more than 25 hours ago. Nextcloud's file data is on the archive pool; without this database those files are unusable."

      # 40 days, against a monthly schedule: one missed run is slack, two is a
      # fault. Note this rule cannot fire while the metric has never been written
      # at all -- an absent series produces no result -- which it shares with
      # PostgreSQLBackupStale above. The first successful run arms it.
      - alert: PostgreSQLRestoreTestStale
        expr: (time() - pg_restore_test_last_success_timestamp) > 3456000
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL restore validation is overdue"
          description: "The last successful restore test on CT260 was more than 40 days ago. Dumps are still being written, but nothing has proven they can be read back."

  - name: postgres
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter cannot reach the database"
          description: "postgres_exporter on {{ $labels.instance }} reports pg_up=0 for more than 2 minutes. The database may be down or unreachable."

      - alert: PostgreSQLConnectionsHigh
        expr: sum by (instance) (pg_stat_activity_count{datname!~"template.*|postgres"}) / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection usage high on {{ $labels.instance }}"
          description: "Active connections exceed 80% of max_connections on {{ $labels.instance }} ({{ $value | printf \"%.1f\" }}% used)."

  - name: snapraid
    rules:
      - alert: SnapRAIDSyncStale
        expr: (time() - snapraid_sync_last_success_timestamp) > 93600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "SnapRAID sync is stale"
          description: "Last successful snapraid sync on VM102 was more than 26 hours ago."

      - alert: SnapRAIDScrubStale
        expr: (time() - snapraid_scrub_last_success_timestamp) > 2764800
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "SnapRAID scrub is stale"
          description: "Last successful snapraid scrub on VM102 was more than 32 days ago."

  - name: storage
    rules:
      # The MergerFS archive is meant to fill, so a percentage threshold says
      # nothing. What matters is whether the next write fits. Read-only consumers
      # (Jellyfin, Audiobookshelf, Calibre) are unaffected either way; the write
      # consumers - Nextcloud, Paperless, Vaultwarden, and the nightly pg_dumpall,
      # whose target /mnt/backups lives on this pool - will hit ENOSPC. Capacity
      # expansion is the lever, not deletion, so this is a warning with a long
      # window, not a page.
      #
      # 100 GiB ~= two days of headroom at the observed growth rate. Measured on
      # vm102, which owns the pool; the CIFS mounts on consumer nodes are views of
      # this same filesystem and are excluded from DiskSpaceCritical for that reason.
      - alert: ArchivePoolLowSpace
        expr: node_filesystem_avail_bytes{fstype="fuse.mergerfs"} < 100 * 1024 * 1024 * 1024
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "MergerFS archive pool below 100 GiB free on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} has {{ $value | humanize1024 }}B free. Write consumers (Nextcloud, Paperless, Vaultwarden, pg_dumpall to /mnt/backups) will fail with ENOSPC before read consumers notice. Expand capacity."

      # The share model on vm102 grants each consumer access through a group. That
      # only holds while the group is the path actually being used, and from the
      # pool's creation on 2025-12-26 until 2026-08-16 it was not: every object
      # also carried read permission for "other", so access worked regardless of
      # what the groups said. The sweep that found it counted the wrong groups
      # and zero objects a service could not read.
      #
      # The metric behind this rule exists so that the intended mechanism is the
      # only mechanism, and so that a return to the old state is visible.
      #
      # for: 1h because a repair run produces transient drift while it works, and
      # because a weakened boundary is not an outage.
      - alert: StoragePermissionDrift
        expr: sum(storage_permission_violations) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Storage permission matrix violated on {{ $labels.instance }}"
          description: "{{ $value }} objects on the MergerFS branches deviate from the target matrix in /etc/storage-permissions.conf. Run `storage-permissions.sh --check` on vm102 for the breakdown, `--apply` to repair. See docs/platform/storage-permissions.md."

      # Without this, a check that stops running looks exactly like a check that
      # keeps passing - the metric simply holds its last value forever. Every
      # textfile collector on this platform needs its own staleness rule for that
      # reason; LvmThinMetricsStale is the same guard one layer down.
      - alert: StoragePermissionCheckStale
        expr: (time() - storage_permission_check_timestamp_seconds) > 172800
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Storage permission check is stale"
          description: "The permission matrix on vm102 has not been verified for more than 48 hours. The timer runs daily with Persistent=true, so two missed days means the unit is failing, not that the host was off."

  - name: lvm
    rules:
      # A thin pool is a block-layer object with no filesystem and no mount point, so
      # node_filesystem_* cannot see it and no DiskSpaceCritical-style rule can be written
      # against it. The metrics below come from lvm-thin-metrics.sh, a node_exporter textfile
      # collector on the Proxmox host (added 2026-08-10). Before that the pool was unobservable:
      # it was found at 92.55% by a manual audit, thirteen days after being recorded at 86.15%.
      #
      # Why this matters more than a full filesystem: overflowing a thin pool corrupts whatever
      # was mid-write, which on this host means packages during apt. That is KE-7, and it has
      # already happened here once.
      #
      # Thresholds are set against a measured ~0.49 pp/day: 85% leaves roughly a month before
      # the pool is full, 90% roughly three weeks. Both are long windows on purpose, because
      # the remedy is slow. Check lvm_vg_free_bytes before reaching for `lvextend` - on this
      # host it is 0, the VG is fully allocated, and extending the pool first requires shrinking
      # root/swap or adding a PV. See runbooks/platform/lvm-thin-pool-full.md.
      - alert: LvmThinPoolWarning
        expr: lvm_thin_pool_data_percent > 85
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Thin pool {{ $labels.vg }}/{{ $labels.lv }} at {{ $value | printf \"%.2f\" }}% allocated"
          description: "Allocation is above 85% on {{ $labels.instance }}. Run lxc-fstrim.service first - containers cannot trim themselves, so freed blocks stay allocated until the host does it. If that does not help, the pool is genuinely growing and needs capacity, not reclaim."

      - alert: LvmThinPoolCritical
        expr: lvm_thin_pool_data_percent > 90
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Thin pool {{ $labels.vg }}/{{ $labels.lv }} at {{ $value | printf \"%.2f\" }}% allocated"
          description: "Overflow corrupts in-flight writes across every guest on this pool (KE-7). Do not start an apt upgrade. Reclaim via lxc-fstrim.service, then check lvm_vg_free_bytes to see whether lvextend is even available."

      # Metadata exhaustion is the worse failure: the pool flips read-only and recovery is far
      # more involved than for a full data area. It sits at ~3.4% here, so any approach to 80%
      # is anomalous rather than gradual, and 15m is enough of a window.
      - alert: LvmThinPoolMetadataCritical
        expr: lvm_thin_pool_metadata_percent > 80
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Thin pool {{ $labels.vg }}/{{ $labels.lv }} metadata at {{ $value | printf \"%.2f\" }}%"
          description: "Metadata exhaustion makes the pool read-only. This is not the same failure as a full data area and is harder to undo."

      # The collector exits non-zero on failure, so a broken run reaches SystemdUnitFailed. That
      # does not cover the timer being stopped or masked, in which case the last .prom file stays
      # in place and every rule above keeps evaluating a frozen value that looks healthy. Alert on
      # the file's age instead - the same "absence of a failure is not success" trap that hid the
      # container fstrim units for months.
      - alert: LvmThinMetricsStale
        # node_exporter labels this with the *full path*, not the basename, so an exact match on
        # "lvm-thin.prom" silently matches nothing and the alert never fires. Anchored regex
        # instead, which also survives the textfile directory moving when the host is adopted
        # into Ansible.
        expr: time() - node_textfile_mtime_seconds{file=~".*/lvm-thin\\.prom$"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LVM thin-pool metrics on {{ $labels.instance }} are stale"
          description: "lvm-thin.prom has not been rewritten for over 15 minutes (timer runs every 60s). Every LvmThinPool* rule is now evaluating a frozen value. Check lvm-thin-metrics.timer on the Proxmox host."

  - name: systemd
    rules:
      # A unit stuck in `failed` fits none of the other alert categories: the node
      # is up (NodeDown quiet), the disk is fine, and blackbox only knows whether a
      # port answers. calibre-import.service failed every 2 minutes for a month
      # while every dashboard stayed green (KE-15).
      #
      # `for: 15m` absorbs boot-window transients - units that fail once because a
      # network mount is not up yet and succeed on the next trigger. Anything still
      # failed a quarter of an hour after the fact is a real fault.
      #
      # This rule deliberately carries no exception list. Units that can never
      # succeed on a node are masked or removed at the source by the
      # `systemd_hygiene` Ansible role, so that every alert here means something.
      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "systemd unit {{ $labels.name }} failed on {{ $labels.instance }}"
          description: "{{ $labels.name }} has been in the failed state on {{ $labels.instance }} for more than 15 minutes. Check `systemctl status {{ $labels.name }}` and `journalctl -u {{ $labels.name }}` on the node."

  - name: backup
    rules:
      # Weekly job, so the threshold is one missed run plus margin rather than a
      # tight fit. The host sleeps two thirds of the day and the timer carries
      # Persistent=true, which means a slot missed while the machine was off is
      # made up at the next boot -- an alert at eight days would fire on a normal
      # late catch-up and teach everyone to ignore it.
      - alert: GuestBackupStale
        expr: (time() - guest_backup_last_run_timestamp_seconds) > 864000
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Guest backup is stale"
          description: "The last vzdump run of all VMs and LXCs finished more than 10 days ago. Every guest root disk lives in one thin pool on the boot SSD, so this is the only copy of the machines themselves."

      # Separate from the unit failing. The script keeps going after a guest
      # errors, on purpose -- the guest list is ordered by value and aborting at
      # the first fault would sacrifice every guest after it -- so a partial run
      # exits non-zero AND leaves this counter above zero. SystemdUnitFailed sees
      # the run; this says how much of it was lost.
      - alert: GuestBackupPartial
        expr: guest_backup_failed_guests > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} guest(s) failed to back up"
          description: "The last vzdump run completed with {{ $value }} guest(s) exiting non-zero. Check `journalctl -u guest-backup.service` for which."

      # The case the two rules above cannot express. Both compare against a
      # metric, so both go silent -- not red -- if the collector stops writing or
      # the job was never installed on a rebuilt host. absent() is the only form
      # that fires on nothing being there, the same reason LvmThinMetricsStale
      # exists next to the thresholds it guards.
      - alert: GuestBackupMetricsMissing
        expr: absent(guest_backup_last_run_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No guest backup metrics are being reported"
          description: "guest_backup_last_run_timestamp_seconds is absent. Either the job was never deployed on this host, or its textfile collector stopped writing - both read as green on every other backup rule."

    # Known limitation, recorded rather than worked around. Prometheus runs on
    # lxc200, on the host these backups protect, so none of these rules can see
    # an outage of that host: no scrape happens, and Persistent=true refreshes
    # the timestamp before Prometheus is back. They mean "not more than 10 days
    # of uptime without a backup", not "a backup every 10 days". Identical class
    # to PostgreSQLBackupStale, and to the host node_exporter whose own failure
    # stopped the host from reporting it. The general fix is the external
    # heartbeat in remediation-plan.md Tier 4, not a different threshold here.

  - name: offsite
    rules:
      # The run reports its own outcome rather than leaving the alert to infer it
      # from a timestamp. A restic run that fails halfway still updates nothing
      # else, so without this the only symptom would be staleness a day later.
      - alert: OffsiteBackupFailed
        expr: offsite_backup_success == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Off-site backup on {{ $labels.instance }} did not complete"
          description: "The last off-site run exited non-zero. Read `journalctl -u offsite-backup.service` on the node; the runbook is runbooks/backup/offsite-backup.md."

      # 50 hours, not 25: the job runs daily but the host sleeps overnight and a
      # first upload over a domestic uplink can outlast a single waking day.
      #
      # This rule shares the blindness PostgreSQLBackupStale already documents.
      # Prometheus runs on the same site as the thing it watches, so a period
      # with the host off produces no scrape, and Persistent=true refreshes the
      # timestamp before Prometheus is back. It means "not more than 50 hours of
      # uptime without an off-site copy", which is a weaker sentence than it
      # looks and is deliberately not fixed here - the answer to that class is
      # the external heartbeat in the remediation plan, not a longer window.
      - alert: OffsiteBackupStale
        expr: time() - offsite_backup_last_run_timestamp_seconds > 180000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No off-site backup from {{ $labels.instance }} in over two days"
          description: "offsite_backup_last_run_timestamp_seconds is {{ $value | humanizeDuration }} old."

      # Reading the repository's structure proves it is consistent; reading data
      # back proves the bytes are there. The weekly sample is what separates this
      # from the guards this platform keeps finding fault with - smart_health_passed,
      # SnapRAIDScrubStale - which report that a job ran rather than that it
      # achieved anything.
      - alert: OffsiteBackupUnverified
        expr: time() - offsite_backup_last_verify_timestamp_seconds > 1296000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Off-site data from {{ $labels.instance }} has not been read back in 15 days"
          description: "The weekly --read-data-subset check has not run. The repository may be structurally sound and unreadable in substance."

      # Absent is not zero. A node that never deploys the role, or whose textfile
      # write fails, exports nothing at all - which every rule above reads as
      # silence rather than as a fault.
      - alert: OffsiteBackupMetricsMissing
        expr: absent(offsite_backup_success)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No off-site backup metrics on the fleet"
          description: "offsite_backup_success is absent everywhere. Either no node runs the role or the textfile collector is not being read."

  - name: snapshot
    rules:
      # The weekly snapshot of the fleet's unmanaged surface. Fourteen days is one
      # missed Sunday plus margin: the host sleeps nightly and the timer carries
      # Persistent=true, so a Sunday spent powered down is made up at the next
      # boot and a tighter threshold would fire on an ordinary catch-up.
      - alert: FleetSnapshotStale
        expr: (time() - fleet_snapshot_last_run_timestamp_seconds) > 1209600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Fleet snapshot is stale"
          description: "No fleet snapshot has completed for more than 14 days. Nothing is comparing the fleet's listening sockets, local unit files, crontabs and mounts against last week's."

      # A snapshot taken while three nodes were unreachable records those three as
      # empty and writes that as the new baseline; next week their real state
      # returns and reads as fresh drift. Worse, the run in between looks clean.
      # This is the guard-cannot-measure case stated as a metric rather than left
      # to whoever opens the diff.
      - alert: FleetSnapshotIncomplete
        expr: fleet_snapshot_hosts_recorded < fleet_snapshot_hosts_expected
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Fleet snapshot covered {{ $value }} of the expected hosts"
          description: "At least one inventory host did not answer during the last snapshot. Its file reads [unreachable], which is deliberately not the same as an empty one."

    # There is deliberately no rule on fleet_snapshot_changed_lines. Drift here is
    # the expected weekly output, not a fault, and an alert that nobody can clear
    # by acting on it becomes the permanent red that Check 23's rationale in
    # CLAUDE.md argues against. The metric is exported so the count is visible in
    # a dashboard and in the review; the judgement about whether a change matters
    # stays with the person reading the diff.

  - name: drift
    rules:
      # The weekly sweep runs every playbook in ansible/drift-sweep.conf with
      # --check and counts the tasks that would change. `unexpected` is that
      # count minus the baseline in the same file, so drift held on purpose - the
      # hypervisor's hand-written sshd drop-in, its node_exporter, the unapplied
      # homelab_schedule - does not keep this permanently red. Anything above the
      # baseline is a node running something the repository does not describe.
      - alert: FleetDriftUnexpected
        expr: fleet_drift_unexpected_total > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} task(s) drifted beyond the recorded baseline"
          description: "The weekly check-mode sweep found changes no baseline entry accounts for. Read /var/lib/fleet-drift/report.txt on lxc250 for the playbook and host."

      # Fourteen days is one missed Sunday plus margin, matching the snapshot rule
      # beside it: the host sleeps nightly and Persistent=true makes an overdue
      # sweep run at the next boot rather than at the scheduled minute.
      - alert: FleetDriftStale
        expr: (time() - fleet_drift_last_run_timestamp_seconds) > 1209600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Drift sweep is stale"
          description: "No check-mode sweep has completed for more than 14 days. Nothing is comparing the repository against what the fleet runs."

      # A sweep that could not run half its playbooks reports little drift and
      # looks reassuring. The count of what could not be measured therefore gets
      # its own rule rather than a line in a report nobody opens.
      - alert: FleetDriftIncomplete
        expr: (fleet_drift_playbooks_errored > 0) or (fleet_drift_hosts_unreachable > 0)
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Drift sweep could not measure everything"
          description: "At least one playbook produced no usable recap, or a host was unreachable. The drift figures from this run are a lower bound, not a result."

      # The layer a check run cannot reach. prometheus_config promotes the rules
      # file and reloads; if that reload failed, the file on disk matches the
      # repository while the rules in memory are the previous set - the shape of
      # KE-16, where a renewed certificate sat on disk beside the expired one
      # Apache was still serving.
      - alert: FleetRulesMismatch
        expr: fleet_drift_rules_mismatch > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} alert name(s) differ between the repository and Prometheus"
          description: "The alert rules Prometheus has loaded are not the rules this repository holds. Either the rules file was never deployed, or it was deployed and the reload did not take."

      # Distinct from the rule above on purpose: that one means the comparison ran
      # and found a difference, this one means it never ran. Absence of a mismatch
      # is not agreement.
      - alert: FleetRulesUnverified
        expr: fleet_drift_rules_check_ok == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Loaded alert rules could not be compared"
          description: "The last sweep could not read /api/v1/rules from the monitoring node, so nothing is checking that Prometheus loaded what the repository holds."

  - name: kernel
    rules:
      # Added 2026-08-20 after a kernel oops cascade wedged the hypervisor for
      # two hours. node_exporter sets this label whenever a filesystem stops
      # answering `statfs` within its mount timeout - it is the only collector
      # with such a timeout, which is why it kept reporting while everything
      # else on the host blocked.
      #
      # During the incident the value read 1 for /var/lib/lxcfs from the first
      # minute, in every single scrape, and nothing looked at it. Same class as
      # `smart_health_passed` reading PASSED on a disk with 7680 unreadable
      # sectors: the measurement existed, the guard did not.
      #
      # Five minutes, not fifteen: a wedged FUSE mount is repairable by
      # restarting its daemon only while sessions can still be created. Past
      # that point systemd itself is caught and the only way out is a reset.
      - alert: FilesystemMountTimeout
        expr: node_filesystem_device_error > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is not answering"
          description: "node_exporter cannot stat {{ $labels.mountpoint }} ({{ $labels.fstype }}). If this is a FUSE mount, restart its daemon NOW - once systemd is caught, only a hard reset remains. See runbooks/platform/hard-shutdown-recovery.md."

      # SystemdUnitFailed cannot express this, and the difference is structural
      # rather than a matter of thresholds. A unit that hangs stays `activating`
      # forever and never becomes `failed`, because it never reaches a timeout.
      # Three units sat in `activating` for two hours on 2026-08-20 while the
      # failed-unit rule read green - correctly, by its own definition.
      #
      # Thirty minutes tolerates the slow-but-legitimate cases (a Type=notify
      # service waiting on a network dependency, a long fsck) without tolerating
      # a hang.
      #
      # `.device` units are excluded, and the exclusion is not a threshold
      # adjustment. systemd holds a device unit in `activating (tentative)` for
      # as long as udev has not tagged the device with `systemd`, which for some
      # devices is forever. Measured on the hypervisor on 2026-09-09:
      # `dev-fuse.device` reads `activating/tentative` with an empty
      # `ActiveEnterTimestamp` - it has never been active and never will be -
      # while `/dev/fuse` is open by lxcfs and pmxcfs and works. The rule was
      # written on 2026-09-08 and this was its first real firing, on a device
      # that is not broken, on a host that would have reported it after every
      # single boot. An alert that is red by construction is one people learn to
      # dismiss, which would have cost the rule the service hangs it exists for.
      - alert: SystemdUnitStuckActivating
        expr: node_systemd_unit_state{state="activating", name!~".*\\.device"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} stuck activating on {{ $labels.instance }}"
          description: "Unit {{ $labels.name }} has been activating for over 30 minutes. A hung unit never becomes `failed`, so SystemdUnitFailed cannot see it."

  - name: smart
    rules:
      # Growth, not level. Three of the nine disks would trip a level-based rule
      # the day it was written - the KE-13 aux-disk alone reports 21 reported
      # uncorrectable errors and 7680 pending sectors - and a rule that is red
      # from the first day is a rule people learn to scroll past. What nobody
      # could see until now is the thing that actually matters: whether those
      # numbers are still moving. They were read by hand on four dates between
      # 2026-06-25 and 2026-08-13 to answer that question.
      #
      # 25h, not 24h: the host powers down overnight, so a 24-hour window can
      # close entirely inside a period with no scrapes in it.
      - alert: SmartAttributeDegrading
        expr: |
          (increase(smartmon_reported_uncorrect_raw_value[25h]) > 0)
          or (increase(smartmon_current_pending_sector_raw_value[25h]) > 0)
          or (increase(smartmon_offline_uncorrectable_raw_value[25h]) > 0)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.disk }} on {{ $labels.instance }} gained unreadable sectors in the last day"
          description: "A SMART error counter on {{ $labels.disk }} rose within 25 hours. The disk is degrading now, not historically. Read `smartctl -A` on the host and match the device against smartmon_device_info - the kernel letter is not stable across boots."

      # A level rule is right for this one: every disk on this host reads 0, and
      # the first reallocation is the event worth waking up for. Reallocation
      # means the drive has spent a spare block, which pending sectors have not
      # yet done.
      - alert: SmartReallocatedSectors
        expr: smartmon_reallocated_sector_ct_raw_value > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.disk }} on {{ $labels.instance }} has reallocated sectors"
          description: "smartmon_reallocated_sector_ct_raw_value is {{ $value }} on {{ $labels.disk }}. Every disk here read 0 when this rule was written, so any value is new."

      # The normalised value, which runs 100 down to the threshold, not the raw
      # program-erase count. The boot SSD reads 47 at 639 cycles with a threshold
      # of 0, so 20 leaves roughly the same margin again before the vendor calls
      # the drive spent. It is the only SSD on this host and therefore the only
      # disk carrying the attribute.
      - alert: SmartWearLevelingLow
        expr: smartmon_wear_leveling_count_value < 20
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.disk }} on {{ $labels.instance }} is near its rated write endurance"
          description: "Normalised wear leveling is {{ $value }} on {{ $labels.disk }}. This disk carries every guest root disk; see KE-14."

      # The absence rule the other three depend on. A collector that stops
      # running exports nothing, and nothing is what a healthy disk also looks
      # like to a rule written as `> 0`. Same construction as
      # LvmThinMetricsStale and PostgreSQLRestoreTestStale.
      #
      # The timer runs every 15 minutes; two hours tolerates a boot window and a
      # missed run without reporting on a host that is merely asleep.
      - alert: SmartMetricsStale
        expr: time() - max by (instance) (smartmon_smartctl_run) > 7200
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SMART metrics on {{ $labels.instance }} are stale"
          description: "No smartmon collector run in over two hours. Disk degradation is unobserved while this is firing, which is the state the platform was in until 2026-09-09."

    # All nine disks are attached to the Proxmox HOST; VM102 reaches seven of them by
    # `by-id` passthrough and sees only virtio-SCSI devices, so SMART data is
    # readable only on the host. An earlier version of this comment named VM102 as
    # the target and was wrong (see KE-14).
    #
    # The metrics come from Debian's prometheus-node-exporter-collectors
    # (`smartmon.sh`), deployed by the `smart_metrics` role. They replaced a
    # hand-written collector that exported `smart_health_passed` and
    # `smart_temperature_celsius` and nothing else. The first of those read 1 for
    # the disk with 7680 unreadable sectors, because Current_Pending_Sector
    # normalises to VALUE=054 against THRESH=000 and can never trip the drive's
    # own self-assessment. An alert on it would have been worse than none.

  - name: blackbox
    rules:
      - alert: ServiceDown
        expr: probe_success == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "blackbox probe for {{ $labels.service }} ({{ $labels.instance }}) reports probe_success=0 for more than 3 minutes. A node can be up while its service is not answering (see KE-8)."
