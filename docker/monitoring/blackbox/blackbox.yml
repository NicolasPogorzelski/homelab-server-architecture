modules:
  # Plain HTTP on vm100's Tailscale address: Jellyfin (bound directly),
  # Audiobookshelf and llama-server (loopback behind `tailscale serve --tcp`).
  # Up = a 2xx answer.
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  # HTTPS services reached by MagicDNS name on :443 (Paperless, OpenWebUI,
  # Nextcloud, Calibre-Web). Auth redirects and denials prove the process is
  # alive, so 3xx/401/403 count as up; 5xx and no answer do not.
  http_service_up:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200, 301, 302, 401, 403]
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
