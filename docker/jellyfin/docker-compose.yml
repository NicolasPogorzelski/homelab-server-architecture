services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11  # pinned to running version (2026-06-17)
    container_name: jellyfin
    pid: "host"
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - TZ=${TZ}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES}
    volumes:
      - ${JF_CONFIG}:/config
      - ${JF_CACHE}:/cache
      - ${JF_METADATA}:/metadata
      - ${JF_MEDIA_FILME}:/media/Filme:ro
      - ${JF_MEDIA_SERIEN}:/media/Serien:ro
    ports:
      # Bound to vm100's Tailscale address, not to loopback behind `tailscale serve`:
      # the serve forwarder stalled streams (KE-28). Left empty, the address would
      # bind every interface; docker_compose_update refuses a node whose .env lacks it.
      - "${JELLYFIN_BIND_ADDR}:${JELLYFIN_PORT}:8096"
