services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.1  # pinned; released 2026-09-29
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ABS_HOST_PORT}:80"
    environment:
      - TZ=${TZ}
    volumes:
      - "${ABS_DATA_ROOT}/config:/config"
      - "${ABS_DATA_ROOT}/metadata:/metadata"
      - "${ABS_AUDIOBOOKS_ROOT}:/audiobooks:ro"
      - "${ABS_PODCASTS_ROOT}:/podcasts:ro"
