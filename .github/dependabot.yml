# Dependabot version updates for GitHub Actions only.
#
# Version updates (this file) propose every newer version; security updates (a
# repository setting, enabled) propose a fix only when an advisory affects a
# version in use. The Docker images in docker/ are not listed: they are pinned
# and updated deliberately through the docker_compose_update role, and their
# exposure is reported by .github/workflows/image-scan.yml.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      # Friday, so updates are reviewed in the weekly fleet audit.
      day: "friday"
    open-pull-requests-limit: 5
    commit-message:
      # Emits `ci(deps): ...`, which satisfies scripts/commit-msg-lint.sh.
      prefix: "ci"
      include: "scope"
