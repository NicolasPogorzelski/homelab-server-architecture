name: SBOM and signature verification

# Exercise control (docs/decisions/exercise-scope-before-terraform.md). Monthly,
# for every image pinned in docker/: an SPDX SBOM kept as a run artifact for 90
# days, and whether cosign can verify any signature for the image. Reports, never
# gates.

on:
  workflow_dispatch:
  schedule:
    # Monthly on the 2nd, the day after the PostgreSQL restore test.
    - cron: "0 7 2 * *"

permissions:
  contents: read

jobs:
  collect:
    name: Collect pinned images
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image list from the compose files
        id: list
        # Same derivation as image-scan.yml: the compose files own the image list.
        run: |
          images="$(grep -rhoP '^\s*image:\s*\K\S+' docker/ | sort -u | jq -R . | jq -sc .)"
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "Found $(echo "${images}" | jq 'length') images" >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: SBOM for ${{ matrix.image }}
    needs: collect
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.collect.outputs.images) }}
    steps:
      - name: Derive a stable artifact name
        id: slug
        # Through the environment, not `${{ }}` in the script (see image-scan.yml).
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          slug="$(printf '%s' "${IMAGE}" | tr '/:@' '___' | tr -cd 'A-Za-z0-9._-')"
          echo "value=${slug}" >> "$GITHUB_OUTPUT"

      - name: Generate the SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}
          format: spdx-json
          output-file: sbom-${{ steps.slug.outputs.value }}.spdx.json
          upload-artifact: false

      - name: Summarise what is in the image
        env:
          IMAGE: ${{ matrix.image }}
          SBOM: sbom-${{ steps.slug.outputs.value }}.spdx.json
        run: |
          packages="$(jq '[.packages[]?] | length' "${SBOM}")"
          printf -- '- `%s` - packages: **%s**\n' "${IMAGE}" "${packages}" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ steps.slug.outputs.value }}
          path: sbom-${{ steps.slug.outputs.value }}.spdx.json
          retention-days: 90

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Can this image's provenance be shown at all?
        env:
          IMAGE: ${{ matrix.image }}
        # Never fails the job; most images here are unsigned community builds.
        # The regexps accept any signer: this asks whether a verifiable
        # signature exists, not whether the signer is trusted.
        run: |
          if cosign verify \
               --certificate-identity-regexp '.*' \
               --certificate-oidc-issuer-regexp '.*' \
               "${IMAGE}" > cosign.out 2> cosign.err; then
            signer="$(jq -r '.[0].optional.Issuer // "unknown issuer"' cosign.out 2>/dev/null || echo 'unparsed')"
            printf -- '  - signature: **verified** (%s)\n' "${signer}" >> "$GITHUB_STEP_SUMMARY"
          else
            printf -- '  - signature: none that cosign could verify\n' >> "$GITHUB_STEP_SUMMARY"
          fi
