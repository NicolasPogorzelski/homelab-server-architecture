name: Commit messages

# Checks every commit in the pull request for the Conventional Commits format and
# refuses attribution trailers; the title and body are checked for trailers only.
# Runs in CI because the local commit-msg hook is per-clone configuration.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        # Pinned to a commit SHA because tags can be repointed; the trailing comment names
        # the version, and Dependabot updates both together.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default shallow clone cannot walk base..head.
          fetch-depth: 0

      - name: Lint every message in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x scripts/commit-msg-lint.sh
          failed=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            git log -1 --format=%B "$sha" > "${RUNNER_TEMP}/msg.txt"
            printf '%s %s\n' "${sha:0:9}" "$(git log -1 --format=%s "$sha")"
            ./scripts/commit-msg-lint.sh "${RUNNER_TEMP}/msg.txt" || failed=1
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          exit "$failed"

      # Title and body pass through the environment: interpolating `${{ }}` into the
      # script would splice author-controlled text into the shell.
      - name: Lint the pull request title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          { printf '%s\n\n' "$PR_TITLE"; printf '%s\n' "$PR_BODY"; } > "${RUNNER_TEMP}/pr.txt"
          ./scripts/commit-msg-lint.sh --attribution-only "${RUNNER_TEMP}/pr.txt"
