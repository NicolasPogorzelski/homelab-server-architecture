name: Image vulnerability scan

# Weekly CVE report for every image pinned in docker/. Pinned images age between
# updates; this measures how exposed they are, while Dependabot version updates
# for them stay off (see .github/dependabot.yml).
#
# Reports, does not gate: it is not a pull-request check, because an upstream CVE
# is not a defect in the change under review.
#
# Two outputs: the run summary carries per-image CRITICAL and HIGH counts as the
# weekly trend; the Security tab receives CRITICAL only, so it stays small enough
# to triage (uploading HIGH as well produced thousands of alerts). GitHub re-rates
# uploaded findings from the CVSS score in the SARIF, so its severity column can
# read lower than Trivy's.

on:
  schedule:
    # Friday 06:00 UTC, before the weekly fleet audit.
    - cron: "0 6 * * 5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/**/docker-compose.yml"
      - ".github/workflows/image-scan.yml"

permissions:
  contents: read
  # Required to publish SARIF results into the repository's Security tab.
  security-events: write

jobs:
  collect:
    name: Collect pinned images
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image list from the compose files
        id: list
        # The compose files own the image versions, so the list cannot drift. `\K` drops the
        # `image:` prefix; `\S+` stops before a trailing comment.
        run: |
          images="$(grep -rhoP '^\s*image:\s*\K\S+' docker/ | sort -u | jq -R . | jq -sc .)"
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "Found $(echo "${images}" | jq 'length') images" >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Scan ${{ matrix.image }}
    needs: collect
    runs-on: ubuntu-24.04
    strategy:
      # One vulnerable image must not hide the results for the others.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.collect.outputs.images) }}
    steps:
      - name: Derive a stable SARIF category
        id: slug
        # Passed through the environment: `${{ }}` is substituted before the shell parses the
        # line, so metacharacters in the value would be executed rather than quoted.
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          slug="$(printf '%s' "${IMAGE}" | tr '/:@' '___' | tr -cd 'A-Za-z0-9._-')"
          echo "value=${slug}" >> "$GITHUB_OUTPUT"

      - name: Trivy scan - counts for the trend metric
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH
          # Only findings with an upstream fix: those are the ones an update can act on.
          ignore-unfixed: true
          # Never fail the run; this workflow reports, it does not gate.
          exit-code: "0"

      - name: Write the counts to the run summary
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          crit="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy.json)"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy.json)"
          printf -- '- `%s` - critical: **%s**, high: **%s**\n' "${IMAGE}" "${crit}" "${high}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy scan - critical only, for the Security tab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Publish results to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          # One category per image; otherwise each upload overwrites the previous one.
          category: trivy-${{ steps.slug.outputs.value }}
