name: Ansible-lint

on:
  push:
  pull_request:
    branches: [main]

jobs:
  Ansible_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        # See the note in validate-repo.yml: pinned to a SHA because a major-version tag is mutable.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install ansible-lint and collections
        run: |
          pip install 'ansible-lint==26.6.0'
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Provide a vault password file for syntax-check
        # ansible.cfg sets vault_password_file = ~/.vault_pass. ansible-lint runs
        # `ansible-playbook --syntax-check` per role, which parses (but never
        # decrypts) the committed !vault vars in group_vars/all/vault.yml. Without
        # the file present, every syntax-check aborts with an internal-error.
        # A dummy value suffices because syntax-check does not decrypt.
        run: echo 'ci-syntax-check-only' > ~/.vault_pass
      - name: Run ansible-lint
        run: cd ansible && ansible-lint .
