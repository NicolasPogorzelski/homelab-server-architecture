name: Validate Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pinned to a commit SHA, not a tag: `v4` is a moving reference the upstream owner can
        # repoint at any commit, so a compromised or mistaken retag would execute unreviewed code
        # in this workflow. The trailing comment carries the human-readable version, and Dependabot
        # updates both together.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run validation script
        run: |
          chmod +x scripts/validate-repo.sh
          ./scripts/validate-repo.sh
