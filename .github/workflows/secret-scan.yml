name: Secret scan

# Check 3 catches committed .env files and Check 9 catches private keys, both by
# pattern. Neither sees a token pasted into a YAML value, a connection string in
# a script, or a credential that was committed once and removed in a later
# commit - the last case being the one that matters, because git keeps it.
#
# gitleaks scans the history rather than the working tree, which is the part the
# repository's own validator structurally cannot do.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pinned to a commit SHA, not a tag: `v4` is a moving reference the upstream owner can
        # repoint at any commit, so a compromised or mistaken retag would execute unreviewed code
        # in this workflow. The trailing comment carries the human-readable version, and Dependabot
        # updates both together.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret that was committed and then removed is still in the objects,
          # and a shallow clone would report the repository clean.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for organization accounts only. This repository belongs
          # to a personal account, so no secret is needed and none is referenced.
