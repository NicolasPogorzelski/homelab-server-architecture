---
# Every guest. lxc200 runs this native exporter on 9101 with the systemd
# collector next to the containerised one on 9100, which cannot see the host's
# systemd (docs/decisions/lxc200-systemd-visibility.md).
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Deploy node_exporter to the fleet
  hosts: guests
  become: true
  serial: 1
  # Any failed host stops the roll. serial: 1 alone does that; this keeps it
  # when the batch grows, where one failure in a batch would otherwise not stop it.
  max_fail_percentage: 0
  roles:
    - node_exporter

# The hypervisor is named separately, never swept in by `all` (see
# ssh-hardening.yml).
- name: Deploy node_exporter to the Proxmox host
  hosts: proxmox
  become: false # the inventory connects as root; there is no ansible user here
  roles:
    - node_exporter
