---
# Exercise, not a control this platform needs; scope and exit condition are in
# docs/decisions/exercise-scope-before-terraform.md.
#
# Central journal aggregation with systemd-journal-remote on lxc200 and
# systemd-journal-upload on the guests that opt in. The receiver play runs
# first, so uploaders never start against a missing listener.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Receive journals on the monitoring node
  hosts: lxc200
  become: true
  roles:
    - journal_remote

- name: Ship journals from the nodes that opt in
  hosts: guests
  become: true
  roles:
    - journal_upload
