---
# Per-attribute SMART export on the Proxmox host. Every disk is attached to the
# hypervisor; vm102 sees its passthrough disks as virtio-SCSI devices whose
# SMART data is empty, so the host is the only place they can be read.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Export SMART attributes from the Proxmox host
  hosts: proxmox
  become: false # the inventory already connects as root; there is no ansible user here
  roles:
    - smart_metrics
