---
# Targets the `offsite_sources` group because the C1 data
# (docs/platform/data-classification.md) is split: vm102 holds the user files
# and both dump sets, lxc250 the credentials every other restore needs. Which
# paths each node sends is set in host_vars.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Deploy off-site backups to the nodes holding C1 data
  hosts: offsite_sources
  become: true
  roles:
    - offsite_backup
