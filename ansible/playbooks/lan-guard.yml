---
# Drop new inbound connections on every node's LAN interface except the paths
# the platform needs. Roll out one node at a time with --limit; the tailnet,
# which Ansible connects over, is never filtered.
#
# Guests and hypervisor are separate plays (see ssh-hardening.yml).
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Guard every guest's LAN interface with an nftables table
  hosts: guests
  become: true
  roles:
    - lan_guard

- name: Guard the Proxmox host's LAN interface, with its break-glass paths
  hosts: proxmox
  become: true
  roles:
    - lan_guard
