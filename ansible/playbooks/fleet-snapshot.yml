---
# Record the surface of every node that no role manages, and diff it against
# the last run. `--check` (fleet-drift.yml) only sees state a role owns; this
# covers listening sockets, local unit files, root's crontab, mounts, running
# images and modified packaged files.
#
# Each projection is normalised (sorted, clocks and counters removed) so the
# diff carries only changes. `systemctl list-timers` is left out: its columns
# are all volatile, and which timers exist is in the unit-file projection.
#
# Read-only, so no preflight gate (same as fleet-health-check.yml).
- name: Collect the per-node snapshot
  hosts: all
  gather_facts: false
  # No play-level become. Four of the seven projections read world-readable
  # state; only root's crontab, the Docker socket and dpkg --verify need root,
  # so become sits on those three tasks.
  become: false

  tasks:
    # Ports in the ephemeral range (>= 32768) are dropped: Tailscale's peerapi
    # picks a new one per start. Every service on the platform listens below it.
    - name: Read the listening sockets
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          ss -H -tln | awk '{print $4}'
          | awk -F: '$NF < 32768' | sort -u
        executable: /bin/bash
      register: fs_listen
      changed_when: false
      failed_when: false

    - name: Read enabled and masked unit files
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          systemctl list-unit-files --state=enabled,masked --no-pager --no-legend
          | awk '{print $1, $2}' | sort
        executable: /bin/bash
      register: fs_units
      changed_when: false
      failed_when: false

    # A unit file under /etc/systemd/system that no role writes would be lost in
    # a rebuild. The type column separates masks (links to /dev/null) and
    # enablements (links into the unit directory) from real files.
    - name: List locally-defined unit files
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          find /etc/systemd/system -maxdepth 1 \( -name '*.service' -o -name '*.timer'
          -o -name '*.path' -o -name '*.mount' -o -name '*.socket' \)
          -printf '%f %y\n' 2>/dev/null | sort
        executable: /bin/bash
      register: fs_local_units
      changed_when: false
      failed_when: false

    # Needs root: `crontab -l -u root` is refused to other accounts.
    - name: Read root's crontab
      become: true
      ansible.builtin.shell:
        cmd: set -o pipefail; crontab -l -u root 2>/dev/null | grep -vE '^\s*(#|$)' | sort || true
        executable: /bin/bash
      register: fs_crontab
      changed_when: false
      failed_when: false

    # Container overlay mounts are excluded: their paths carry the container ID
    # and change on every restart.
    - name: Read the mount table
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          findmnt -rno TARGET,SOURCE,FSTYPE
          | grep -vE 'overlay|nsfs|[0-9a-f]{32}' | sort
        executable: /bin/bash
      register: fs_mounts
      changed_when: false
      failed_when: false

    # Needs root: the Docker socket is root-owned, and the ansible account is
    # deliberately not in the docker group, which would be equivalent to root.
    - name: Read the running container images
      become: true
      ansible.builtin.shell:
        cmd: set -o pipefail; docker ps --format '{{ "{{.Names}} {{.Image}}" }}' 2>/dev/null | sort || true
        executable: /bin/bash
      register: fs_docker
      changed_when: false
      failed_when: false
      when: "'docker' in group_names"

    # Needs root. Lists packaged files whose checksum no longer matches dpkg's
    # record, which catches in-place edits. Not an integrity control: the dpkg
    # database sits on the same filesystem it describes. Conffiles are excluded.
    - name: Read which packaged files no longer match their package
      become: true
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          dpkg --verify 2>/dev/null
          | grep -v '^..5...... c ' | sort || true
        executable: /bin/bash
      register: fs_dpkg
      changed_when: false
      failed_when: false

    - name: Assemble this node's snapshot
      ansible.builtin.set_fact:
        fs_snapshot: |
          [listen]
          {{ fs_listen.stdout | default('') }}
          [unit-files]
          {{ fs_units.stdout | default('') }}
          [local-units]
          {{ fs_local_units.stdout | default('') }}
          [crontab]
          {{ fs_crontab.stdout | default('') }}
          [mounts]
          {{ fs_mounts.stdout | default('') }}
          [containers]
          {{ fs_docker.stdout | default('') }}
          [package-integrity]
          {{ fs_dpkg.stdout | default('') }}

- name: Store and diff the snapshot on the control node
  hosts: lxc250
  gather_facts: true
  become: true

  vars:
    fs_root: /var/lib/fleet-snapshot
    # node_exporter_textfile_dir is a role default and no role is in scope here,
    # so fall back to the fleet-wide default unless the inventory overrides it.
    fs_textfile_dir: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile_collector') }}"
    # Hosts that answered, published next to the expected count so that a
    # partial snapshot raises FleetSnapshotIncomplete instead of reading clean.
    fs_reached: "{{ groups['all'] | map('extract', hostvars) | selectattr('fs_snapshot', 'defined') | list | length }}"
    fs_expected: "{{ groups['all'] | length }}"

  tasks:
    - name: Ensure the snapshot directories exist
      ansible.builtin.file:
        path: "{{ fs_root }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - current
        - previous

    - name: Rotate the previous snapshot
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          rm -rf {{ fs_root }}/previous &&
          cp -a {{ fs_root }}/current {{ fs_root }}/previous
        executable: /bin/bash
      changed_when: true

    - name: Write each node's snapshot
      ansible.builtin.copy:
        content: "{{ hostvars[item].fs_snapshot | default('[unreachable]\n') }}"
        dest: "{{ fs_root }}/current/{{ item }}.txt"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ groups['all'] }}"

    - name: Diff the two snapshots
      ansible.builtin.shell:
        cmd: >-
          diff -ru {{ fs_root }}/previous {{ fs_root }}/current
          > {{ fs_root }}/diff.txt 2>&1; true
        executable: /bin/bash
      changed_when: false

    - name: Count the changed lines
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          grep -cE '^[+-][^+-]' {{ fs_root }}/diff.txt || true
        executable: /bin/bash
      register: fs_diff_lines
      changed_when: false

    # Alerted on: run staleness and missing hosts. Not on the changed-line count,
    # because weekly drift is expected (see the note in alert.rules.yml).
    - name: Publish the snapshot metrics
      ansible.builtin.copy:
        content: |
          # HELP fleet_snapshot_last_run_timestamp_seconds Unix time of the last completed fleet snapshot.
          # TYPE fleet_snapshot_last_run_timestamp_seconds gauge
          fleet_snapshot_last_run_timestamp_seconds {{ ansible_date_time.epoch }}
          # HELP fleet_snapshot_changed_lines Added or removed lines between the last two snapshots.
          # TYPE fleet_snapshot_changed_lines gauge
          fleet_snapshot_changed_lines {{ fs_diff_lines.stdout | trim | default(0, true) }}
          # HELP fleet_snapshot_hosts_expected Hosts in the inventory at snapshot time.
          # TYPE fleet_snapshot_hosts_expected gauge
          fleet_snapshot_hosts_expected {{ fs_expected }}
          # HELP fleet_snapshot_hosts_recorded Hosts that answered and produced a snapshot.
          # TYPE fleet_snapshot_hosts_recorded gauge
          fleet_snapshot_hosts_recorded {{ fs_reached }}
        dest: "{{ fs_textfile_dir }}/fleet-snapshot.prom"
        owner: root
        group: root
        mode: "0644"

    - name: Report the outcome
      ansible.builtin.debug:
        msg:
          - "hosts recorded:  {{ fs_reached }} of {{ fs_expected }}"
          - "changed lines:   {{ fs_diff_lines.stdout | trim }}"
          - "diff:            {{ fs_root }}/diff.txt"
