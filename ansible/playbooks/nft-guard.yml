---
# Close ports that a service binds on the wildcard address with no option to
# bind elsewhere (Collabora on lxc210). vm102's hand-deployed smb_guard table
# follows the same pattern and is not yet managed by this role.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Guard locally-bound ports with an nftables table
  hosts: guests
  become: true
  roles:
    - nft_guard
