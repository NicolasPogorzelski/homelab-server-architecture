---
# Exercise, not a control this platform needs; scope and exit condition are in
# docs/decisions/exercise-scope-before-terraform.md. No Enforced control and no
# alert rule depends on it.
#
# Hypervisor only: the kernel audit subsystem is not namespaced, so a container
# cannot run its own audit daemon. The role asserts this.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Syscall auditing on the hypervisor
  hosts: proxmox
  become: true
  roles:
    - auditd
