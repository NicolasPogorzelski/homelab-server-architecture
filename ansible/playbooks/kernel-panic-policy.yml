---
# Reboot the hypervisor on a kernel oops instead of leaving it alive and
# unreachable (KE-21; docs/decisions/hypervisor-panic-and-watchdog.md).
#
# Hypervisor only. The LXCs share its kernel and cannot write these sysctls.
# The VMs run their own kernels, but vm100's freezes (KE-17, KE-20) left no
# oops, so panic_on_oops would not have caught them; extending the policy to
# the VMs is a separate decision.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Set the kernel panic policy on the Proxmox host
  hosts: proxmox
  become: false # the inventory already connects as root; there is no ansible user here
  roles:
    - kernel_panic_policy
