---
# Every guest: security updates only, kernels held back. The hypervisor is
# patched by hand; an unattended Proxmox update can take the platform down.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Install security updates unattended on every guest, kernels excluded
  hosts: guests
  become: true
  roles:
    - unattended_upgrades
