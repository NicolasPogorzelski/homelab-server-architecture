---
# Manage the hypervisor's maintenance and evidence units from the repository,
# so a rebuild restores them. Most are guards whose loss would be silent.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Own the hypervisor's maintenance and evidence units
  hosts: proxmox
  become: false # the inventory already connects as root; there is no ansible user here
  roles:
    - proxmox_host_units
