---
# Playbooks run from the control node's working tree, so an unpublished
# tree is an unpublished deployment. preflight.yml refuses that.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Manage postgres_exporter on the database node
  hosts: database
  become: true
  roles:
    - postgres_exporter
