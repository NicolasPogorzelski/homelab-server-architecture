---
# Only nodes that read the Tailscale certificate off disk need this. Nodes behind
# `tailscale serve` get renewal transparently and are deliberately not targeted.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Keep on-disk Tailscale certificates fresh and reloaded
  hosts: tailscale_cert_ondisk
  become: true
  roles:
    - tailscale_cert
