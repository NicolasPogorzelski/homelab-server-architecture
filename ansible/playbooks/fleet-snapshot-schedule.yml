---
# Installs the weekly schedule for fleet-snapshot.yml on the control node.
# Kept apart from the snapshot itself: this playbook changes state and carries
# the preflight gate; the snapshot only reads and must run from any tree.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Schedule the weekly fleet snapshot on the control node
  hosts: lxc250
  become: true
  roles:
    - fleet_snapshot
