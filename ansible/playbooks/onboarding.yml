---
# `lxc-test` is a placeholder, not a host. It is in no inventory group, so every
# play here reports `skipping: no hosts matched` and the playbook has never been
# run against a real node - roadmap item 8 records the structure as complete and
# the live test as skipped, for want of a spare container. Replace the three
# `hosts:` values with the new node before using this, and expect the bootstrap
# play to need `-u root` because the ansible user does not exist yet.
#
# Playbooks run from the working tree on lxc250, not from a commit.
# preflight.yml refuses the run if that tree does not match origin/main.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Bootstrap ansible user on LXCs
  hosts: lxc-test
  remote_user: root

  tasks:
    - name: Create ansible user
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash

    - name: Deploy SSH public key
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', '/home/devops/.ssh/id_ed25519.pub') }}"

    - name: Install sudo
      ansible.builtin.apt:
        name: sudo
        state: present

    - name: Set NOPASSWD sudo rule
      ansible.builtin.copy:
        content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/ansible
        mode: "0440"
        validate: /usr/sbin/visudo -csf %s

- name: Deploy ssh-hardening
  hosts: lxc-test
  remote_user: ansible
  become: true
  roles:
    - ssh_hardening

- name: Deploy  node_exporter
  hosts: lxc-test
  remote_user: ansible
  become: true
  roles:
    - node_exporter
