---
# Runs against every node; the role is a no-op where no units are declared, so
# a new node needs a host var, not a playbook edit.
#
# Two plays because the hypervisor is reached as root with no ansible user, so
# `become: true` there would call sudo for nothing.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Gate Tailscale-bound units on the address existing
  hosts: guests
  become: true
  roles:
    - tailscale_boot_gate

- name: Gate the hypervisor's Tailscale-bound units
  hosts: proxmox
  become: false # the inventory already connects as root; there is no ansible user here
  roles:
    - tailscale_boot_gate
