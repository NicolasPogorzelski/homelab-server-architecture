---
# Runs against every guest, but the role is a no-op on hosts that declare no
# units - so the target list stays honest and a new node needs a host var, not a
# playbook edit.
#
# The hypervisor is absent on purpose. Its `pveproxy` gate is hand-deployed and
# predates this role; folding it in belongs to the host adoption, where the other
# hand-written host units are adopted in one pass rather than one at a time.
#
# Playbooks run from the working tree on lxc250, not from a commit.
# preflight.yml refuses the run if that tree does not match origin/main.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Gate Tailscale-bound units on the address existing
  hosts: guests
  become: true
  roles:
    - tailscale_boot_gate
