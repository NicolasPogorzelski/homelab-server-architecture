---
# Targets the `proxmox` group: vzdump is a host-level tool that reaches the
# guests through the hypervisor's storage layer, so there is no per-guest play.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Deploy guest backup infrastructure on the Proxmox host
  hosts: proxmox
  become: false # the inventory already connects as root; there is no ansible user here
  roles:
    - guest_backup
