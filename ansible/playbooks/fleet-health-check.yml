---
- name: Gather fleet facts
  hosts: all
  gather_facts: true
  tasks:
    - name: Node_uptime
      ansible.builtin.debug:
        var: ansible_uptime_seconds

    - name: Node_RAM
      ansible.builtin.debug:
        var: ansible_memory_mb

    - name: Node_mounts
      ansible.builtin.debug:
        var: ansible_mounts

    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Print service facts
      ansible.builtin.debug:
        var: ansible_facts.services

- name: Docker health checks
  hosts: docker
  gather_facts: false
  become: true
  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Docker daemon status
      ansible.builtin.debug:
        var: ansible_facts.services['docker.service']

    - name: Get Docker host info
      community.docker.docker_host_info:
        containers: true
      register: docker_info

    - name: Docker container summary
      ansible.builtin.debug:
        var: docker_info.containers

- name: Write fleet health report
  hosts: localhost
  connection: local
  gather_facts: true
  # No become, and the report lives under the invoking user's home rather than
  # in /var/log. This play ran as root against a local connection until
  # 2026-09-16, which means it never ran at all: the control node's interactive
  # account has no passwordless sudo, so the play failed with "sudo: a password
  # is required" every time and /var/log/fleet-health was never created. The
  # rest of the playbook reaches the fleet as the ansible user and was
  # unaffected, so a run ended with ten green nodes and one red play.
  #
  # Root was never needed for it: every value in the report is a fact the
  # preceding plays already hold in memory, and the file is for the person who
  # started the run.
  become: false
  vars:
    fleet_health_report_dir: "{{ ansible_env.HOME }}/fleet-health"
  tasks:
    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ fleet_health_report_dir }}"
        state: directory
        mode: "0755"

    - name: Find reports older than 7 days
      ansible.builtin.find:
        paths: "{{ fleet_health_report_dir }}"
        age: 7d
        recurse: false
      register: old_reports

    - name: Delete old reports
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_reports.files }}"

    - name: Write fleet health report
      ansible.builtin.copy:
        dest: "{{ fleet_health_report_dir }}/report-{{ ansible_date_time.date }}.txt"
        content: |
          Fleet Health Report - {{ ansible_date_time.iso8601 }}
          =========================================================
          {% for host in groups['all'] %}
          --- {{ host }} ---
          Uptime (s):    {{ hostvars[host]['ansible_uptime_seconds'] | default('N/A') }}
          RAM free (MB): {{ hostvars[host]['ansible_memory_mb']['real']['free'] | default('N/A') }}
          RAM total (MB):{{ hostvars[host]['ansible_memory_mb']['real']['total'] | default('N/A') }}
          Mounts:
          {% for mount in hostvars[host]['ansible_mounts'] | default([]) %}
            {{ mount.mount }} ({{ mount.fstype }}) - free: {{ (mount.size_available / 1024 / 1024) | int }} MB
          {% endfor %}
          {% endfor %}
        mode: "0644"
