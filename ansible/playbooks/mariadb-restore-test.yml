---
# Prove monthly that the MariaDB dump can be restored. Without the database the
# Nextcloud user files on the archive pool have no owner, name or path.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Schedule the MariaDB restore validation on lxc210
  hosts: lxc210
  become: true
  roles:
    - mariadb_restore_test
