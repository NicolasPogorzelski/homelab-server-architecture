---
# lxc250 is excluded: this play connects as root, lxc250 refuses root logins
# under ssh_hardening, and the account `become` would use is the one being
# created. A rebuilt control node has no Ansible to run a local play either, so
# it is bootstrapped by snippets/scripts/bootstrap-ansible-user-lxc250.sh
# (`pct push`, then `pct exec` as root).
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Bootstrap ansible user on LXCs
  hosts: lxcs:!lxc250
  remote_user: root

  tasks:
    - name: Create ansible user
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash

    - name: Deploy SSH public key
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', '/home/devops/.ssh/id_ed25519.pub') }}"

    - name: Install sudo
      ansible.builtin.apt:
        name: sudo
        state: present

    - name: Set NOPASSWD sudo rule
      ansible.builtin.copy:
        content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/ansible
        mode: "0440"
        validate: /usr/sbin/visudo -csf %s

- name: Bootstrap ansible user on VM100
  hosts: vm100
  remote_user: gpu
  become: true
  become_user: root

  tasks:
    - name: Create ansible user
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash

    - name: Deploy SSH public key
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', '/home/devops/.ssh/id_ed25519.pub') }}"

    - name: Set NOPASSWD sudo rule
      ansible.builtin.copy:
        content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/ansible
        mode: "0440"
        validate: /usr/sbin/visudo -csf %s

