---
# lxc250 is excluded deliberately. It is in the `lxcs` group since 2026-08-20,
# but this play connects as root over SSH and lxc250 refuses root logins under
# ssh_hardening - and the account `become` would use is the one being created.
# A play with `connection: local` does not solve it either, because a rebuilt
# control node has neither Ansible nor a checkout to run it from. That node is
# bootstrapped by `snippets/scripts/bootstrap-ansible-user-lxc250.sh`, pushed in
# with `pct push` and run as root through `pct exec`.
- name: Bootstrap ansible user on LXCs
  hosts: lxcs:!lxc250
  remote_user: root

  tasks:
    - name: Create ansible user
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash

    - name: Deploy SSH public key
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', '/home/devops/.ssh/id_ed25519.pub') }}"

    - name: Install sudo
      ansible.builtin.apt:
        name: sudo
        state: present

    - name: Set NOPASSWD sudo rule
      ansible.builtin.copy:
        content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/ansible
        mode: "0440"
        validate: /usr/sbin/visudo -csf %s

- name: Bootstrap ansible user on VM100
  hosts: vm100
  remote_user: gpu
  become: true
  become_user: root

  tasks:
    - name: Create ansible user
      ansible.builtin.user:
