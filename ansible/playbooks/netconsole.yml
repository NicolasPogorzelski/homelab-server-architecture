---
# vm100 only: it is the node with an unexplained freeze (KE-20), where the next
# occurrence must leave kernel evidence. The role is node-agnostic; adding
# nodes is a decision about where kernel logs travel, not a role change.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Stream the kernel log to the Proxmox host
  hosts: vm100
  become: true
  roles:
    - netconsole
