---
# Every node: `Storage=` and `SystemMaxUse=` were unset fleet-wide, not only on
# the nodes the finding named (KE-8).
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Pin journald persistence and size limits fleet-wide
  hosts: all
  become: true
  roles:
    - journald
