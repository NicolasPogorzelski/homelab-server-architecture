---
# Refuse to run against the fleet from a working tree that matches no commit.
#
# Playbooks run from the working tree on lxc250. A tree on a feature branch,
# mid-merge or behind origin would deploy code that exists in no commit, and
# Ansible reports "changed" either way. Imported by every playbook that changes
# live state; the read-only fleet-health-check and fleet-snapshot do not import it,
# so diagnosis during an incident is never blocked.
#
# The play targets all hosts because --limit also applies to this play; a play on
# localhost would be skipped by `--limit lxc260`. Each task runs once on the
# control node, and any_errors_fatal stops every later play on a refusal.
- name: Preflight - the control node's working tree must match a published commit
  hosts: all
  gather_facts: false
  become: false
  any_errors_fatal: true

  vars:
    # Repository root, two levels up from ansible/playbooks/.
    preflight_repo: "{{ playbook_dir }}/../.."
    preflight_required_branch: main
    # A reason, not a boolean, and it is printed into the run output. A gate with
    # no way past it gets deleted the first time it blocks an incident.
    preflight_override: ""

  tasks:
    # One run on the control node, however many hosts the limit leaves.
    - name: Check the control node once, whatever --limit selects
      delegate_to: localhost
      run_once: true
      block:
        # noqa: command-instead-of-module - ansible.builtin.git clones and checks
        # out. It cannot query, so none of the checks below has a module form.
        # Waived inline rather than in skip_list, so the rule stays armed repo-wide.
        - name: Read the working tree state
          ansible.builtin.command:  # noqa: command-instead-of-module
            cmd: git status --porcelain
            chdir: "{{ preflight_repo }}"
          register: preflight_status
          changed_when: false
          check_mode: false

        - name: Read the current branch
          ansible.builtin.command:  # noqa: command-instead-of-module
            cmd: git rev-parse --abbrev-ref HEAD
            chdir: "{{ preflight_repo }}"
          register: preflight_branch
          changed_when: false
          check_mode: false

        # Fetch before comparing. git status answers against the remote-tracking ref
        # as of the last fetch, so a node that has not fetched for a week still
        # reports itself up to date.
        - name: Refresh the remote ref
          ansible.builtin.command:  # noqa: command-instead-of-module
            cmd: "git fetch --quiet origin {{ preflight_required_branch }}"
            chdir: "{{ preflight_repo }}"
          register: preflight_fetch
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Compare local and remote
          ansible.builtin.command:  # noqa: command-instead-of-module
            cmd: "git rev-list --left-right --count HEAD...origin/{{ preflight_required_branch }}"
            chdir: "{{ preflight_repo }}"
          register: preflight_divergence
          changed_when: false
          failed_when: false
          check_mode: false

        # An unresolved merge in the working tree is what would be deployed.
        # grep exits 1 for "found nothing" and 2 for "could not look"; only 1 is clean.
        - name: Look for merge conflict markers under ansible/
          ansible.builtin.command:
            cmd: "grep -rlE '^(<<<<<<<|=======|>>>>>>>)' {{ preflight_repo }}/ansible"
          register: preflight_markers
          changed_when: false
          failed_when: false
          check_mode: false

        # Map grep's exit code to a word, so rc=2 never prints as "clean".
        - name: Name the marker check's outcome
          ansible.builtin.set_fact:
            preflight_marker_state: "{{ preflight_marker_states[preflight_markers.rc] | default(preflight_marker_broken) }}"
          vars:
            preflight_marker_states:
              0: "{{ preflight_markers.stdout_lines | join(', ') }}"
              1: none
            preflight_marker_broken: "CHECK FAILED, rc={{ preflight_markers.rc }}"

        - name: Report what was found
          ansible.builtin.debug:
            msg:
              - "branch:           {{ preflight_branch.stdout }}"
              - "working tree:     {{ 'clean' if preflight_status.stdout == '' else preflight_status.stdout_lines | length | string + ' modified path(s)' }}"
              - "fetch:            {{ 'ok' if preflight_fetch.rc == 0 else 'FAILED (' ~ preflight_fetch.stderr | trim ~ ')' }}"
              - "ahead/behind:     {{ preflight_divergence.stdout | default('unknown') | trim }}"
              - "conflict markers: {{ preflight_marker_state }}"

        - name: Print the override reason into the run output
          ansible.builtin.debug:
            msg: >-
              PREFLIGHT OVERRIDDEN: {{ preflight_override }}
              The checks below are reported but not enforced for this run.
          when: preflight_override | length > 0

        - name: Refuse the run if the control node does not match a published commit
          ansible.builtin.assert:
            that:
              - preflight_branch.stdout == preflight_required_branch
              - preflight_status.stdout == ""
              - preflight_fetch.rc == 0
              - preflight_divergence.stdout | trim == "0\t0"
              - preflight_markers.rc == 1
            fail_msg: >-
              The control node's tree does not match origin/{{ preflight_required_branch }}.
              Playbooks here run from the working tree, so this run would deploy code that
              exists in no commit. Check with `git status --short --branch`, then
              `git pull --ff-only`. To proceed anyway, state a reason:
              -e preflight_override="why this run must go ahead".
            success_msg: >-
              Control node is on a clean {{ preflight_required_branch }},
              in sync with origin. Proceeding.
          when: preflight_override | length == 0
