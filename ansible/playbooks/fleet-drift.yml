---
# Installs the weekly drift sweep on the control node: every playbook in
# ansible/drift-sweep.conf in check mode, plus the alert rules Prometheus has
# loaded compared with the rules file in this repository. fleet-snapshot.yml
# covers the surface no role manages.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Schedule the weekly drift sweep on the control node
  hosts: lxc250
  become: true
  roles:
    - fleet_drift
