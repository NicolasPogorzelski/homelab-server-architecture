---
# The platform binding rule as a metric on every node, the hypervisor included.
# Services bind the Tailscale address or loopback; anything else is reported by
# ListenerOutsideBindingRule unless the node's inventory allows it on record.
#
# Playbooks run from the working tree on lxc250, not from a commit.
# preflight.yml refuses the run if that tree does not match origin/main.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Export listeners outside the binding rule from every node
  hosts: all
  become: true
  roles:
    - listener_metrics
