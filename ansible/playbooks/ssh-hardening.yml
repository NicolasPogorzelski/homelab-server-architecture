---
# Two plays instead of `hosts: all`: the guests are swept, the hypervisor is
# reached only by naming the `proxmox` group, so it is never included by default.
#
# group_vars/proxmox.yml sets root login to `prohibit-password`: root is the
# hypervisor's only administrative account and there is no usable out-of-band
# console.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Deploy ssh-hardening to the fleet
  hosts: guests
  become: true
  serial: 1
  # Any failed host stops the roll. serial: 1 alone does that; this keeps it
  # when the batch grows, where one failure in a batch would otherwise not stop it.
  max_fail_percentage: 0
  roles:
    - ssh_hardening

# Last, after the guests have shown the role converges: a failure here reloads
# sshd on a node with no other way in. A correct host reports changed=0, so a
# change means the live configuration drifted.
- name: Deploy ssh-hardening to the Proxmox host
  hosts: proxmox
  become: false # the inventory connects as root; there is no ansible user here
  roles:
    - ssh_hardening
