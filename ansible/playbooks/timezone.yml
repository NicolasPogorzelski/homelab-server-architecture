---
# Give every node the same timezone. A rebuilt Debian container comes back as
# Etc/UTC and nothing reports it, so the role owns the setting and asserts that
# the node actually applied it.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Give every node one timezone
  hosts: all
  become: true
  roles:
    - timezone
