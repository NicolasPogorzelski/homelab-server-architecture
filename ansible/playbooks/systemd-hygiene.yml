---
# Guests and hypervisor are separate plays (see ssh-hardening.yml). The
# hypervisor's units are listed in group_vars/proxmox.yml, and
# `systemd_hygiene_group_units` is set on `lxcs` rather than `all`, so a
# fleet-wide entry cannot mask units on the hypervisor by accident.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Mask systemd units that can never succeed on their node
  hosts: guests
  become: true
  roles:
    - systemd_hygiene

- name: Mask systemd units that must not run on the Proxmox host
  hosts: proxmox
  become: false # the inventory connects as root; there is no ansible user here
  roles:
    - systemd_hygiene
