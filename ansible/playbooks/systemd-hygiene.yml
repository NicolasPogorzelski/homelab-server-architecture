---
# `guests`, not `all` - see ssh-hardening.yml for the convention and why it is a
# group definition rather than a habit of checking.
#
# The Proxmox host is deliberately absent for now. The role is a no-op on a node
# with no entries (`systemd_hygiene_masked_units` and `_group_units` both default
# to empty), so including it would change nothing today and would silently start
# masking units on the hypervisor the day somebody adds a fleet-wide entry to
# `group_vars`. It has no permanently failed unit as of 2026-08-20. Add a
# `proxmox` play when it does, with the unit named and a reason recorded, which
# is what this role asks of every other node.
# Playbooks run from the control node's working tree, so an unpublished
# tree is an unpublished deployment. preflight.yml refuses that.
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

- name: Mask systemd units that can never succeed on their node
  hosts: guests
  become: true
  roles:
    - systemd_hygiene
