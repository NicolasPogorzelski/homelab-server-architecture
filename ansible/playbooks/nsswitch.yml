---
- name: Preflight - the control node must match a published commit
  import_playbook: preflight.yml

# All guests, not only the node that needs it: the role is a no-op where
# `nsswitch_hosts` is unset, and the sweep finds any further instance.
- name: Set the host resolution order where a node declares one
  hosts: guests
  become: true
  roles:
    - nsswitch
