---
- name: Refuse a value sshd would reject
  ansible.builtin.assert:
    that:
      - ssh_hardening_permit_root_login in ["yes", "no", "prohibit-password", "forced-commands-only"]
      - ssh_hardening_password_authentication in ["yes", "no"]
      - ssh_hardening_x11_forwarding in ["yes", "no"]
      - ssh_hardening_allow_tcp_forwarding in ["yes", "no", "all", "local", "remote"]
      - ssh_hardening_max_auth_tries | int >= 1
    fail_msg: >-
      ssh_hardening_permit_root_login={{ ssh_hardening_permit_root_login }},
      ssh_hardening_password_authentication={{ ssh_hardening_password_authentication }},
      ssh_hardening_x11_forwarding={{ ssh_hardening_x11_forwarding }},
      ssh_hardening_allow_tcp_forwarding={{ ssh_hardening_allow_tcp_forwarding }},
      ssh_hardening_max_auth_tries={{ ssh_hardening_max_auth_tries }}.
      sshd refuses to start on an invalid directive value, and this role reloads it -
      a typo here takes SSH down on the node it was meant to harden.
    quiet: true

# sshd must not be reloaded where systemd owns the listening socket (KE-24): a
# reload re-execs sshd, the new process binds :22 itself, fails with EADDRINUSE
# against ssh.socket and exits 255. So the verb is chosen per node: restart where
# ssh.socket is active, reload where it is not. Both run `sshd -t` first, and
# established sessions survive either, because ssh.service has `KillMode=process`.
#
# noqa: command-instead-of-module - service_facts sees .service units only, and
# systemd_service has no query-only mode. A node without the unit returns a
# non-zero rc and "inactive", which selects the reload path.
- name: Read whether systemd owns the sshd listening socket
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: systemctl is-active ssh.socket
  register: ssh_hardening_socket_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record which verb is safe for restarting sshd on this node
  ansible.builtin.set_fact:
    ssh_hardening_reload_verb: >-
      {{ 'restarted' if ssh_hardening_socket_state.stdout | trim == 'active' else 'reloaded' }}

# A pinned ListenAddress couples sshd's start to tailscaled having assigned the
# address (KE-18). sshd exits 255 on a failed bind, and Debian's ssh.service lists
# 255 in RestartPreventExitStatus, so without the boot gate a reboot leaves the
# node without SSH. The role refuses the pin without the gate.
- name: Refuse a pinned bind without the boot gate that makes it survivable
  ansible.builtin.assert:
    that:
      - "'ssh.service' in (tailscale_boot_gate_units | default([]))"
      - tailscale_boot_gate_clear_restart_prevent | default(false) | bool
    fail_msg: >-
      ssh_hardening_listen_address is set on this node, but it does not declare
      ssh.service in tailscale_boot_gate_units with
      tailscale_boot_gate_clear_restart_prevent: true. Without the readiness gate
      sshd binds an address that does not exist yet at boot, exits 255, and the
      packaged unit refuses to restart it. Nothing was changed.
    success_msg: "Pinned bind is backed by the boot gate."
    quiet: true
  when: ssh_hardening_listen_address | length > 0

# A template, so the optional ListenAddress is a conditional block without a stray
# blank line on nodes that do not set it.
#
# No `validate:`: `sshd -t -f <drop-in>` would test the fragment as a whole
# configuration. ssh.service runs `sshd -t` against the complete configuration in
# ExecStartPre and ExecReload, so a bad drop-in fails the reload instead.
- name: Deploy sshd_config.d drop-in that wins over distro-provided defaults
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload ssh_config

# The drop-in owns the bind. `ListenAddress` accumulates rather than taking its
# first value, so a line left in the main file by hand is a second bind beside
# the pinned one, not a default the drop-in overrides.
- name: Remove ListenAddress lines from the main sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*ListenAddress\s'
    state: absent
  when: ssh_hardening_listen_address | length > 0
  notify: Reload ssh_config

- name: Password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication {{ ssh_hardening_password_authentication }}
  notify: Reload ssh_config

- name: Permit root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin {{ ssh_hardening_permit_root_login }}
  notify: Reload ssh_config

- name: X11 forwarding
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?X11Forwarding
    line: X11Forwarding {{ ssh_hardening_x11_forwarding }}
  notify: Reload ssh_config

- name: TCP forwarding
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?AllowTcpForwarding
    line: AllowTcpForwarding {{ ssh_hardening_allow_tcp_forwarding }}
  notify: Reload ssh_config

- name: Authentication attempts per connection
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?MaxAuthTries
    line: MaxAuthTries {{ ssh_hardening_max_auth_tries }}
  notify: Reload ssh_config

# Where root may not log in, a key in root's authorized_keys would grant access
# silently the day the setting is relaxed. Guest recovery does not need it
# (`pct exec`, VM console, break-glass account). The hypervisor keeps its keys:
# root is its administrative account (prohibit-password).
- name: Remove root's authorized_keys where sshd refuses root logins
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent
  when: ssh_hardening_permit_root_login == 'no'

# A pinned bind needs sshd to own its socket: under socket activation systemd holds
# `*:22` and sshd never reads ListenAddress. The socket stops before the service
# starts, because the address cannot be bound while systemd holds the wildcard.
# Established sessions survive (`KillMode=process`); if the service then fails,
# recovery is `pct exec` from the hypervisor.
- name: Hand the listening socket from systemd back to sshd
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped
  when: ssh_hardening_listen_address | length > 0

# Restarted on the run that removes the socket: a running ssh.service keeps the
# inherited `*:22` descriptor. Later runs find the socket inactive and only ensure
# the service is up.
- name: Run sshd as a standing service that binds its own address
  ansible.builtin.systemd_service:
    name: ssh.service
    enabled: true
    state: "{{ 'restarted' if ssh_hardening_socket_state.stdout | trim == 'active' else 'started' }}"
  when: ssh_hardening_listen_address | length > 0

# Without socket activation the task above leaves a running sshd alone, so the new
# ListenAddress arrives only through the handler. Run it before the read-back.
- name: Apply the sshd configuration before reading the bind back
  ansible.builtin.meta: flush_handlers

# Read the bind back from the kernel rather than trusting the configuration file.
# A reload re-execs sshd, so the read retries briefly while the new process binds.
- name: Read which addresses listen on port 22
  ansible.builtin.command:
    cmd: ss -Hltn 'sport = :22'
  register: ssh_hardening_listeners
  changed_when: false
  check_mode: false
  until: >-
    ssh_hardening_listeners.stdout_lines | length > 0 and
    ssh_hardening_listeners.stdout_lines
    | map('split') | map(attribute=3)
    | reject('equalto', ssh_hardening_listen_address ~ ':22') | list | length == 0
  retries: 5
  delay: 2
  failed_when: false
  when: ssh_hardening_listen_address | length > 0 and not ansible_check_mode

- name: Refuse to finish while sshd still listens beyond the pinned address
  ansible.builtin.assert:
    that:
      - ssh_hardening_listeners.stdout_lines | length > 0
      - ssh_hardening_listeners.stdout_lines
        | map('split') | map(attribute=3)
        | reject('equalto', ssh_hardening_listen_address ~ ':22') | list | length == 0
    fail_msg: >-
      Port 22 listeners are {{ ssh_hardening_listeners.stdout_lines | map('split') | map(attribute=3) | list }},
      expected only {{ ssh_hardening_listen_address }}:22.
    success_msg: "sshd listens on {{ ssh_hardening_listen_address }}:22 only."
    quiet: true
  when: ssh_hardening_listen_address | length > 0 and not ansible_check_mode
