---
- name: Refuse a value sshd would reject
  ansible.builtin.assert:
    that:
      - ssh_hardening_permit_root_login in ["yes", "no", "prohibit-password", "forced-commands-only"]
      - ssh_hardening_password_authentication in ["yes", "no"]
    fail_msg: >-
      ssh_hardening_permit_root_login={{ ssh_hardening_permit_root_login }},
      ssh_hardening_password_authentication={{ ssh_hardening_password_authentication }}.
      sshd refuses to start on an invalid directive value, and this role reloads it -
      a typo here takes SSH down on the node it was meant to harden.
    quiet: true

# sshd must not be reloaded where systemd owns the listening socket.
#
# Debian ships ssh.socket with `Accept=no` and `ListenStream=22`, so systemd
# holds the socket and hands the descriptor to ssh.service on the first
# connection - both then show as owners of :22 in `ss -lntp`. That is a supported
# arrangement and the normal steady state on the Proxmox Debian 12 containers,
# where the template enables it. vm100, vm102, lxc250 and the hypervisor have it
# disabled and run the daemon on its own.
#
# What breaks is SIGHUP. sshd does not re-read its configuration on reload, it
# re-execs, and the new process binds :22 itself instead of reusing the inherited
# descriptor. systemd still holds the socket, the bind fails with EADDRINUSE and
# the unit exits 255. Measured on six containers 2026-09-04 (KE-24). The socket
# starts the service again on the next connection, so the fault repairs itself,
# which is most of the reason it went unnoticed.
#
# The reload is therefore chosen per node rather than forbidden: restart where
# the socket is active, reload where it is not. Both validate the configuration
# first - ExecStartPre and ExecReload each run `sshd -t` - and a restart under
# socket activation refuses no connection, because the socket keeps listening.
#
# Established sessions survive either verb, which is not a given: ssh.service
# carries `KillMode=process`, so a stop signals the main process alone and the
# forked per-session children keep running. Under the systemd default of
# `control-group` a restart would take down the connection Ansible is working
# over, mid-play.
#
# The handler falls back to `restarted` rather than `reloaded` where the
# detection did not run. This platform has no high-availability requirement -
# the host powers down every night by design - so a listener gap of a second or
# two after a configuration change costs nothing, while a dead sshd on six nodes
# costs a hypervisor session to repair. The safe default is the verb that works
# on both kinds of node, not the gentler one.
#
# noqa: command-instead-of-module - service_facts sees .service units only, and
# systemd_service has no query-only mode. A node without the unit returns a
# non-zero rc and "inactive", which selects the reload path.
- name: Read whether systemd owns the sshd listening socket
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: systemctl is-active ssh.socket
  register: ssh_hardening_socket_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record which verb is safe for restarting sshd on this node
  ansible.builtin.set_fact:
    ssh_hardening_reload_verb: >-
      {{ 'restarted' if ssh_hardening_socket_state.stdout | trim == 'active' else 'reloaded' }}

# Pinning ListenAddress couples sshd's start to tailscaled having assigned the
# address, which is the KE-18 class, and sshd is its worst-behaved member: it exits
# 255 on a failed bind and Debian's ssh.service names 255 in
# RestartPreventExitStatus, so the packaged unit will not restart it on exactly
# that failure. A node that gets the bind without the gate comes back from a reboot
# with no SSH and is reachable only by `pct exec` or a console - and on the
# hypervisor, by neither.
#
# So the role refuses the half-configuration rather than trusting the operator to
# remember the other half. The two settings are safe together and dangerous alone,
# and this repository has recorded five instances of the failure they prevent.
- name: Refuse a pinned bind without the boot gate that makes it survivable
  ansible.builtin.assert:
    that:
      - "'ssh.service' in (tailscale_boot_gate_units | default([]))"
      - tailscale_boot_gate_clear_restart_prevent | default(false) | bool
    fail_msg: >-
      ssh_hardening_listen_address is set on this node, but it does not declare
      ssh.service in tailscale_boot_gate_units with
      tailscale_boot_gate_clear_restart_prevent: true. Without the readiness gate
      sshd binds an address that does not exist yet at boot, exits 255, and the
      packaged unit refuses to restart it. Nothing was changed.
    success_msg: "Pinned bind is backed by the boot gate."
    quiet: true
  when: ssh_hardening_listen_address | length > 0

# A template rather than inline `content:` since 2026-09-11, so the optional
# ListenAddress can be a conditional block without leaving a stray blank line in
# the rendered file on the nodes that do not set it. The rendered output for
# an unset variable is byte-identical to what the copy task produced, which is why
# this change reports no drift.
#
# Deliberately no `validate:`. `sshd -t -f <drop-in>` would test this fragment as a
# whole configuration, with every other directive falling back to a compiled-in
# default - a test of something the daemon never reads in that form. The real
# validation is already in the right place: ssh.service runs `sshd -t` against the
# complete configuration in both ExecStartPre and ExecReload, so a bad drop-in
# fails the reload rather than being accepted by a check that proved less than it
# appeared to.
- name: Deploy sshd_config.d drop-in that wins over distro-provided defaults
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload ssh_config

- name: Password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication {{ ssh_hardening_password_authentication }}
  notify: Reload ssh_config

- name: Permit root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin {{ ssh_hardening_permit_root_login }}
  notify: Reload ssh_config

# A pinned bind needs sshd to own its listening socket. Under socket activation
# systemd holds `*:22` from `ssh.socket` and hands sshd an accepted connection, so
# sshd never binds anything and never reads ListenAddress - which is how lxc220
# carried a pinned drop-in for three weeks while still listening on every address.
# Where the bind is pinned, the socket therefore goes and the service owns the port,
# the arrangement lxc250, vm100, vm102 and the hypervisor already run.
#
# Order matters. The socket has to stop before the service starts: a specific
# address cannot be bound on :22 while systemd holds the wildcard. Between the two
# steps nothing listens, which refuses new connections for a moment and drops no
# established one - ssh.service carries `KillMode=process`, and Ansible's own
# session runs over a multiplexed connection that is already open. If the service
# then fails to start, the node has no sshd; recovery is `pct exec` from the
# hypervisor, which is why this runs one node at a time.
- name: Hand the listening socket from systemd back to sshd
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped
  when: ssh_hardening_listen_address | length > 0

# Restarted, not started, on the run that removes the socket: an ssh.service the
# socket already launched is running on the inherited `*:22` descriptor, and
# stopping the socket does not take that descriptor away from it. Later runs find
# the socket inactive and only make sure the service is up, so they report no
# change.
- name: Run sshd as a standing service that binds its own address
  ansible.builtin.systemd_service:
    name: ssh.service
    enabled: true
    state: "{{ 'restarted' if ssh_hardening_socket_state.stdout | trim == 'active' else 'started' }}"
  when: ssh_hardening_listen_address | length > 0

# Read the bind back from the kernel rather than trusting the configuration file,
# the failure this block exists for: a drop-in that says one thing while the node
# listens on another.
- name: Read which addresses listen on port 22
  ansible.builtin.command:
    cmd: ss -Hltn 'sport = :22'
  register: ssh_hardening_listeners
  changed_when: false
  check_mode: false
  when: ssh_hardening_listen_address | length > 0 and not ansible_check_mode

- name: Refuse to finish while sshd still listens beyond the pinned address
  ansible.builtin.assert:
    that:
      - ssh_hardening_listeners.stdout_lines | length > 0
      - ssh_hardening_listeners.stdout_lines
        | map('split') | map(attribute=3)
        | reject('equalto', ssh_hardening_listen_address ~ ':22') | list | length == 0
    fail_msg: >-
      Port 22 listeners are {{ ssh_hardening_listeners.stdout_lines | map('split') | map(attribute=3) | list }},
      expected only {{ ssh_hardening_listen_address }}:22.
    success_msg: "sshd listens on {{ ssh_hardening_listen_address }}:22 only."
    quiet: true
  when: ssh_hardening_listen_address | length > 0 and not ansible_check_mode
