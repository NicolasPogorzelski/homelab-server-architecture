---
# Despite its name, this handler reloads or restarts the sshd service (ssh), using
# the verb chosen per node in tasks/main.yml: `reloaded` kills sshd on a
# socket-activated node (KE-24). The fallback `restarted` works on both kinds of
# node and costs at most a listener gap of a second or two.
- name: Reload ssh_config
  ansible.builtin.systemd_service:
    name: ssh
    state: "{{ ssh_hardening_reload_verb | default('restarted') }}"
