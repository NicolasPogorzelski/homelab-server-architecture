---
# === ssh_hardening ===
#
# Both values are sshd directives, passed through as written. Variables because
# the Proxmox host cannot take the strict value: root is its only administrative
# account and it has no usable out-of-band console. The override and its reasoning
# live in `group_vars/proxmox.yml`; every other node gets the strict default.
ssh_hardening_password_authentication: "no"
ssh_hardening_permit_root_login: "no"

# === Forwarding and authentication attempts ===
#
# Debian ships X11 and TCP forwarding on and six attempts per connection. No node
# runs a display, and no documented path tunnels through sshd; Ansible multiplexes
# sessions, which needs neither. Four attempts is the CIS limit and leaves room for
# an agent that offers three keys before the right one.
ssh_hardening_x11_forwarding: "no"
ssh_hardening_allow_tcp_forwarding: "no"
ssh_hardening_max_auth_tries: 4

# === ListenAddress ===
#
# Empty by default, which leaves sshd on the wildcard address. Set per node to its
# Tailscale address to pin the bind (all guests; the hypervisor stays unpinned).
# Not derived from ansible_host, so a pin is always an explicit per-node change.
# See docs/decisions/sshd-listen-address.md.
ssh_hardening_listen_address: ""
