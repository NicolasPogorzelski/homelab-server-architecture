---
- name: Verify the listed automount units exist on this node
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ item }}
  loop: "{{ docker_mount_ordering_units }}"
  register: docker_mount_ordering_stat
  changed_when: false

# A drop-in that names a unit which does not exist is not an error to systemd - the
# dependency is simply never satisfied and the ordering silently does nothing. That
# is the same shape as the guards this platform keeps finding broken, so it is
# checked here rather than trusted.
- name: Fail if a listed unit is missing
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item }} does not exist on this node. A drop-in referencing it would be
      accepted by systemd and order nothing.
  loop: "{{ docker_mount_ordering_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure the docker.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_mount_ordering_units | length > 0

- name: Deploy the ordering drop-in
  ansible.builtin.template:
    src: mount-ordering.conf.j2
    dest: /etc/systemd/system/docker.service.d/mount-ordering.conf
    owner: root
    group: root
    mode: "0644"
  when: docker_mount_ordering_units | length > 0
  notify: Reload systemd

# Deliberately no docker restart. The ordering exists for the boot sequence, and it
# takes effect at the next boot on its own. Restarting the daemon to apply a change
# that only matters at boot would stop every container on the node for nothing - on
# vm100 that means Jellyfin and Audiobookshelf, on a node that cannot be rolled back.
