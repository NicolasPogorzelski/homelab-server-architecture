---
- name: Verify the listed automount units exist on this node
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ item }}
  loop: "{{ docker_mount_ordering_units }}"
  register: docker_mount_ordering_stat
  changed_when: false

# systemd accepts a drop-in naming a missing unit and silently orders nothing,
# so existence is checked here.
- name: Fail if a listed unit is missing
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item }} does not exist on this node. A drop-in referencing it would be
      accepted by systemd and order nothing.
  loop: "{{ docker_mount_ordering_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure the docker.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: (docker_mount_ordering_units | length > 0) or (docker_mount_ordering_required_paths | length > 0)

- name: Deploy the ordering drop-in
  ansible.builtin.template:
    src: mount-ordering.conf.j2
    dest: /etc/systemd/system/docker.service.d/mount-ordering.conf
    owner: root
    group: root
    mode: "0644"
  when: (docker_mount_ordering_units | length > 0) or (docker_mount_ordering_required_paths | length > 0)
  notify: Reload systemd

# No docker restart: the ordering only matters at boot and takes effect at the
# next one. A restart would stop every container on the node for nothing.
