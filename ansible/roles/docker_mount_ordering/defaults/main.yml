---
# === docker_mount_ordering ===
#
# Orders docker.service after the automount units whose paths its containers
# bind. Otherwise a container can bind the mountpoint before the trigger exists
# and serve an empty local directory with no error anywhere.
#
# Names the .automount units, never the .mount units: a trigger is up whether or
# not the SMB server answers, while ordering after the mount would tie Docker's
# start to vm102 being up (KE-15).
#
# Empty by default so the role is a no-op on nodes that bind nothing.
docker_mount_ordering_units: []

# Local filesystems Docker cannot run without, above all its data root.
# RequiresMountsFor= makes Docker refuse to start without them; starting anyway
# would write images and containers onto the root filesystem in the thin pool.
docker_mount_ordering_required_paths: []
