---
# Role written and lint-clean, not deployed: the target VPS is not provisioned.
# See docs/decisions/offsite-backup-target.md and docs/platform/remediation-plan.md.
#
# The script's single source lives in snippets/scripts/.
offsite_backup_script_src: "{{ playbook_dir }}/../../snippets/scripts/offsite-backup.sh"
offsite_backup_script_dest: /usr/local/sbin/offsite-backup.sh

offsite_backup_textfile_dir: /var/lib/node_exporter/textfile_collector

# Per-node, because the C1 set is not in one place: vm102 holds the user files and
# both dump sets, lxc250 the credentials every other recovery depends on. Set in
# the real inventory's host_vars, which owns that fact.
offsite_backup_paths: []

# Written to the environment file, never to the command line, where a repository
# URL with credentials would be visible in `ps`. Both are vault references; the
# values live in the gitignored, vaulted inventory on lxc250. The repository
# validator fails on a literal here.
offsite_backup_repository: "{{ vault_offsite_backup_repository }}"
offsite_backup_password: "{{ vault_offsite_backup_password }}"

offsite_backup_password_file: /etc/offsite-backup.pass
offsite_backup_env_file: /etc/offsite-backup.env

# The tag separates this node's snapshots inside a repository, and doubles as the
# restic `--host`, so a restore reads the same name whichever node took it.
offsite_backup_tag: "{{ inventory_hostname }}"

# After both database dumps (postgresql_backup and mariadb_backup defaults), which
# this copies off site. Persistent=true because the host powers down overnight and
# a missed slot would otherwise be lost.
offsite_backup_oncalendar: "*-*-* 04:15:00"
offsite_backup_persistent: true
offsite_backup_randomized_delay: 600

# The weekday on which `restic check` also reads back a data sample; a structural
# check alone does not prove the bytes are there. 6 is Saturday: the script compares
# the weekday it runs on, and Sunday has no automatic start (homelab_schedule).
offsite_backup_verify_weekday: 6
offsite_backup_verify_subset: "1%"

# Documents a design constraint: the client credential is append-only, so
# `restic forget` and `restic prune` fail from the node and retention runs on the
# server. See the script header.
offsite_backup_client_prunes: false
