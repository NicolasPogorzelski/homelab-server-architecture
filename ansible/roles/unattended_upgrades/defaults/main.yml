---
# === unattended_upgrades ===
#
# Security updates install themselves; everything else waits for
# `ansible/playbooks/apt-upgrade.yml`, run while someone is watching. The stock
# configuration of both distributions also allows the regular archive, so the
# drop-in replaces the origin lists rather than adding to them.
#
# Which origins count as security, and which packages are held back, differ
# between Ubuntu (vm100) and Debian (every other guest). They live in
# vars/<distribution>.yml and are loaded by ansible_distribution.

# Installs that APT may run on its own. A reboot is never automatic: kernels are
# held back below, and the containers share the hypervisor's kernel anyway.
unattended_upgrades_automatic_reboot: false
