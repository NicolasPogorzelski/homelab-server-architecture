---
# === docker_boot_retry ===
#
# Starts, once per boot, the containers whose start failed. Docker's restart
# policy applies only after a successful start, so a start that fails in runc
# (e.g. a bind mount whose CIFS source was refused) stays down. See KE-27.
#
# docker_mount_ordering orders Docker after the automount triggers only; ordering
# after the mounts themselves would tie Docker to vm102 (KE-15). Retrying the
# start keeps the daemon independent of the storage VM.
#
# Opt-in per host, so the role is a no-op on nodes that bind nothing remote.
docker_boot_retry_enabled: false

docker_boot_retry_script_src: "{{ playbook_dir }}/../../snippets/scripts/docker-boot-retry.sh"
docker_boot_retry_script_dest: /usr/local/sbin/docker-boot-retry.sh

# Six passes, 30 s apart: three minutes covers vm102 booting alongside vm100;
# a container still down after that has a fault a retry will not fix.
docker_boot_retry_attempts: 6
docker_boot_retry_interval: 30
