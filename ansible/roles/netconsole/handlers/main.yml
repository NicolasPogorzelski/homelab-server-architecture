---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# The module reads its target only at load time. Restarting the oneshot unit runs
# ExecStop (unload) then ExecStart (load).
- name: Restart netconsole
  ansible.builtin.systemd_service:
    name: netconsole.service
    state: restarted

- name: Apply sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
