---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# The module reads its target only at load time, so a changed unit means unload
# and load again. Restarting a Type=oneshot RemainAfterExit unit runs ExecStop
# then ExecStart, which is exactly that.
- name: Restart netconsole
  ansible.builtin.systemd_service:
    name: netconsole.service
    state: restarted

- name: Apply sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
