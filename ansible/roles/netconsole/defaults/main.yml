---
# === netconsole ===
#
# Streams this node's kernel log over UDP to a receiver on the Proxmox host, so a
# freeze that stops disk writes still leaves evidence (see KE-20).
#
# The transport is the LAN interface, not Tailscale: netpoll writes frames straight
# from the kernel, while a Tailscale address lives on a TUN device served by a
# userspace daemon that freezes together with the guest.

# The port pair is arbitrary but must match the receiver unit on the host
# (ansible/roles/proxmox_host_units/templates/netconsole-receiver.service.j2).
netconsole_src_port: 6665
netconsole_target_port: 6666

# LAN address of the receiver. Defined in the gitignored inventory, because real
# LAN addresses stay out of this repository.
netconsole_target_ip: "{{ proxmox_host_lan_ip }}"

# console_loglevel 7: the stock 4 filters KERN_INFO (priority 6), which is the
# priority of `INFO: task blocked for more than 120 seconds`. The other three values
# are the kernel defaults (default_message, minimum_console, default_console).
netconsole_printk: "7 4 1 7"
