---
# === proxmox_host_units (Proxmox host) ===
#
# Host-only units, so a rebuild restores them. Three of the four are guards whose
# loss would be silent.
#
#   lxc-fstrim          returns freed blocks to the LVM thin pool. Containers
#                       cannot trim themselves (ConditionVirtualization=!container,
#                       and the ioctl is refused), so this is the host's job (KE-7).
#   lvm-thin-metrics    exports thin-pool utilisation, which node_filesystem_*
#                       cannot see on a block-layer object.
#   smb-mounts-check    fails at boot if any /mnt/smb/* path is not backed by CIFS
#                       (KE-15).
#   netconsole-receiver takes vm100's kernel log over UDP into this host's
#                       persistent journal; the sending half is the netconsole role.
#
# The pveproxy readiness gate is the tailscale_boot_gate role and node_exporter the
# node_exporter role; both reach this host through their own playbooks.

proxmox_host_units_script_dir: /usr/local/sbin
proxmox_host_units_unit_dir: /etc/systemd/system

proxmox_host_units_scripts:
  - src: lxc-fstrim.sh
  - src: lvm-thin-metrics.sh
  - src: check-smb-mounts.sh

# Units copied verbatim from snippets/systemd/. netconsole-receiver is not in this
# list because it needs an address resolved on the node; it is templated below.
proxmox_host_units_units:
  - lxc-fstrim.service
  - lxc-fstrim.timer
  - lvm-thin-metrics.service
  - lvm-thin-metrics.timer
  - smb-mounts-check.service

proxmox_host_units_timers:
  - lxc-fstrim.timer
  - lvm-thin-metrics.timer

proxmox_host_units_services:
  - smb-mounts-check.service
  - netconsole-receiver.service

# The receiver binds the host's LAN address, a documented exception to the binding
# rule: netpoll sends from the kernel, below the userspace Tailscale daemon that
# freezes with the guest. Resolved on the node, so no address is in the repository.
proxmox_host_units_netconsole_bind: "{{ ansible_default_ipv4.address }}"
proxmox_host_units_netconsole_port: 6666
proxmox_host_units_netconsole_identifier: netconsole-vm100
