---
# Fails the deploy if no MariaDB client is installed, rather than the first
# scheduled run.
- name: Assert the MariaDB client is present
  ansible.builtin.command:
    cmd: bash -c 'command -v mariadb || command -v mysql'
  register: mariadb_restore_test_client
  changed_when: false
  failed_when: mariadb_restore_test_client.rc != 0
  check_mode: false

- name: Deploy the restore test script
  ansible.builtin.copy:
    src: "{{ mariadb_restore_test_script_src }}"
    dest: "{{ mariadb_restore_test_script_dest }}"
    owner: root
    group: root
    mode: "0750"

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ mariadb_restore_test_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the restore test service unit
  ansible.builtin.template:
    src: mariadb-restore-test.service.j2
    dest: /etc/systemd/system/mariadb-restore-test.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy the restore test timer unit
  ansible.builtin.template:
    src: mariadb-restore-test.timer.j2
    dest: /etc/systemd/system/mariadb-restore-test.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so the timer starts against the current unit definition
  ansible.builtin.meta: flush_handlers

# Whether systemd has the unit yet. Under --check (the weekly drift sweep) the
# template was not written, and systemd_service would fail on a first run.
- name: Ask systemd whether the timer unit exists yet  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl list-unit-files --no-legend --plain mariadb-restore-test.timer
  register: mariadb_restore_test_unit_file
  changed_when: false
  failed_when: false
  check_mode: false

- name: Enable and start the restore test timer
  ansible.builtin.systemd_service:
    name: mariadb-restore-test.timer
    enabled: true
    state: started
  when: mariadb_restore_test_unit_file.stdout | length > 0

# Reads the schedule back from systemd: a rejected calendar expression leaves the
# timer enabled and listed but never firing. The noqa is inline because
# systemd_service cannot query a property, and the rule stays armed repo-wide.
- name: Read back the next scheduled run  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl show mariadb-restore-test.timer -p NextElapseUSecRealtime --value
  register: mariadb_restore_test_next
  changed_when: false
  failed_when: mariadb_restore_test_next.stdout | trim in ['', 'n/a', '0']
  when:
    - mariadb_restore_test_verify
    - not ansible_check_mode
    - mariadb_restore_test_unit_file.stdout | length > 0

- name: Report when the restore test will next run
  ansible.builtin.debug:
    msg: "mariadb-restore-test.timer next elapses at {{ mariadb_restore_test_next.stdout }}"
  when:
    - mariadb_restore_test_verify
    - not ansible_check_mode
    - mariadb_restore_test_next.stdout is defined
