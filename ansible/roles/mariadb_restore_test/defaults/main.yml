---
# === mariadb_restore_test ===
#
# Single source of truth lives in snippets/mariadb/.
# playbook_dir = ansible/playbooks -> ../../ = repo root.
mariadb_restore_test_script_src: "{{ playbook_dir }}/../../snippets/mariadb/mariadb-restore-test.sh"
mariadb_restore_test_script_dest: /usr/local/sbin/mariadb-restore-test.sh

mariadb_restore_test_textfile_dir: /var/lib/node_exporter/textfile_collector

# Mid-month, so it never shares a morning with the PostgreSQL restore test on
# the 1st. Before the hypervisor's lxc-fstrim.timer, which is the only thing
# that reclaims the thin-pool blocks the restored copy used (a container cannot
# fstrim itself). Node time zones are set by the `timezone` role.
mariadb_restore_test_oncalendar: "*-*-15 09:00:00"

# Read the next elapse back from systemd: a unit file does not prove the timer
# is scheduled.
mariadb_restore_test_verify: true
