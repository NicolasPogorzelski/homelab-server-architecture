---
- name: Sync compose file from repo to node
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../docker/{{ item.src }}/docker-compose.yml"
    dest: "{{ item.dest }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ compose_projects }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Pull latest images and recreate changed Compose stacks
  community.docker.docker_compose_v2:
    project_src: "{{ item.dest }}"
    state: present
    pull: always
  loop: "{{ compose_projects }}"
  loop_control:
    label: "{{ item.dest }}"
