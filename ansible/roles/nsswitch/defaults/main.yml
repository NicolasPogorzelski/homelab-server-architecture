---
# === nsswitch ===
#
# The `hosts:` line of /etc/nsswitch.conf, which decides which resolver answers a
# name lookup and in what order. Empty by default, so the role is a no-op on every
# node that does not set it.
#
# `resolve [!UNAVAIL=return]` ends the lookup when systemd-resolved answers "not
# found", so glibc never reaches `dns` and the /etc/resolv.conf tailscaled writes.
# A node with that line set here takes resolved out of the path.
# See docs/decisions/magicdns-and-systemd-resolved.md.
nsswitch_hosts: ""

# Resolve a MagicDNS name after the write: a written line is not a working lookup.
nsswitch_verify: true

# Stop and disable systemd-resolved once the hosts line no longer names it.
# Off by default. Out of the lookup path, resolved still answers unauthenticated
# LLMNR and mDNS on the wildcard (port 5355), which the binding rule forbids.
# Removed rather than configured with LLMNR=no, as in
# docs/decisions/magicdns-and-systemd-resolved.md.
nsswitch_disable_resolved: false
