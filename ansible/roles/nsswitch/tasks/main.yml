---
# Everything here is gated on nsswitch_hosts being set, so the role can be run
# against a whole group and touch only the nodes that declare a line.

- name: Set the hosts resolution order in nsswitch.conf
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    regexp: '^hosts:'
    line: "hosts:          {{ nsswitch_hosts }}"
    owner: root
    group: root
    mode: "0644"
  when: nsswitch_hosts | length > 0

# Refuse rather than break: if resolv.conf (the file glibc reads) still points at
# resolved's stub, stopping the daemon would take name resolution with it.
- name: Refuse to disable resolved while resolv.conf still points at its stub
  ansible.builtin.command:
    cmd: grep -c '127\.0\.0\.53' /etc/resolv.conf
  register: nsswitch_stub_refs
  changed_when: false
  failed_when: false
  check_mode: false
  when: nsswitch_disable_resolved

- name: Assert nothing resolves through the stub
  ansible.builtin.assert:
    that: nsswitch_stub_refs.stdout | int == 0
    fail_msg: >-
      /etc/resolv.conf still names 127.0.0.53, so systemd-resolved is in the
      resolution path on this node. Fix the resolver configuration first; this
      role will not stop a daemon something is still asking.
    success_msg: "Nothing points at the resolved stub; the daemon carries no lookups."
  when: nsswitch_disable_resolved

# Stopped and disabled rather than masked: masking is for units that can never
# succeed on a node (systemd_hygiene); this one could, it has nothing to do here.
- name: Stop and disable systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: stopped
    enabled: false
  when: nsswitch_disable_resolved

# Read back from the kernel rather than the unit state: the goal is a closed
# socket, not a stopped unit.
- name: Verify no LLMNR or mDNS listener survives
  ansible.builtin.shell:
    cmd: set -o pipefail && ss -tulnH | grep -c ':5355' || true
    executable: /bin/bash
  register: nsswitch_llmnr
  changed_when: false
  check_mode: false
  failed_when: nsswitch_llmnr.stdout | int != 0
  when:
    - nsswitch_disable_resolved
    - not ansible_check_mode

# The node's own MagicDNS name exercises the Tailscale resolver rather than
# /etc/hosts. Read from tailscaled, because the tailnet name is kept out of the
# repository.
- name: Read this node's MagicDNS name
  ansible.builtin.command:
    cmd: tailscale status --json
  register: nsswitch_ts_status
  changed_when: false
  check_mode: false
  when:
    - nsswitch_hosts | length > 0
    - nsswitch_verify

# getent rather than dig: it uses glibc's resolution path, which this role changes.
# dig queries the resolver directly and succeeds even when nsswitch never asks it.
- name: Verify that a MagicDNS name resolves through nsswitch
  ansible.builtin.command:
    cmd: getent ahostsv4 {{ (nsswitch_ts_status.stdout | from_json).Self.DNSName | regex_replace('\.$', '') }}
  register: nsswitch_getent
  changed_when: false
  failed_when: nsswitch_getent.rc != 0
  when:
    - nsswitch_hosts | length > 0
    - nsswitch_verify
    - not ansible_check_mode
    - nsswitch_ts_status.stdout is defined
