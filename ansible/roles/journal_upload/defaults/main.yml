---
# === journal_upload (EXERCISE) ===
#
# The sending half: ships this node's journal to the receiver on lxc200.
# EXERCISE - see docs/decisions/exercise-scope-before-terraform.md.
#
# Opt-in per node, so enabling it is never a side effect of a group run.
journal_upload_enabled: false

# Read from the inventory so the tailnet address stays out of version control.
journal_upload_target_host: "{{ hostvars['lxc200'].ansible_host | default('') }}"
journal_upload_target_port: 19532

# The upload cursor. The uploader resumes from it after the receiver was down,
# losing nothing as long as the local journal (capped by the journald role)
# still holds the records.
journal_upload_state_file: /var/lib/systemd/journal-upload/state
