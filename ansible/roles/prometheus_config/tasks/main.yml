---
- name: Deploy prometheus from template
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/monitoring/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"
    lstrip_blocks: true
  notify: Reload prometheus-config

# Staged, validated, then promoted, so a broken file never reaches the live path.
# The staging suffix is not `.yml`, because prometheus.yml loads
# `/etc/prometheus/rules/*.yml`.
#
# Staging, validation and cleanup carry `check_mode: false`, so --check really
# validates the rules; only the promotion honours check mode.
#
# `copy`, not `template`: the rules contain Go template expressions
# ({{ $labels.instance }}) that Jinja2 would try to resolve.
- name: Stage the Prometheus alerting rules
  ansible.builtin.copy:
    src: "{{ prometheus_config_rules_src }}"
    dest: "{{ prometheus_config_rules_dest }}.staged"
    owner: root
    group: root
    mode: "0644"
  changed_when: false
  check_mode: false

- name: Validate the staged rules with promtool
  ansible.builtin.command:
    cmd: docker exec prometheus promtool check rules /etc/prometheus/rules/{{ prometheus_config_rules_dest | basename }}.staged
  changed_when: false
  check_mode: false

- name: Promote the validated rules
  ansible.builtin.copy:
    src: "{{ prometheus_config_rules_dest }}.staged"
    dest: "{{ prometheus_config_rules_dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Reload prometheus-config

- name: Remove the staging file
  ansible.builtin.file:
    path: "{{ prometheus_config_rules_dest }}.staged"
    state: absent
  changed_when: false
  check_mode: false
