---
# === nft_guard ===
#
# A kernel packet filter that limits a port to loopback, for services that bind the
# wildcard address and offer no setting to bind anywhere else. The platform rule is
# Tailscale address or loopback, never a LAN interface. Example: Collabora on
# lxc210 is an AppImage extracted by a Nextcloud app and has no listen-address
# setting. The filter is evaluated before the daemon accepts the connection.
#
# Each entry in nft_guard_local_only_ports:
#   port:   TCP port number
#   reason: what listens there and why it cannot bind correctly itself
nft_guard_local_only_ports: []

nft_guard_table: local_guard
nft_guard_rules_file: /etc/nftables.d/local-guard.nft
nft_guard_unit: local-guard.service

# Never loaded through nftables.service: its stock config and ExecStop flush the
# whole ruleset, including Tailscale's ts-input and ts-forward chains. Own table,
# own unit, no `flush ruleset`. See docs/decisions/smb-bind-and-lan-access.md.
