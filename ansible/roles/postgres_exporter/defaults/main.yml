---
# === postgres_exporter (LXC260) ===
#
# The exporter was installed by hand on 2026-04-22 and its unit file has lived
# unmanaged in /etc/systemd/system ever since, with no --web.listen-address, so it
# bound *:9187 - reachable from the untrusted LAN, contrary to the platform binding
# rule. Because the unit is a local file rather than a package's, the fix is to own
# it outright; a systemd drop-in is the tool for units you are not allowed to edit,
# and would have forced restating the whole ExecStart line anyway.
#
# The environment file holds DATA_SOURCE_NAME, i.e. the database password, and was
# left unmanaged when the unit was adopted on 2026-07-10 - deliberately, because
# a credential move does not belong bolted onto a bind-address fix.
#
# The role can own it now, and does not by default. Set
# postgres_exporter_manage_env: true in the inventory once
# vault_postgres_exporter_dsn exists in the vaulted group_vars on lxc250. The flag
# is not timidity: a role that fails on an undefined vault variable would break
# the weekly drift sweep for every node it touches, and the sweep reporting
# `errored` for a run nobody has finished configuring is how a red signal becomes
# background noise.
postgres_exporter_manage_env: false
postgres_exporter_data_source_name: "{{ vault_postgres_exporter_dsn | default('') }}"

postgres_exporter_bin: /usr/local/bin/postgres_exporter
postgres_exporter_env_file: /etc/postgres_exporter.env
postgres_exporter_user: postgres_exporter
postgres_exporter_group: postgres_exporter
postgres_exporter_port: 9187

# Bind to this node's Tailscale address only. Prometheus scrapes
# hostvars['lxc260'].ansible_host:9187, which is exactly this address.
postgres_exporter_listen_address: "{{ ansible_host }}"
