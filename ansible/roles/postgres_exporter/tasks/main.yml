---
# Fails loudly rather than deploying a unit that cannot start. The binary and the
# environment file were installed by hand in April and are out of this role's
# scope; if either is missing, this is not the node the role thinks it is.
- name: Assert the exporter binary and environment file are present
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ postgres_exporter_bin }}"
    - "{{ postgres_exporter_env_file }}"
  register: postgres_exporter_prereqs
  changed_when: false

- name: Fail if a prerequisite is missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "{{ item.item }} is missing; postgres_exporter was installed manually and this role does not install it"
  loop: "{{ postgres_exporter_prereqs.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Refuse to manage the environment file without a vaulted DSN
  ansible.builtin.assert:
    that:
      - postgres_exporter_data_source_name | length > 0
    fail_msg: >-
      postgres_exporter_manage_env is true but vault_postgres_exporter_dsn is
      empty or undefined. It lives in the vaulted group_vars of the inventory on
      lxc250, never in this repository.
  when: postgres_exporter_manage_env
  no_log: true

# 0600 and root-owned: the exporter reads it through systemd's EnvironmentFile,
# which is read by PID 1 before the unit drops to its own account, so the
# unprivileged exporter user never needs to see the password on disk.
- name: Deploy the postgres_exporter environment file
  ansible.builtin.copy:
    content: "DATA_SOURCE_NAME={{ postgres_exporter_data_source_name }}\n"
    dest: "{{ postgres_exporter_env_file }}"
    owner: root
    group: root
    mode: "0600"
  when: postgres_exporter_manage_env
  no_log: true
  notify: Restart postgres_exporter

- name: Deploy the postgres_exporter unit
  ansible.builtin.template:
    src: postgres_exporter.service.j2
    dest: /etc/systemd/system/postgres_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart postgres_exporter

- name: Enable and start postgres_exporter
  ansible.builtin.systemd_service:
    name: postgres_exporter
    enabled: true
    state: started
    daemon_reload: true
