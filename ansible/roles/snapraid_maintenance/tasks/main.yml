---
- name: Deploy the snapraid maintenance script
  ansible.builtin.copy:
    src: "{{ snapraid_script_src }}"
    dest: "{{ snapraid_script_dest }}"
    owner: root
    group: root
    mode: "0750"

- name: Deploy the snapraid maintenance template unit
  ansible.builtin.template:
    src: snapraid-maintenance@.service.j2
    dest: /etc/systemd/system/snapraid-maintenance@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy the snapraid timers
  ansible.builtin.template:
    src: "{{ item }}.timer.j2"
    dest: /etc/systemd/system/{{ item }}.timer
    owner: root
    group: root
    mode: "0644"
  loop:
    - snapraid-sync
    - snapraid-scrub
  notify: Reload systemd

# Removed, not left alongside: with both active, a night on which the host stays up
# past 23:00 would run two syncs concurrently against the same parity files.
- name: Remove the legacy snapraid cron file
  ansible.builtin.file:
    path: "{{ snapraid_legacy_cron_file }}"
    state: absent

# Skipped in check mode: the unit files above were not really written, so systemd
# cannot see them yet and `enable` would fail with "Could not find the requested
# service". Without this guard the role cannot be dry-run at all.
- name: Enable and start the snapraid timers
  ansible.builtin.systemd_service:
    name: "{{ item }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - snapraid-sync
    - snapraid-scrub
  when: not ansible_check_mode

# The layout above the block is left alone; only the exclude rules are owned here.
# See defaults/main.yml for why, and KE-19 for what happens without them.
- name: Assert the snapraid config exists
  ansible.builtin.stat:
    path: "{{ snapraid_conf }}"
  register: snapraid_conf_stat

- name: Fail early if the snapraid config is missing
  ansible.builtin.assert:
    that:
      - snapraid_conf_stat.stat.exists
    fail_msg: >-
      {{ snapraid_conf }} does not exist. This role manages the exclude rules
      inside an existing config; it does not create the disk, parity and content
      layout, which is hand-written because it carries the real device labels.

- name: Manage the exclude rules
  ansible.builtin.blockinfile:
    path: "{{ snapraid_conf }}"
    marker: "# {mark} ANSIBLE MANAGED - exclude rules (KE-19)"
    block: |
      {% for pattern in snapraid_excludes %}
      exclude {{ pattern }}
      {% endfor %}
    backup: true
    owner: root
    group: root
    mode: "0644"
  register: snapraid_excludes_written

# snapraid parses the whole config to answer this and exits immediately, so it is
# a config check rather than an array operation. Running it only after a change
# keeps a converged run free of side effects.
- name: Verify snapraid still parses its config
  ansible.builtin.command:
    cmd: "snapraid -c {{ snapraid_conf }} devices"
  changed_when: false
  when: snapraid_excludes_written.changed and not ansible_check_mode
