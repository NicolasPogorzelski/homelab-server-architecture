---
# === snapraid_maintenance (VM102) ===
#
# systemd timers instead of the former /etc/cron.d/snapraid: homelab_schedule
# powers the host down overnight, and Persistent=true fires a missed run at the
# next boot. A failed timer unit also raises SystemdUnitFailed; a cron job does not.

snapraid_script_src: "{{ playbook_dir }}/../../snippets/storage/snapraid-maintenance.sh"
snapraid_script_dest: /usr/local/sbin/snapraid-maintenance.sh

# Nightly sync; weekly scrub of 12% of the array, a full verification pass about
# every two months, well inside SnapRAIDScrubCoverageAging. 8% takes about 70
# minutes, so a 12% run (about 105 minutes) ends before the 23:00 sync.
# Lower the percentage, not the cadence, if the disk load proves too high.
snapraid_sync_oncalendar: "*-*-* 23:00:00"
snapraid_scrub_oncalendar: "Mon *-*-* 20:00:00"
snapraid_scrub_percent: 12

# Coverage metrics, read from `snapraid status` and written to the textfile
# collector, at a time apart from both jobs, so coverage is reported even on a day
# the sync did not run. `snapraid status` parses the content files and does not
# read the array.
snapraid_status_oncalendar: "*-*-* 12:00:00"

snapraid_legacy_cron_file: /etc/cron.d/snapraid

# === Exclude rules ===
#
# A file that changes during a sync fails that file and the sync exits non-zero,
# so SnapRAIDSyncStale fires for an otherwise current array (KE-19). Exclude what
# changes, not what shares a suffix: `*.log` would also drop static archive files.
#
# The disk, parity and content layout in /etc/snapraid.conf is not managed here:
# it carries real device labels, which stay out of the repository.
snapraid_conf: /etc/snapraid.conf

snapraid_excludes:
  # Generic, inherited from the hand-written config.
  - "*.tmp"
  - "*.bak"
  - "lost+found/"
  - "/tmp/"
  - "/cache/"
  # Nextcloud's own application log, written while the array is being read.
  - "/Nextcloud/nextcloud.log"
  - "/Nextcloud/nextcloud.log.*"
  # SQLite side files: ephemeral, and inconsistent with the main database captured
  # at another moment. The main database files stay in the array.
  - "*.sqlite3-shm"
  - "*.sqlite3-wal"
  - "*.db-shm"
  - "*.db-wal"
  # Database dumps while they are written: the dump scripts write *.partial and
  # rename it once verified, possibly during a catch-up sync. The finished dump is
  # protected as usual.
  - "*.partial"
  # App cache, refreshed on a cycle and regenerable.
  - "/Nextcloud/appdata_*/richdocuments/remoteData/"
