---
# After fleet_snapshot and before the hypervisor's lxc-fstrim.timer, even with
# the full randomized delay. The zone is explicit: lxc250 keeps UTC, the jobs
# this is ordered against run in Europe/Berlin (see fleet_snapshot defaults).
fleet_drift_on_calendar: "Sat *-*-* 10:20:00 Europe/Berlin"
fleet_drift_randomized_delay: "300"

# Runs as the owner of the checkout: git refuses a repository owned by another
# user, so a root run would fail at preflight.yml.
fleet_drift_user: devops
fleet_drift_repo: /home/devops/git/homelab-server-architecture
fleet_drift_path: /home/devops/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

fleet_drift_script_dest: /usr/local/sbin/fleet-drift.sh
fleet_drift_report_dir: /var/lib/fleet-drift
fleet_drift_textfile_dir: /var/lib/node_exporter/textfile_collector

# The Prometheus asked what it actually loaded, on the port `tailscale serve`
# publishes. 9090 is loopback-only inside lxc200.
fleet_drift_monitoring_host: monitoring
fleet_drift_prom_port: "9443"
