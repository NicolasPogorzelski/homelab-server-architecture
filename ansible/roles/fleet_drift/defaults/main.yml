---
# Half an hour after the snapshot, which takes about 25 seconds, and well before
# lxc-fstrim.timer at 10:30. The sweep itself ran 25 playbooks across eleven
# nodes in 4.3 minutes when it was measured on 2026-09-08.
fleet_drift_on_calendar: "Sun *-*-* 09:30:00"
fleet_drift_randomized_delay: "300"

# The sweep runs as the owner of the checkout, not as root. git refuses to
# operate on a repository owned by another user, so a root run fails at
# preflight.yml and reports every playbook as unmeasured.
fleet_drift_user: devops
fleet_drift_repo: /home/devops/git/homelab-server-architecture
fleet_drift_path: /home/devops/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

fleet_drift_script_dest: /usr/local/sbin/fleet-drift.sh
fleet_drift_report_dir: /var/lib/fleet-drift
fleet_drift_textfile_dir: /var/lib/node_exporter/textfile_collector

# The host whose Prometheus is asked what it actually loaded, and the port
# `tailscale serve` publishes it on. Not 9090: that is the loopback port inside
# the container, and nothing outside lxc200 can reach it.
fleet_drift_monitoring_host: monitoring
fleet_drift_prom_port: "9443"
