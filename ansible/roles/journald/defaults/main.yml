---
# Explicit rather than the default `auto`, which is persistent only while
# /var/log/journal exists and silently RAM-only otherwise. Diagnoses such as
# KE-8 depend on journal lines from days earlier.
journald_storage: persistent

# systemd's default cap is 10 % of the filesystem, which varies by disk. 512M
# keeps several months of this fleet's volume and cannot fill a node's
# filesystem. Override per host where a node needs more.
journald_system_max_use: 512M

# journald keeps at least this much free on the filesystem, so a journal below
# its cap cannot grow into the last free byte.
journald_system_keep_free: 1G

journald_dropin_dir: /etc/systemd/journald.conf.d
journald_dropin_file: 10-persistence.conf
