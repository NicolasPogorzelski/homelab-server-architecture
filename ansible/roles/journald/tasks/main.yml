---
- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: "{{ journald_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Pin journald storage and size limits
  ansible.builtin.template:
    src: journald-persistence.conf.j2
    dest: "{{ journald_dropin_dir }}/{{ journald_dropin_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Ensure the persistent journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Flush handlers so the read-back sees the new configuration
  ansible.builtin.meta: flush_handlers

# Two read-backs. This one proves the journal is on disk, but under `auto` that
# is true with or without the drop-in; the merged-config check below proves the
# configuration applies.
- name: Read back what the running journal actually does
  ansible.builtin.command:
    cmd: journalctl --header
  register: journald_header
  changed_when: false
  check_mode: false
  failed_when: false

- name: Confirm the journal is on disk and not in memory
  ansible.builtin.assert:
    that:
      - "'/var/log/journal' in journald_header.stdout"
    fail_msg: >-
      journalctl reports no file under /var/log/journal on {{ inventory_hostname }},
      so this node is still logging to memory despite Storage={{ journald_storage }}.
  when: journald_header.rc == 0

# Reads the merged configuration, not this role's file: `systemd-analyze
# cat-config` prints every source in apply order, which catches a missing drop-in
# and a later-sorting drop-in that overrides this one.
- name: Read back the configuration journald merges from every source
  ansible.builtin.command:
    cmd: systemd-analyze cat-config systemd/journald.conf
  register: journald_merged
  changed_when: false
  check_mode: false
  failed_when: false

# dict() in file order: a later assignment overwrites an earlier one, as in
# systemd.
- name: Name the values that actually apply
  ansible.builtin.set_fact:
    journald_effective: >-
      {{ dict(journald_merged.stdout_lines | map('trim')
              | select('match', '^(Storage|SystemMaxUse|SystemKeepFree)=')
              | map('split', '=')) }}
  when: journald_merged.rc == 0

# Skipped under --check: on a node not yet applied the drop-in is missing, which
# is drift for the weekly sweep to report, not a failure.
- name: Refuse to pass on a node whose journald ignores this configuration
  ansible.builtin.assert:
    that:
      - journald_effective['Storage'] | default('unset') == journald_storage
      - journald_effective['SystemMaxUse'] | default('unset') == journald_system_max_use
      - journald_effective['SystemKeepFree'] | default('unset') == journald_system_keep_free
    fail_msg: >-
      journald on {{ inventory_hostname }} merges
      Storage={{ journald_effective['Storage'] | default('unset') }},
      SystemMaxUse={{ journald_effective['SystemMaxUse'] | default('unset') }},
      SystemKeepFree={{ journald_effective['SystemKeepFree'] | default('unset') }}.
      Either the drop-in is missing or another one overrides it.
    success_msg: >-
      journald merges Storage={{ journald_storage }},
      SystemMaxUse={{ journald_system_max_use }}.
  when:
    - not ansible_check_mode
    - journald_merged.rc == 0
