---
- name: Deploy homelab-setwake.sh
  ansible.builtin.template:
    src: homelab-setwake.sh.j2
    dest: "{{ homelab_setwake_dest }}"
    owner: root
    group: root
    mode: "0755"
    validate: bash -n %s

- name: Deploy homelab-shutdown.sh
  ansible.builtin.template:
    src: homelab-shutdown.sh.j2
    dest: "{{ homelab_shutdown_dest }}"
    owner: root
    group: root
    mode: "0755"
    validate: bash -n %s

- name: Deploy cron schedule
  ansible.builtin.template:
    src: homelab-schedule.j2
    dest: "{{ homelab_cron_file }}"
    owner: root
    group: root
    mode: "0644"
