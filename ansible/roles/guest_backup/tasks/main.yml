---
# Asserted, never created: a directory on an unmounted path would let vzdump
# fill the boot SSD that carries every guest (the KE-7 failure class).
# Two conditions, because a bind mount of a local directory is a mountpoint that
# still lives on the root device.
- name: Assert the backup target is a mountpoint on a device other than root
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.mounts
        | selectattr('mount', 'equalto', guest_backup_dir)
        | list | length == 1
      - >-
        (ansible_facts.mounts
         | selectattr('mount', 'equalto', guest_backup_dir)
         | map(attribute='device') | first | default(''))
        !=
        (ansible_facts.mounts
         | selectattr('mount', 'equalto', '/')
         | map(attribute='device') | first | default('root'))
    fail_msg: >-
      {{ guest_backup_dir }} is not a mountpoint, or resolves to the root device.
      Bind the current backup disk onto that path first - see
      runbooks/platform/guest-backup-restore.md. Deploying the timer now would
      install a job that writes ten gigabytes a week onto the boot SSD.
    success_msg: "{{ guest_backup_dir }} is a mountpoint on its own device - safe to deploy."

# Read-only probe; runs under --check so the assert below has a value.
- name: Measure free space on the backup target
  ansible.builtin.command:
    cmd: "df --output=avail -BG {{ guest_backup_dir }}"
  register: guest_backup_avail
  changed_when: false
  check_mode: false

# vzdump prunes only after a successful write, so a full target fails instead of
# rotating. Two full runs of headroom survive one bad week.
- name: Assert the target has room for at least two full runs
  ansible.builtin.assert:
    that:
      - guest_backup_avail.stdout_lines[1] | regex_replace('G$', '') | int >= 25
    fail_msg: >-
      {{ guest_backup_dir }} has {{ guest_backup_avail.stdout_lines[1] | default('unknown') }}
      free. A full run is roughly 10 GB and the pruner only runs after a
      successful write, so a target this small fails instead of rotating.
    success_msg: "{{ guest_backup_avail.stdout_lines[1] | default('') }} free - room for at least two runs."

- name: Deploy guest-backup script
  ansible.builtin.copy:
    src: "{{ guest_backup_script_src }}"
    dest: "{{ guest_backup_script_dest }}"
    owner: root
    group: root
    mode: "0755"

- name: Create textfile collector directory
  ansible.builtin.file:
    path: "{{ guest_backup_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy guest-backup service unit
  ansible.builtin.template:
    src: guest-backup.service.j2
    dest: /etc/systemd/system/guest-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy guest-backup timer unit
  ansible.builtin.template:
    src: guest-backup.timer.j2
    dest: /etc/systemd/system/guest-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start the backup timer
  ansible.builtin.systemd_service:
    name: guest-backup.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Deploy the host configuration backup and the restore script
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - { src: "{{ guest_backup_host_config_backup_script_src }}", dest: "{{ guest_backup_host_config_backup_script_dest }}" }
    - { src: "{{ guest_backup_platform_restore_script_src }}", dest: "{{ guest_backup_platform_restore_script_dest }}" }
  loop_control:
    label: "{{ item.dest }}"

- name: Deploy the host configuration backup units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - host-config-backup.service
    - host-config-backup.timer
  notify: Reload systemd

- name: Enable and start the host configuration backup timer
  ansible.builtin.systemd_service:
    name: host-config-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
