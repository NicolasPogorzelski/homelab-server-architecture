---
# Single source of truth lives in snippets/scripts/.
# playbook_dir = ansible/playbooks -> ../../ = repo root.
guest_backup_script_src: "{{ playbook_dir }}/../../snippets/scripts/guest-backup.sh"
guest_backup_script_dest: /usr/local/sbin/guest-backup.sh

# Mirrors BACKUP_DIR in the script. A generic mountpoint, not the physical disk:
# changing the backup disk is an fstab change only. The role refuses to deploy
# unless this is a mountpoint on a device other than root (tasks/main.yml).
guest_backup_dir: /mnt/vzdump

guest_backup_textfile_dir: /var/lib/node_exporter/textfile_collector

# Daily, the short-term tier: a full run is roughly 10 GB and the target keeps
# seven. Midday, because the host is off at night (homelab_schedule); the monthly
# copy to the array is backup_mirror.
guest_backup_oncalendar: "*-*-* 12:00:00"

# The host powers down nightly; Persistent=true fires a missed run at the next
# boot. Every scheduled job on this fleet is a timer with Persistent=true.
guest_backup_persistent: true

# vzdump runs at disk speed for minutes per guest; nice and ionice keep it out of
# the way of interactive work. Nothing waits on this job finishing.
guest_backup_nice: 10
guest_backup_ionice: 7

# === Host configuration backup and the restore script ===
# host-config-backup.sh archives what no guest archive carries (fstab, CIFS
# credentials, vfio and kernel arguments, storage definitions, Tailscale
# identity) to the backup target and the boot disk. platform-restore.sh is
# deployed beside it. See runbooks/platform/platform-restore.md.
guest_backup_host_config_backup_script_src: "{{ playbook_dir }}/../../snippets/scripts/host-config-backup.sh"
guest_backup_host_config_backup_script_dest: /usr/local/sbin/host-config-backup.sh
guest_backup_platform_restore_script_src: "{{ playbook_dir }}/../../snippets/scripts/platform-restore.sh"
guest_backup_platform_restore_script_dest: /usr/local/sbin/platform-restore.sh

# Daily, before the guest backup at midday; the archive is small and quick.
guest_backup_host_config_backup_oncalendar: "*-*-* 10:15:00"
