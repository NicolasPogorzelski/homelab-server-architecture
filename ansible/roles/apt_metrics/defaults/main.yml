---
# === apt_metrics ===
#
# Exports pending package upgrades per node as a textfile metric.
#
# Patch level is not covered by the weekly drift sweep: `apt-upgrade.yml` is
# excluded from it because the apt module refreshes the package cache even under
# --check. This role makes pending and security upgrades visible instead.
#
# The collector is Debian's, as in smart_metrics: the packaged collector already
# breaks pending upgrades down by origin, which separates security updates from
# routine ones.
apt_metrics_package: prometheus-node-exporter-collectors

# sponge writes the metric file atomically, so node_exporter never scrapes a
# half-written file. The packaged unit uses it without declaring the dependency.
apt_metrics_sponge_package: moreutils

# The package mixes shell and Python collectors; the apt one is apt_info.py.
apt_metrics_collector: /usr/share/prometheus-node-exporter-collectors/apt_info.py

# Debian's own node_exporter. On bookworm the collectors package depends on it and
# its postinst starts it on *:9100, where it wins the port at boot before the
# fleet's exporter (which waits for Tailscale). Masked before the install so the
# postinst has nothing to start. Trixie (the hypervisor) dropped the dependency.
apt_metrics_foreign_exporter_unit: prometheus-node-exporter.service

apt_metrics_unit: prometheus-node-exporter-apt.service
apt_metrics_timer: prometheus-node-exporter-apt.timer

# The directory the fleet's hand-installed node_exporter reads. The package
# default (/var/lib/prometheus/node-exporter) is read by nothing here.
apt_metrics_textfile_dir: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile_collector') }}"

# Collectors with nothing to measure on an ordinary guest. Masked rather than
# disabled, as in systemd_hygiene: a disabled unit is one `systemctl enable` away
# from running.
#
# group_vars/proxmox.yml sets this to an empty list: smart_metrics owns the same
# four timers on the hypervisor, and two roles must not manage one unit.
apt_metrics_masked_timers:
  - prometheus-node-exporter-ipmitool-sensor.timer
  - prometheus-node-exporter-mellanox-hca-temp.timer
  - prometheus-node-exporter-nvme.timer
  - prometheus-node-exporter-smartmon.timer

# Read the metric back after the first run: an active timer does not prove the
# metric is written where node_exporter reads it.
apt_metrics_verify: true
