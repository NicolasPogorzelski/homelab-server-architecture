---
- name: Install the journal receiver
  ansible.builtin.apt:
    name: "{{ journal_remote_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the directory the received journals land in
  ansible.builtin.file:
    path: "{{ journal_remote_dir }}"
    state: directory
    owner: systemd-journal-remote
    group: systemd-journal
    mode: "0755"

# The ceiling. systemd-journal-remote reads no size limit on systemd 252, which
# is what lxc200 runs: `MaxUse=` in journal-remote.conf arrived in v254, and a
# journald@remote.conf configures a journald namespace, not this receiver - the
# first version of this role wrote one and it capped nothing. So a timer vacuums
# the directory instead. Vacuuming removes archived files only, so the real bound
# is the target plus one active file per shipping node.
- name: Deploy the vacuum service
  ansible.builtin.copy:
    dest: /etc/systemd/system/journal-remote-vacuum.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (journal_remote). EXERCISE - see
      # docs/decisions/exercise-scope-before-terraform.md.
      [Unit]
      Description=Keep received journals under {{ journal_remote_max_use }}

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/journalctl --directory={{ journal_remote_dir }} --vacuum-size={{ journal_remote_max_use }}
  notify: Reload systemd

- name: Deploy the vacuum timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/journal-remote-vacuum.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (journal_remote). EXERCISE - see
      # docs/decisions/exercise-scope-before-terraform.md.
      [Unit]
      Description=Vacuum received journals hourly

      [Timer]
      OnCalendar=hourly
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Create the drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - systemd-journal-remote.service
    - systemd-journal-remote.socket

- name: Hand the receiver its socket from systemd
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/systemd-journal-remote.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart journal-remote

# The packaged socket listens on the wildcard, and the service cannot run
# without it: it requires the socket unit and has no network of its own. So the
# socket stays, and its address is pinned instead.
- name: Bind the socket to the Tailscale address
  ansible.builtin.template:
    src: socket-override.conf.j2
    dest: /etc/systemd/system/systemd-journal-remote.socket.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart journal-remote

# Under --check the package above was not installed, so on a first run none of
# these units exist and systemd_service fails the play. The role is in the weekly
# drift sweep, which runs in check mode; each unit task asks systemd first.
- name: Ask systemd which of the role's units exist yet  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      systemctl list-unit-files --no-legend --plain
      systemd-journal-remote.socket systemd-journal-remote.service
      journal-remote-vacuum.timer
  register: journal_remote_unit_files
  changed_when: false
  failed_when: false
  check_mode: false

# daemon_reload here rather than waiting for the handler: the socket must not
# start, even for the seconds until the flush, without its pinned address.
- name: Enable and start the socket
  ansible.builtin.systemd_service:
    name: systemd-journal-remote.socket
    daemon_reload: true
    masked: false
    enabled: true
    state: started
  when: "'systemd-journal-remote.socket' in journal_remote_unit_files.stdout or not ansible_check_mode"

- name: Flush handlers before reading the bind back
  ansible.builtin.meta: flush_handlers

# Enabling the service would only enable the socket again (its [Install]
# section is Also=), so it is started, not enabled. After a reboot the socket
# starts it on the first connection.
- name: Start the receiver
  ansible.builtin.systemd_service:
    name: systemd-journal-remote.service
    state: started
  when: "'systemd-journal-remote.service' in journal_remote_unit_files.stdout or not ansible_check_mode"

- name: Enable and start the vacuum timer
  ansible.builtin.systemd_service:
    name: journal-remote-vacuum.timer
    enabled: true
    state: started
  when: "'journal-remote-vacuum.timer' in journal_remote_unit_files.stdout or not ansible_check_mode"

# Read the socket table, not the unit state. A service that is active and a
# service listening where it was told are different claims, and this platform has
# three entries on the difference.
- name: Verify the receiver listens on the Tailscale address only
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      ss -tlnH | awk '{print $4}' | grep ':{{ journal_remote_port }}$' | sort -u
    executable: /bin/bash
  register: journal_remote_bind
  changed_when: false
  failed_when: journal_remote_bind.stdout | trim != journal_remote_listen_address ~ ':' ~ journal_remote_port
  when: not ansible_check_mode

- name: Report the bind
  ansible.builtin.debug:
    msg: >-
      journal receiver on {{ inventory_hostname }} listens on
      {{ journal_remote_bind.stdout }}. EXERCISE - no alert reads it.
  when:
    - not ansible_check_mode
    - journal_remote_bind.stdout is defined
