---
# === journal_remote (EXERCISE) ===
#
# The receiving half of central log aggregation. A learning exercise, not a
# control this platform needs; scope and exit are in
# docs/decisions/exercise-scope-before-terraform.md. No alert reads its output
# and nothing here is Enforced in security-controls.md.
#
# systemd's own remoting rather than Loki or ELK: shipping journals keeps
# structured fields, boot ids and ordering that a line-based collector drops.
#
# lxc200 sits on the same boot SSD as every other guest, so shipped logs outlive
# a guest, not the disk. Real aggregation needs a second failure domain.
journal_remote_package: systemd-journal-remote

# Bound to the node's Tailscale address, never the wildcard: the packaged socket
# listens on [::]:19532, an unauthenticated log sink on the LAN.
journal_remote_listen_address: "{{ ansible_host }}"
journal_remote_port: 19532

# Received journals and their cap. Uncapped, they would fill this container's
# root filesystem in the thin pool. Enforced by the hourly vacuum timer (tasks).
journal_remote_dir: /var/log/journal/remote
journal_remote_max_use: 2G

# Plain HTTP: WireGuard already encrypts and authenticates the tailnet, and TLS
# would add a second certificate lifecycle (see KE-16). Without an overlay
# network this would have to be true.
journal_remote_use_tls: false
