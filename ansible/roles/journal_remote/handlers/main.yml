---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# systemd refuses to start a socket whose service is active, so: stop the
# service, restart the socket on its new address, start the service (handlers run
# in listed order). Skipped under --check, where the units may not exist yet.
- name: Stop journal-remote
  ansible.builtin.systemd_service:
    name: systemd-journal-remote.service
    state: stopped
  listen: Restart journal-remote
  when: not ansible_check_mode

- name: Restart the journal-remote socket
  ansible.builtin.systemd_service:
    name: systemd-journal-remote.socket
    state: restarted
  listen: Restart journal-remote
  when: not ansible_check_mode

- name: Start journal-remote
  ansible.builtin.systemd_service:
    name: systemd-journal-remote.service
    state: started
  listen: Restart journal-remote
  when: not ansible_check_mode
