---
# The kernel audit subsystem needs CAP_AUDIT_CONTROL in the initial user
# namespace, which an unprivileged LXC does not have.
- name: Refuse to run inside a container
  ansible.builtin.assert:
    that: ansible_virtualization_role != 'guest' or ansible_virtualization_type not in ['lxc', 'container', 'docker']
    fail_msg: >-
      auditd cannot work inside an unprivileged LXC - the kernel audit subsystem
      is global and is not namespaced. Audit a container from its node, through
      the runtime, not from inside it.
    success_msg: "Not a container; the kernel audit subsystem is reachable."
    quiet: true

- name: Install auditd
  ansible.builtin.apt:
    name: "{{ auditd_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure the daemon
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
  # No validate: auditd has no check-only option. Acceptance is proven below by
  # the daemon running and the kernel holding the rules.
  notify: Reload audit rules

- name: Deploy the rule set
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/50-homelab.rules
    owner: root
    group: root
    mode: "0640"
  notify: Reload audit rules

# Under --check (the weekly drift sweep) the package may not be installed, and
# systemd_service would fail on the missing unit.
- name: Ask systemd whether auditd exists yet  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl list-unit-files --no-legend --plain auditd.service
  register: auditd_unit_file
  changed_when: false
  failed_when: false
  check_mode: false

- name: Enable and start auditd
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started
  when: auditd_unit_file.stdout | length > 0 or not ansible_check_mode

- name: Flush handlers so the rules are loaded before they are read back
  ansible.builtin.meta: flush_handlers

# Reads the kernel's loaded rules, not the file: a rejected rule leaves the file
# intact and the daemon running.
- name: Read the loaded rules back out of the kernel  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: auditctl -l
  register: auditd_loaded
  changed_when: false
  failed_when: auditd_loaded.stdout_lines | length < (auditd_rules | length)
  when: not ansible_check_mode

- name: Report how many rules the kernel holds
  ansible.builtin.debug:
    msg: >-
      auditd on {{ inventory_hostname }} holds
      {{ auditd_loaded.stdout_lines | length }} loaded rules,
      {{ auditd_rules | length }} declared. EXERCISE - no alert reads this.
  when:
    - not ansible_check_mode
    - auditd_loaded.stdout_lines is defined
