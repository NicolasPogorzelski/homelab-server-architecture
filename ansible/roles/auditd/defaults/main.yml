---
# === auditd (EXERCISE) ===
#
# A learning exercise, not a control this platform's risk requires; scope,
# labelling and exit are in docs/decisions/exercise-scope-before-terraform.md.
# Nothing here is listed as an Enforced control, and nothing here has an alert.
#
# Targets the hypervisor only. The kernel audit subsystem is global and not
# namespaced, so auditd inside an unprivileged LXC either fails or reports the
# host's events under the container's name. Containers are audited from the node.
auditd_packages:
  - auditd
  - audispd-plugins

# A short starter set answering "who changed accounts, who escalated". A
# production set is generated from a benchmark, not written by hand.
auditd_rules:
  - "-w /etc/passwd -p wa -k identity"
  - "-w /etc/shadow -p wa -k identity"
  - "-w /etc/group -p wa -k identity"
  - "-w /etc/sudoers -p wa -k escalation"
  - "-w /etc/sudoers.d/ -p wa -k escalation"
  - "-w /root/.ssh/authorized_keys -p wa -k access"
  - "-w /etc/ssh/sshd_config -p wa -k access"
  - "-w /etc/ssh/sshd_config.d/ -p wa -k access"
  - "-a always,exit -F arch=b64 -S execve -F euid=0 -F auid>=1000 -F auid!=4294967295 -k rootcmd"

# /var/log sits on the boot SSD (see KE-14), so log volume is capped hard:
# 4 x 8 MB, rotated without compression.
auditd_max_log_file_mb: 8
auditd_num_logs: 4
auditd_max_log_file_action: ROTATE

# Never HALT: many hardening guides copy it, and it powers the node off when the
# audit partition fills. On the hypervisor that takes every guest down. SYSLOG
# reports and keeps running.
auditd_space_left_action: SYSLOG
auditd_admin_space_left_action: SYSLOG
auditd_disk_full_action: SYSLOG

# Immutable rules (-e 2) cannot change until reboot. Off in this exercise;
# turning it on is what would make it a real control.
auditd_immutable: false
