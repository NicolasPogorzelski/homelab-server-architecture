---
- name: Deploy the paperless inbox scan script
  ansible.builtin.copy:
    src: "{{ paperless_scan_script_src }}"
    dest: "{{ paperless_scan_script_dest }}"
    owner: root
    group: root
    mode: "0750"

- name: Deploy the scan service unit
  ansible.builtin.template:
    src: paperless-inbox-scan.service.j2
    dest: /etc/systemd/system/paperless-inbox-scan.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy the scan timer unit
  ansible.builtin.template:
    src: paperless-inbox-scan.timer.j2
    dest: /etc/systemd/system/paperless-inbox-scan.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# `ansible.builtin.cron` only removes entries it created (`#Ansible: <name>`). The
# hand-written entry is filtered out and piped back through `crontab -`, which
# validates the file. sed rather than `grep -v`: grep exits 1 on empty output,
# which pipefail would turn into a failure when this was the only entry.
- name: Read the root crontab
  ansible.builtin.command:
    cmd: crontab -l -u root
  register: paperless_scan_root_crontab
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove the legacy paperless scan cron entry
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      crontab -l -u root | sed -E '/{{ paperless_scan_legacy_cron_pattern }}/d' | crontab -u root -
    executable: /bin/bash
  when: paperless_scan_root_crontab.stdout is search(paperless_scan_legacy_cron_pattern)
  changed_when: true

# Skipped in check mode: the unit file was not really written, so `enable` would
# fail with "Could not find the requested service".
- name: Enable and start the scan timer
  ansible.builtin.systemd_service:
    name: paperless-inbox-scan.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
