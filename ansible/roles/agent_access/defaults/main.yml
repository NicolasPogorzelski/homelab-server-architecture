---
# === agent_access ===
#
# The SSH keys that automated sessions on the admin workstations use, kept apart from the
# person's break-glass key so a log line names who acted and each key can be revoked alone
# through agent_access_revoked_keys.
# See docs/decisions/automation-identity.md.
#
# Accepted by one account on the control node only. From there automated sessions work through
# Ansible like a person; it has no key for root on the hypervisor or for the VM admin users.
agent_access_user: devops

# One entry per workstation: `name` and the public key, which is not secret. An empty list
# skips the role's key task.
agent_access_keys: []

# Tailscale addresses per workstation name (`from=` in authorized_keys), so each key is accepted
# only from its own workstation. Real values live in the private inventory; a key whose name has
# no addresses fails the run, because without `from=` sshd would accept it from any address.
agent_access_source_ips: {}

# Public keys to remove from the account. Deleting an entry from agent_access_keys does not
# revoke it, because the install task leaves keys it no longer lists in place (exclusive: false).
agent_access_revoked_keys: []
