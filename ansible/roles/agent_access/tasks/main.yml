---
- name: Refuse to install an automation key without a source restriction
  ansible.builtin.assert:
    that:
      - agent_access_source_ips is mapping
      - agent_access_source_ips[item.name] | default([]) | length > 0
    fail_msg: >-
      agent_access_source_ips has no addresses for {{ item.name }}. Without `from=` the key would
      be accepted from any address that reaches sshd. Set the workstation's addresses in
      hosts.yml under its name.
    quiet: true
  loop: "{{ agent_access_keys }}"
  loop_control:
    label: "{{ item.name }}"

# exclusive: false, because the account also carries the person's keys, which this role does
# not own. `restrict` turns off forwarding, PTY allocation and ~/.ssh/rc; commands still run.
- name: Install each automation key with its workstation's source restriction
  ansible.posix.authorized_key:
    user: "{{ agent_access_user }}"
    state: present
    exclusive: false
    key: "{{ item.pubkey }}"
    key_options: 'from="{{ agent_access_source_ips[item.name] | join(",") }}",restrict'
  loop: "{{ agent_access_keys }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove revoked automation keys
  ansible.posix.authorized_key:
    user: "{{ agent_access_user }}"
    state: absent
    key: "{{ item }}"
  loop: "{{ agent_access_revoked_keys }}"
  loop_control:
    label: "{{ item.split()[-1] }}"
