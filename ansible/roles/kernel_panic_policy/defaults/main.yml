---
# === kernel_panic_policy (Proxmox host) ===
#
# Reboots the hypervisor on a kernel oops instead of continuing. Linux by default
# kills only the faulting thread, and whatever it held stays held; this host has
# no out-of-band console (single GPU passed through, no serial, no BMC), so an
# oops can leave it running but unreachable (KE-21). See
# docs/decisions/hypervisor-panic-and-watchdog.md.
#
# kernel.panic=10 reboots ten seconds after the panic, giving netconsole and the
# persistent journal a window to capture the trace.
kernel_panic_on_oops: 1
kernel_panic_timeout_seconds: 10

kernel_panic_sysctl_file: /etc/sysctl.d/60-panic-policy.conf
