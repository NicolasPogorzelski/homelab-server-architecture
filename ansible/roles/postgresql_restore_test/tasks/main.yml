---
- name: Deploy pg-restore-test script
  ansible.builtin.copy:
    src: "{{ pg_restore_test_script_src }}"
    dest: "{{ pg_restore_test_script_dest }}"
    owner: root
    group: root
    mode: "0755"

# Shared with postgresql_backup, which creates it too. Declared here as well so
# the role can be applied to a node that has never had the backup role, rather
# than silently skipping the metric because the directory happens to be absent.
- name: Create textfile collector directory
  ansible.builtin.file:
    path: "{{ pg_restore_test_textfile_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

- name: Deploy pg-restore-test service unit
  ansible.builtin.template:
    src: pg-restore-test.service.j2
    dest: /etc/systemd/system/pg-restore-test.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy pg-restore-test timer unit
  ansible.builtin.template:
    src: pg-restore-test.timer.j2
    dest: /etc/systemd/system/pg-restore-test.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start the restore-test timer
  ansible.builtin.systemd_service:
    name: pg-restore-test.timer
    enabled: true
    state: started
    daemon_reload: true
