---
# The collector is Debian's packaged smartmon.sh, not a script of this repository.
# It exports the per-attribute SMART data that an overall PASSED verdict hides.
smart_metrics_package: prometheus-node-exporter-collectors

# `sponge` reads the whole stream before it writes anything, so node_exporter
# never scrapes a half-written file. The packaged unit uses it without declaring
# the dependency; it lives in moreutils.
smart_metrics_sponge_package: moreutils

smart_metrics_collector: /usr/share/prometheus-node-exporter-collectors/smartmon.sh

# The directory the node_exporter role reads. The package defaults to Debian's
# /var/lib/prometheus/node-exporter, which nothing here scrapes; without the
# override the collector would succeed and be read by nobody.
smart_metrics_textfile_dir: /var/lib/node_exporter/textfile_collector
smart_metrics_output: smartmon.prom

smart_metrics_unit: prometheus-node-exporter-smartmon.service
smart_metrics_timer: prometheus-node-exporter-smartmon.timer

# The package ships five collector timers. Three measure hardware this host does
# not have - IPMI, Mellanox, NVMe - and are masked rather than disabled (see
# systemd_hygiene). The apt timer is not listed because apt_metrics owns it.
smart_metrics_masked_timers:
  - prometheus-node-exporter-ipmitool-sensor.timer
  - prometheus-node-exporter-mellanox-hca-temp.timer
  - prometheus-node-exporter-nvme.timer

# The retired hand-deployed smarttext collector. Its `mktemp` had no cleanup trap
# and left one smart.prom.* file per failed run.
smart_metrics_legacy_script: /usr/local/sbin/node-exporter-smarttext.sh
smart_metrics_legacy_units:
  - node-exporter-smarttext.timer
  - node-exporter-smarttext.service
smart_metrics_legacy_output: smart.prom

# Anything matching *.prom.* older than this is a leak rather than a live write.
# A collector run takes under thirty seconds, so an hour is ample headroom and
# still clears leaks the same day.
smart_metrics_orphan_age: 3600
