---
# One zone for the whole fleet, so every OnCalendar time in this repository means
# the same wall-clock time on every node. Europe/Berlin rather than UTC: the
# hypervisor's RTC wake (homelab-setwake.sh) and the incident notes use local time.
#
# No timer may fall between 02:00 and 03:00, the hour that does not exist in March
# and happens twice in October.
timezone_name: Europe/Berlin

# MariaDB's default `time_zone = SYSTEM` follows the operating system, so the role
# pins it to UTC. Off by default; switched on in host_vars for the MariaDB node.
# PostgreSQL carries `timezone = Etc/UTC` in its own configuration, and PHP with
# `date.timezone` unset defaults to UTC; neither reads the system zone.
timezone_pin_mariadb: false
timezone_mariadb_value: "+00:00"
timezone_mariadb_conf: /etc/mysql/mariadb.conf.d/60-timezone.cnf
