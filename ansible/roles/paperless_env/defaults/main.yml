---
# === paperless-ngx ===

paperless_dbengine: postgresql
paperless_dbport: 5432
paperless_dbname: paperless_db
paperless_dbuser: paperless_user
paperless_dbsslmode: require

# === paths ===

paperless_compose_dir: /opt/paperless
paperless_data_dir: /usr/src/paperless/data
paperless_media_root: /usr/src/paperless/media
paperless_consumption_dir: /usr/src/paperless/consume

# === redis ===

# Compose service name on the paperless bridge network (NOT localhost: that
# resolves to paperless' own container, where no Redis listens -> Error 111).
paperless_redis: redis://redis:6379

# === general ===

paperless_ocr_language: deu+eng
paperless_time_zone: Europe/Berlin

# === network ===

# No URL is declared here on purpose. The two values that belong here -
# PAPERLESS_URL and PAPERLESS_CSRF_TRUSTED_ORIGINS - are read from the node's own
# Tailscale daemon at deploy time by tasks/main.yml. They used to be literals, and
# the literal was this repository's `<tailnet-id>` sanitization placeholder: a
# value that is correct in a public file and wrong on a live host, with nothing
# able to tell the two apart. Deriving it removes the placeholder rather than
# moving it into the vault.

# === consumer ===

paperless_consumer_recursive: true
paperless_consumer_polling: 30

# === logging ===

paperless_logging_dir: /usr/src/paperless/logs

# === user ===

paperless_uid: 1000
paperless_gid: 1000
