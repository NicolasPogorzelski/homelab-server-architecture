---
# The Serve URL is read from tailscaled, the only authority for the name. Paperless
# needs it as PAPERLESS_URL and in PAPERLESS_CSRF_TRUSTED_ORIGINS; a wrong origin
# fails every browser login with 403 while the API keeps working. No fallback value:
# it would be a second, plausible-looking place for the name to be wrong.
- name: Read the node's Tailscale status
  ansible.builtin.command:
    cmd: tailscale status --json
  register: paperless_tailscale_status
  changed_when: false
  check_mode: false

# Self.DNSName ends in a dot ("paperless.<tailnet-id>.ts.net."), which is valid DNS
# but fails Django's byte-for-byte origin comparison.
- name: Derive the Tailscale Serve URL
  ansible.builtin.set_fact:
    paperless_serve_url: 'https://{{ (paperless_tailscale_status.stdout | from_json).Self.DNSName | regex_replace("\.$", "") }}'

- name: Assert the derived Serve URL is a Tailscale host name
  ansible.builtin.assert:
    that:
      - paperless_serve_url is match('^https://[a-z0-9][a-z0-9.-]*\.ts\.net$')
    fail_msg: >-
      Derived Serve URL "{{ paperless_serve_url }}" is not a Tailscale host name.
      Refusing to write an .env that would break CSRF origin checking.
    success_msg: 'Serve URL derived from tailscaled: {{ paperless_serve_url }}'

# diff: false because the file holds the database password and the secret key,
# and --diff prints unchanged lines as context.
- name: Deploy paperless .env
  ansible.builtin.template:
    src: paperless.env.j2
    dest: "{{ paperless_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  diff: false
  notify: Restart paperless
