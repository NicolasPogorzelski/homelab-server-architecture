---
# Saturday morning, after the host's scheduled wake (homelab_schedule) and before
# lxc-fstrim.timer and guest_backup, so the snapshot describes the week before
# jobs rewrite state and stays clear of the backup's disk load.
#
# The zone is explicit: lxc250 runs Etc/UTC, the hypervisor Europe/Berlin. A bare
# time would drift by the UTC offset and across daylight-saving changes.
fleet_snapshot_on_calendar: "Sat *-*-* 10:10:00 Europe/Berlin"
fleet_snapshot_randomized_delay: "300"

# The unit runs the playbook from the control node's checkout, interpreter and
# vault password.
fleet_snapshot_user: devops
fleet_snapshot_repo: /home/devops/git/homelab-server-architecture
fleet_snapshot_playbook: playbooks/fleet-snapshot.yml
fleet_snapshot_path: /home/devops/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# Absolute: systemd resolves a bare ExecStart name against fixed directories and
# ignores Environment=PATH (a bare name fails with 203/EXEC).
fleet_snapshot_playbook_bin: /home/devops/.local/bin/ansible-playbook
