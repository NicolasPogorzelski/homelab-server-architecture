---
# The role acts on two lists: units that can never succeed on *this* node
# (systemd_hygiene_masked_units, per host) and units whose condition belongs to
# a group (systemd_hygiene_group_units). Combined once here, so the tasks below
# loop over a single list.
- name: Combine the per-host and per-group lists
  ansible.builtin.set_fact:
    systemd_hygiene_units: "{{ systemd_hygiene_group_units + systemd_hygiene_masked_units }}"
    systemd_hygiene_packages: "{{ systemd_hygiene_group_absent_packages + systemd_hygiene_absent_packages }}"

# Two kinds of unit, two treatments:
#
#   action: mask   (default) - a package unit under /usr/lib/systemd/system;
#                  `systemctl mask` shadows it with a /dev/null symlink.
#   action: remove - a local file in /etc/systemd/system. Masking fails ("File
#                  ... already exists"), so the file is deleted.
#
# `state: stopped` alongside the mask, because a mask only decides what starts next
# time; a running unit keeps running and listening.
- name: Mask package-provided units that can never succeed on this node
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    masked: true
    state: stopped
  loop: "{{ systemd_hygiene_units }}"
  loop_control:
    label: "{{ item.name }} - {{ item.reason }}"
  when: (item.action | default('mask')) == 'mask'

# systemd_service errors on a unit whose file is gone, so stop and disable are
# gated on the file still existing.
- name: Detect which unit files are still present
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ item.name }}
  loop: "{{ systemd_hygiene_units }}"
  loop_control:
    label: "{{ item.name }}"
  register: systemd_hygiene_unit_files
  changed_when: false

- name: Stop and disable locally-defined units scheduled for removal
  ansible.builtin.systemd_service:
    name: "{{ item.item.name }}"
    state: stopped
    enabled: false
  loop: "{{ systemd_hygiene_unit_files.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - (item.item.action | default('mask')) == 'remove'
    - item.stat.exists

- name: Remove locally-defined unit files
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item.name }}
    state: absent
  loop: "{{ systemd_hygiene_units }}"
  loop_control:
    label: "{{ item.name }} - {{ item.reason }}"
  when: (item.action | default('mask')) == 'remove'
  notify: Reload systemd

# Masking or removing stops a unit from starting again; neither clears the
# `failed` result already recorded for it. Without this, node_systemd_unit_state
# keeps reporting state="failed" for a unit that can no longer be attempted.
#
# command-instead-of-module waived here only: systemd_service has no query-only
# mode and errors on a deleted unit, and service_facts sees .service units only,
# while the lists include .mount units.
- name: Check which handled units still carry a failed state # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl is-failed {{ item.name }}
  loop: "{{ systemd_hygiene_units }}"
  loop_control:
    label: "{{ item.name }}"
  register: systemd_hygiene_is_failed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Clear the residual failed state
  ansible.builtin.command:
    cmd: systemctl reset-failed {{ item.item.name }}
  loop: "{{ systemd_hygiene_is_failed.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stdout | trim == "failed"
  changed_when: true

# === Packages that are the cause rather than the symptom ===

# apt-get -s prints the removal plan without executing it; what else a removal
# takes differs per node. noqa: command-instead-of-module - the apt module's
# check mode does not report which packages apt would take with it.
- name: Simulate the package removal  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: apt-get -s -o Debug::NoLocking=1 remove --purge {{ systemd_hygiene_packages | map(attribute='name') | join(' ') }}
  register: systemd_hygiene_removal_plan
  changed_when: false
  check_mode: false
  when: systemd_hygiene_packages | length > 0

# `remove --purge` reports packages as `Purg`, not `Remv`, so both are matched.
# Two plain replacements instead of a backreference, whose escaping through YAML
# and Jinja reaches re.sub as a literal backslash-digit.
- name: Refuse a removal that would take anything else with it
  ansible.builtin.assert:
    that:
      - systemd_hygiene_unplanned_removals | length == 0
    fail_msg: >-
      Removing {{ systemd_hygiene_packages | map(attribute='name') | join(', ') }}
      would also remove {{ systemd_hygiene_unplanned_removals | join(', ') }}.
      Nothing was changed. Decide about those packages explicitly before rerunning.
    success_msg: >-
      apt would remove only the listed packages.
  vars:
    systemd_hygiene_unplanned_removals: >-
      {{ systemd_hygiene_removal_plan.stdout_lines
         | select('match', '^(Remv|Purg) ')
         | map('regex_replace', '^(Remv|Purg) ', '')
         | map('regex_replace', ' .*$', '')
         | difference(systemd_hygiene_packages | map(attribute='name') | list) }}
  when: systemd_hygiene_packages | length > 0

- name: Remove packages whose presence is the fault
  ansible.builtin.apt:
    name: "{{ systemd_hygiene_packages | map(attribute='name') | list }}"
    state: absent
    purge: true
    autoremove: false
  when: systemd_hygiene_packages | length > 0

# Unmask before deleting the symlink: systemd knows the unit as masked until told
# otherwise, and a bare `rm` would leave that state until a reload.
- name: Unmask units whose package is gone
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    masked: false
  loop: "{{ systemd_hygiene_retired_units }}"
  loop_control:
    label: "{{ item.name }} - {{ item.reason }}"
  failed_when: false

- name: Remove the leftover mask symlinks
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item.name }}
    state: absent
  loop: "{{ systemd_hygiene_retired_units }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd
