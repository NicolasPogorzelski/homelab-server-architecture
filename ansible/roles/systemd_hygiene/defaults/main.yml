---
# === systemd_hygiene ===
#
# Units that can never succeed on a given node, listed per host in host_vars.
# They are masked at the source rather than filtered out of the Prometheus alert,
# because a `SystemdUnitFailed` rule that carries a permanent exception list stops
# being read. Every remaining failed unit on the fleet should mean something.
#
# Each entry:
#   name:   the unit, e.g. "openipmi.service"
#   reason: why it can never succeed on this node (printed on every run)
#   action: "mask" (default) for package-provided units under /usr/lib/systemd/system,
#           "remove" for hand-written units that already live in /etc/systemd/system —
#           masking those fails, because the mask symlink and the unit file are the
#           same path.
systemd_hygiene_masked_units: []
