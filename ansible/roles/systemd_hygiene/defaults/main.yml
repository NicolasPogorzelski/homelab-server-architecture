---
# === systemd_hygiene ===
#
# Units that can never succeed on a given node, listed per host in host_vars.
# They are masked at the source rather than filtered out of the Prometheus alert,
# so `SystemdUnitFailed` needs no permanent exception list and every failed unit
# means something.
#
# Each entry:
#   name:   the unit, e.g. "openipmi.service"
#   reason: why it can never succeed on this node (printed on every run)
#   action: "mask" (default) for package-provided units under /usr/lib/systemd/system,
#           "remove" for hand-written units that already live in /etc/systemd/system -
#           masking those fails, because the mask symlink and the unit file are the
#           same path.
systemd_hygiene_masked_units: []

# Units whose condition is a property of a group, not of one node. A separate
# variable, because Ansible does not merge variables of the same name: a host
# setting the per-host list would silently drop the group entries. Concatenated
# with the per-host list in tasks/main.yml; same entry format.
systemd_hygiene_group_units: []

# Packages whose presence is the reason a unit above can never succeed, for
# example nfs-common on a node without NFS (run-rpc_pipefs.mount, rpcbind on :111;
# KE-3). Removing the package retires the mask instead of maintaining it.
#
# Each entry:
#   name:   the package
#   reason: why it cannot be used on this node
#
# The role simulates the removal and refuses if apt would take anything beyond
# this list. Where it would (on the hypervisor, proxmox-ve), the unit list above is
# the fallback; see group_vars/proxmox.yml.
systemd_hygiene_absent_packages: []

# The same for packages, per group; concatenated with the per-host list for the
# reason systemd_hygiene_group_units gives.
systemd_hygiene_group_absent_packages: []

# Units this role masked whose package is gone. Unmasked and the symlink removed,
# because a stale mask looks exactly like a current one.
systemd_hygiene_retired_units: []
