---
- name: Install calibre (provides calibredb)
  ansible.builtin.apt:
    name: calibre
    state: present
    update_cache: true

# The script and its units are deployed before the mount is asserted: they carry
# their own runtime guard and are safe to converge whether or not the CIFS share
# is up. Asserting first would make a broken host mount block delivery of the very
# script that handles a broken host mount.
- name: Deploy import script
  ansible.builtin.copy:
    src: "{{ calibre_importer_script_src }}"
    dest: "{{ calibre_importer_script_dest }}"
    owner: root
    group: root
    mode: "0755"

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: calibre-import.service.j2
    dest: /etc/systemd/system/calibre-import.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy systemd timer unit
  ansible.builtin.template:
    src: calibre-import.timer.j2
    dest: /etc/systemd/system/calibre-import.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# `mountpoint -q` was the previous guard. It is true for the mp2 bind itself even
# when the host-side CIFS mount failed, so it could not see the failure class it
# was written for (2026-07-10 incident). check_mode: false makes the probe run
# during --check too; a guard that is skipped in a dry-run guards nothing.
- name: Probe the filesystem type of the rw library mount
  ansible.builtin.command:
    cmd: findmnt -no FSTYPE {{ calibre_importer_library }}
  register: calibre_importer_library_fstype
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert the rw library is the CIFS share and not the directory beneath it
  ansible.builtin.assert:
    that:
      - calibre_importer_library_fstype.stdout | trim == "cifs"
    fail_msg: >-
      {{ calibre_importer_library }} has fstype
      '{{ calibre_importer_library_fstype.stdout | trim | default("none", true) }}',
      expected 'cifs'. The Proxmox host has not mounted the rw Calibre share; the
      mp2 bind is exposing the empty directory underneath it on pve-root. Mount
      /mnt/smb/books-rw on the host, then `pct reboot 220`.
    success_msg: "{{ calibre_importer_library }} is a CIFS mount"

- name: Create import + quarantine directories
  ansible.builtin.command:
    cmd: mkdir -p {{ calibre_importer_import_dir }}/.failed
    creates: "{{ calibre_importer_import_dir }}/.failed"

- name: Enable and start the import timer
  ansible.builtin.systemd_service:
    name: calibre-import.timer
    enabled: true
    state: started
    daemon_reload: true
