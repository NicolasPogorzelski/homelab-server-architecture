---
# Single source of truth lives in snippets/mariadb/.
# playbook_dir = ansible/playbooks -> ../../ = repo root.
mariadb_backup_script_src: "{{ playbook_dir }}/../../snippets/mariadb/mariadb-backup.sh"
mariadb_backup_script_dest: /usr/local/sbin/mariadb-backup.sh

# Bind of the host's CIFS mount of the backup share. The role refuses to deploy
# if this is not a CIFS mount -- see tasks/main.yml for why that is an assert and
# not a "create the directory" task.
mariadb_backup_dir: /mnt/backups

mariadb_backup_textfile_dir: /var/lib/node_exporter/textfile_collector

# A systemd timer, not a cron job. The Proxmox host is powered down overnight
# (homelab_schedule) and woken by RTC in the morning, so nothing runs at 03:30
# and a cron slot would simply be missed and lost -- exactly how the PostgreSQL
# dumps silently stopped for two months. Persistent=true fires the overdue run at
# the next boot instead.
mariadb_backup_oncalendar: "*-*-* 03:30:00"

# Because both database timers catch up at boot, the half-hour offset in the
# calendar above buys nothing on the run that actually matters: after an
# overnight power-down, pg-backup and this one both fire within seconds of each
# other and stream to the same CIFS server. The randomised delay separates them
# without coupling the two units to each other.
mariadb_backup_randomized_delay_sec: 300
