---
# Single source of truth lives in snippets/mariadb/.
# playbook_dir = ansible/playbooks -> ../../ = repo root.
mariadb_backup_script_src: "{{ playbook_dir }}/../../snippets/mariadb/mariadb-backup.sh"
mariadb_backup_script_dest: /usr/local/sbin/mariadb-backup.sh

# Bind of the host's CIFS mount of the backup share. The role refuses to deploy
# unless this is a CIFS mount (tasks/main.yml).
mariadb_backup_dir: /mnt/backups

mariadb_backup_textfile_dir: /var/lib/node_exporter/textfile_collector

# The host is powered down at this hour (homelab_schedule); the timer's
# Persistent=true fires the overdue run at the next boot.
mariadb_backup_oncalendar: "*-*-* 03:30:00"

# After a power-down this and pg-backup both catch up at boot against the same
# CIFS server; the random delay separates them without coupling the units.
mariadb_backup_randomized_delay_sec: 300
