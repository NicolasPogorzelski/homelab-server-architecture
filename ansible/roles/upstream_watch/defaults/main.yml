---
# === upstream_watch (lxc250) ===
#
# A mitigation that waits for an upstream fix names the pull request in its
# known-errors.md entry; this role checks weekly whether a release contains it.
# UpstreamFixReleased then names the entry to revert. Unauthenticated GitHub API:
# a few requests a week, far below its hourly limit.

upstream_watch_script_src: "{{ playbook_dir }}/../../snippets/scripts/upstream-watch.py"
upstream_watch_script_dest: /usr/local/sbin/upstream-watch.py
upstream_watch_conf: /etc/upstream-watch.conf
upstream_watch_textfile_dir: /var/lib/node_exporter/textfile_collector

# Saturday, in the same window as the other weekly control-node jobs.
upstream_watch_on_calendar: "Sat *-*-* 10:40:00 Europe/Berlin"

# name | owner/repo | pull request | known-errors.md entry
upstream_watch_items:
  - "abs-collections-minified|advplyr/audiobookshelf|5358|KE-30"
