---
# === storage_permissions (VM102) ===
#
# The target state of the filesystem underneath the Samba shares, and a check
# that measures it.
#
# smb.conf only governs what Samba creates, and its masks apply at creation only;
# directories created over SSH bypass it. Wrong groups and missing setgid bits stay
# invisible while consumers can still read through "other". This matrix states the
# target and the check measures it. See docs/platform/storage-permissions.md.

storage_permissions_script_src: "{{ playbook_dir }}/../../snippets/storage/storage-permissions.sh"
storage_permissions_script_dest: /usr/local/sbin/storage-permissions.sh
storage_permissions_conf: /etc/storage-permissions.conf

# Daily, while the nightly snapraid sync may still be running; the check reads only
# metadata, so it barely competes for disk bandwidth. The nightly shutdown waits
# while storage-permissions.service is active (homelab_schedule guard units).
storage_permissions_oncalendar: "*-*-* 23:15:00"

# === The matrix ===
#
# Columns: name, owner, group, dir_mode, file_mode, setgid
#
# Modes are MAXIMA, not exact values: an object violates the matrix if it carries
# a bit the maximum does not allow. Stricter is fine (a 0600 key under a 0660
# allowance is not drift); the check answers "can anyone reach this who should not".
#
# owner "-" means deliberately unpinned; see the comment in the script. Entries
# that are not carried in this repository live in /etc/storage-permissions.local.conf
# on the node, which the script reads alongside this matrix and Ansible never touches.
#
# The read path of every media consumer is the group; `other` gets nothing, so a
# service that loses its group membership loses access visibly.
storage_permissions_entries:
  # Media libraries. Consumers hold read-only shares and read via the group.
  - name: Audiobooks
    owner: storage
    group: media-abs
    dir_mode: "2750"
    file_mode: "0640"
    setgid: true
  - name: Podcasts
    owner: storage
    group: media-abs
    dir_mode: "2750"
    file_mode: "0640"
    setgid: true
  - name: Filme
    owner: storage
    group: media-jf
    dir_mode: "2750"
    file_mode: "0640"
    setgid: true
  - name: Serien
    owner: storage
    group: media-jf
    dir_mode: "2750"
    file_mode: "0640"
    setgid: true
  # Calibre-Web reads Books through the books-svc group.
  - name: Books
    owner: storage
    group: books-svc
    dir_mode: "2750"
    file_mode: "0640"
    setgid: true

  # Service data. Every one of these shares carries `force user = storage`, so
  # the service reaches its files as the owner and the group is not a read path
  # but a boundary that keeps every other account out.
  - name: Nextcloud
    owner: storage
    group: storage
    dir_mode: "2770"
    file_mode: "0660"
    setgid: true
  - name: Paperless
    owner: storage
    group: storage
    dir_mode: "2770"
    file_mode: "0660"
    setgid: true
  - name: Postgres-Backups
    owner: storage
    group: storage
    dir_mode: "2770"
    file_mode: "0660"
    setgid: true
  - name: DB-Backups
    owner: storage
    group: storage
    dir_mode: "2770"
    file_mode: "0660"
    setgid: true
