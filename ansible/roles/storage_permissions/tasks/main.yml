---
- name: Assert the MergerFS pool is mounted
  ansible.builtin.command:
    cmd: findmnt --noheadings --output TARGET /mnt/mergerfs
  register: storage_permissions_pool
  changed_when: false
  failed_when: storage_permissions_pool.rc != 0

# Checked at deploy time, where a person sees it, rather than in the timer run.
# getfattr, not stat: /mnt/mergerfs/.mergerfs is a pseudo file that answers xattr
# calls but has no directory entry. check_mode: false so --check can run the
# assertion below; the command only reads an extended attribute.
- name: Read the MergerFS branch list
  ansible.builtin.command:
    cmd: getfattr --only-values -n user.mergerfs.branches /mnt/mergerfs/.mergerfs
  register: storage_permissions_ctl
  changed_when: false
  failed_when: false
  check_mode: false

- name: Fail early if the branch list is unreadable
  ansible.builtin.assert:
    that:
      - storage_permissions_ctl.rc == 0
      - storage_permissions_ctl.stdout | length > 0
    fail_msg: >-
      Cannot read user.mergerfs.branches from /mnt/mergerfs/.mergerfs. The check
      reads the branch list there because the repository does not carry the real
      disk labels; without it the branch list would have to be maintained by hand.

# MergerFS clones a share directory onto a branch with mkdir(2) on first write,
# and mkdir drops setgid under a branch root without it. Creating every share on
# every branch in advance lets subdirectories inherit setgid. Existing directories
# are left alone; entries from the node's .local.conf are not covered.
- name: Record the branch paths
  ansible.builtin.set_fact:
    storage_permissions_branches: >-
      {{ storage_permissions_ctl.stdout.split(':') | map('regex_replace', '=.*$', '') | list }}

- name: Read which share directories exist on which branch
  ansible.builtin.stat:
    path: "{{ item.0 }}/{{ item.1.name }}"
  loop: "{{ storage_permissions_branches | product(storage_permissions_entries) | list }}"
  loop_control:
    label: "{{ item.1.name }}"
  register: storage_permissions_share_dirs

- name: Create the share directories a branch does not have yet
  ansible.builtin.file:
    path: "{{ item.item.0 }}/{{ item.item.1.name }}"
    state: directory
    owner: "{{ item.item.1.owner if item.item.1.owner != '-' else omit }}"
    group: "{{ item.item.1.group }}"
    mode: "{{ item.item.1.dir_mode }}"
  loop: "{{ storage_permissions_share_dirs.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.1.name }}"

- name: Deploy the storage permission check script
  ansible.builtin.copy:
    src: "{{ storage_permissions_script_src }}"
    dest: "{{ storage_permissions_script_dest }}"
    owner: root
    group: root
    mode: "0750"

- name: Deploy the target matrix
  ansible.builtin.template:
    src: storage-permissions.conf.j2
    dest: "{{ storage_permissions_conf }}"
    owner: root
    group: root
    mode: "0644"

- name: Deploy the check unit
  ansible.builtin.template:
    src: storage-permissions.service.j2
    dest: /etc/systemd/system/storage-permissions.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy the check timer
  ansible.builtin.template:
    src: storage-permissions.timer.j2
    dest: /etc/systemd/system/storage-permissions.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# Skipped in check mode: the unit files were not really written, so `enable` would
# fail with "Could not find the requested service".
- name: Enable and start the check timer
  ansible.builtin.systemd_service:
    name: storage-permissions.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

# --metrics, not --check: drift is reported by Prometheus from the metric, not as
# a failed Ansible run. This only proves the check runs.
- name: Run the check once so the metric exists immediately
  ansible.builtin.command:
    cmd: "{{ storage_permissions_script_dest }} --metrics"
  register: storage_permissions_run
  changed_when: false
  when: not ansible_check_mode

- name: Show the result
  ansible.builtin.debug:
    var: storage_permissions_run.stdout_lines
  when: not ansible_check_mode
