---
# === jellyfin_watchdog (VM100) ===
#
# Polls `nvidia-smi` inside the Jellyfin container and restarts it when CUDA
# access has gone stale (KE-10), unless only direct streams (no GPU) are playing;
# then it holds and polls again. Replaces a legacy root crontab entry.
#
# Monotonic timer, so no Persistent= (it applies only to OnCalendar timers, and a
# missed poll while the host was off needs no catch-up).

jellyfin_watchdog_script_src: "{{ playbook_dir }}/../../snippets/scripts/jellyfin-cuda-watchdog.sh"
jellyfin_watchdog_script_dest: /usr/local/sbin/jellyfin-cuda-watchdog.sh

# First poll 5 minutes after boot, once Docker and the NVIDIA runtime settled.
jellyfin_watchdog_onbootsec: 5min
# A held restart follows the end of the last direct stream within a minute. A
# poll is one `docker exec nvidia-smi`, plus one API call when CUDA is gone.
jellyfin_watchdog_oninterval: 1min
# systemd coalesces timers within AccuracySec, one minute by default, which would
# double the effective interval.
jellyfin_watchdog_accuracysec: 5s

# Used to ask Jellyfin which sessions play and how. Same key as
# jellyfin_user_prefs; kept in a root-only header file, never on a command line.
jellyfin_watchdog_config_dir: /etc/jellyfin-cuda-watchdog
jellyfin_watchdog_url: "http://{{ ansible_host }}:8096"
jellyfin_watchdog_api_key: "{{ vault_jellyfin_api_key }}"

jellyfin_watchdog_legacy_cron_pattern: jellyfin-cuda-watchdog
