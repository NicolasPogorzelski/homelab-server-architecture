---
# === jellyfin_watchdog (VM100) ===
#
# Replaces the hand-deployed `*/30 * * * *` root crontab entry. The watchdog polls
# `nvidia-smi` inside the Jellyfin container and restarts it when CUDA access has
# gone stale (KE-10, root cause unconfirmed).
#
# The timer is MONOTONIC, not calendar-based: what matters is "every 30 minutes of
# uptime", not "at :00 and :30". `Persistent=` is therefore deliberately absent -
# it only applies to OnCalendar timers and systemd ignores it here. Catching up a
# missed poll after a power-off is meaningless: the container is not running either.

jellyfin_watchdog_script_src: "{{ playbook_dir }}/../../snippets/scripts/jellyfin-cuda-watchdog.sh"
jellyfin_watchdog_script_dest: /usr/local/sbin/jellyfin-cuda-watchdog.sh

# First poll 5 minutes after boot: Docker and the NVIDIA runtime need to settle,
# and a restart issued into a half-started container is worse than a late one.
jellyfin_watchdog_onbootsec: 5min
jellyfin_watchdog_oninterval: 30min

jellyfin_watchdog_legacy_cron_pattern: jellyfin-cuda-watchdog
