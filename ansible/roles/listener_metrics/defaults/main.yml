---
# === listener_metrics ===
#
# Single source of truth lives in snippets/scripts/.
# playbook_dir = ansible/playbooks -> ../../ = repo root.
listener_metrics_script_src: "{{ playbook_dir }}/../../snippets/scripts/listener-metrics.sh"
listener_metrics_script_dest: /usr/local/sbin/listener-metrics.sh
listener_metrics_allow_file: /etc/listener-metrics.allow
listener_metrics_textfile_dir: /var/lib/node_exporter/textfile_collector

# Fifteen minutes against a rule with `for: 30m`: a listener has to be seen on
# three runs before anyone is told, which lets a package upgrade restart a
# service without paging and still reports the one that comes back wrong.
listener_metrics_interval: 15min

# Exceptions every node shares, and neither can be bound to the overlay.
# tailscaled carries the overlay itself: WireGuard on 41641 accepts from any
# peer address, and its portmapper probes the router by UPnP and PCP from a
# short-lived socket on a random port, so it is allowed by process rather than
# by port. The DHCP client listens on 68 for the server's reply.
# Entries: proto and port, or port "*" with a process name.
listener_metrics_allowed_common:
  - { proto: udp, port: "*", process: tailscaled, reason: "tailscaled WireGuard transport and portmapper probes" }
  - { proto: udp, port: 68, reason: "DHCP client" }

# Per-node exceptions, each one a documented decision. Set in host_vars or
# group_vars with the decision named in its reason. An entry without a decision
# behind it is how a violation becomes permanent.
listener_metrics_allowed: []
