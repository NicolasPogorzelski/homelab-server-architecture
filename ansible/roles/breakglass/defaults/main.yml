---
# Break-glass SSH public keys for the host's native admin user. Empty by default:
# the key task is skipped unless group/host vars supply keys. The sudoers and
# group checks below run regardless.
breakglass_pubkeys: []

# Sudoers files that granted the break-glass account root without a password.
# ansible-apt is left over from before Ansible connected as its own `ansible`
# user. The account keeps root through the `sudo` group, behind its password.
breakglass_retired_sudoers_files:
  - /etc/sudoers.d/ansible-apt

# Groups whose members are root without sudo (Docker socket, LXD, libvirt, raw
# disk access). A sudo password protects nothing while the account is in one.
breakglass_root_equivalent_groups:
  - docker
  - lxd
  - libvirt
  - disk
