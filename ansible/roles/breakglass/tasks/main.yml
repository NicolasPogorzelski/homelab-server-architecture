---
# One call with all keys joined by newlines, not a loop: `exclusive` applies per
# invocation, so in a loop only the last key would survive.
#
# exclusive: true makes the inventory the single source of truth; any key added
# by hand is removed. Ansible itself connects as the `ansible` user, whose
# authorized_keys this role does not touch.
- name: Enforce the break-glass SSH public keys for the native admin user
  ansible.posix.authorized_key:
    user: "{{ breakglass_user }}"
    state: present
    exclusive: true
    key: "{{ breakglass_pubkeys | join(breakglass_key_separator) }}"
  vars:
    # A real newline, built by the double-quoted YAML scalar. An inline
    # `join("\n")` is not unescaped by Jinja and would join all keys into one
    # malformed line, which exclusive: true then enforces.
    breakglass_key_separator: "\n"
  when: breakglass_pubkeys | length > 0

# Without the NOPASSWD rule, root goes through `sudo` and the account password.
# A locked or unset password would lose root entirely, so the run stops there.
- name: Read the break-glass account's password status  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: passwd -S {{ breakglass_user }}
  register: breakglass_passwd_status
  changed_when: false
  check_mode: false

- name: Refuse to remove passwordless sudo from an account without a usable password
  ansible.builtin.assert:
    that:
      - breakglass_passwd_status.stdout.split()[1] == 'P'
    fail_msg: >-
      {{ breakglass_user }} has password status
      {{ breakglass_passwd_status.stdout.split()[1] }}, not P. Without a password the
      account would have no way to root once the NOPASSWD rule is gone. Set one first.
    quiet: true

- name: Remove sudoers files that grant the break-glass account root without a password
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ breakglass_retired_sudoers_files }}"

# Reads what sudo itself resolves, so a NOPASSWD rule under any other file name
# fails the run. Skipped in check mode, so the weekly drift sweep does not run
# this check; it runs on real (non-check) runs only.
- name: Read the break-glass account's effective sudo rules  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: sudo -l -U {{ breakglass_user }}
  register: breakglass_sudo_rules
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Refuse any remaining passwordless sudo rule for the break-glass account
  ansible.builtin.assert:
    that:
      - "'NOPASSWD' not in breakglass_sudo_rules.stdout"
    fail_msg: >-
      {{ breakglass_user }} still has a NOPASSWD rule:
      {{ breakglass_sudo_rules.stdout_lines | select('search', 'NOPASSWD') | list }}
    quiet: true
  when: not ansible_check_mode

# Root-equivalent groups would bypass the sudo password. gpasswd per group,
# because ansible.builtin.user can only set the full group list.
- name: Read the break-glass account's groups  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: id -nG {{ breakglass_user }}
  register: breakglass_groups
  changed_when: false
  check_mode: false

- name: Remove the break-glass account from groups that grant root without sudo
  ansible.builtin.command:
    cmd: gpasswd -d {{ breakglass_user }} {{ item }}
  loop: "{{ breakglass_root_equivalent_groups | intersect(breakglass_groups.stdout.split()) }}"
  changed_when: true
