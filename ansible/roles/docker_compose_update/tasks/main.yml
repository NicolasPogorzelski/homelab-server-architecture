---
# Compose files interpolate `${VAR}` from the `.env` beside them on the node,
# which this role does not deploy. Compose substitutes an empty string for an
# unset variable, so `"${CW_BIND_ADDRESS}:${CW_PORT}:8083"` would publish on
# every interface and a volume would lose its source.
#
# The gate reads the variables from the file about to be written and refuses the
# node if its `.env` cannot resolve them. It runs before the copy, while the
# working file is still in place.
- name: Read the .env beside each compose file on the node
  ansible.builtin.slurp:
    src: "{{ item.dest }}/.env"
  register: compose_update_env_files
  failed_when: false
  loop: "{{ compose_projects }}"
  loop_control:
    label: "{{ item.dest }}"

# Matches `${VAR}` only: `${VAR:-fallback}` has a default, and `${1}` or a bare
# `$HOME` are not shell-style variable names in braces.
- name: Refuse a node that cannot resolve the variables in the file it is about to receive
  ansible.builtin.assert:
    that:
      - compose_update_missing | length == 0
    fail_msg: >-
      {{ item.0.dest }} would receive a compose file referencing
      {{ compose_update_missing | join(', ') }}, and nothing on this node defines
      {{ 'them' if compose_update_missing | length > 1 else 'it' }}. Compose substitutes an
      empty string rather than failing, so the result would publish ports on every interface
      and mount volumes with no source. Create {{ item.0.dest }}/.env from
      docker/{{ item.0.src }}/.env.example before running this again.
    success_msg: >-
      {{ item.0.dest }}: {{ compose_update_required | length }} variable(s) resolvable
    quiet: true
  vars:
    compose_update_required: >-
      {{ lookup('file', role_path ~ '/../../../docker/' ~ item.0.src ~ '/docker-compose.yml')
         | regex_findall('\$\{([A-Za-z_][A-Za-z0-9_]*)\}') | unique | sort }}
    compose_update_env_text: >-
      {{ (item.1.content | b64decode) if item.1.content is defined else '' }}
    compose_update_provided: >-
      {{ compose_update_env_text | regex_findall('(?m)^[ \t]*([A-Za-z_][A-Za-z0-9_]*)[ \t]*=') }}
    compose_update_missing: >-
      {{ compose_update_required | difference(compose_update_provided) | sort }}
  loop: "{{ compose_projects | zip(compose_update_env_files.results) | list }}"
  loop_control:
    label: "{{ item.0.dest }}"

- name: Sync compose file from repo to node
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../docker/{{ item.src }}/docker-compose.yml"
    dest: "{{ item.dest }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ compose_projects }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Pull latest images and recreate changed Compose stacks
  community.docker.docker_compose_v2:
    project_src: "{{ item.dest }}"
    state: present
    pull: always
  loop: "{{ compose_projects }}"
  loop_control:
    label: "{{ item.dest }}"
