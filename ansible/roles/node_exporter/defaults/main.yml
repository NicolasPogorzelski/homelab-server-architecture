---
# The unprivileged account the exporter runs as. One variable for the task that
# creates it and the unit that uses it.
node_exporter_user: node_exporter

node_exporter_version: "1.12.1"
# SHA-256 of node_exporter-<version>.linux-amd64.tar.gz, copied from the
# release's sha256sums.txt. Pinned in the repository, so a replaced release asset
# fails the download. Changes together with the version above.
node_exporter_sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
node_exporter_port: 9100

# Override to install from an internal mirror on a node without egress to github.com.
node_exporter_release_base: https://github.com/prometheus/node_exporter/releases/download

# On fleet-wide. A per-host opt-in lets a role run drop the flag, and the metrics
# that staleness alerts such as SnapRAIDSyncStale read then vanish without an alert.
# The collector costs nothing on a node without .prom files; the role creates the
# directory itself.
node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector

# Enables the `systemd` collector, which exports `node_systemd_unit_state`.
# Without it a unit in `failed` emits no metric and no alert can fire (KE-15).
# The collector reads unit state over D-Bus with read-only queries, which work
# under the unprivileged `node_exporter` user.
node_exporter_systemd_collector: true

# The upstream default also excludes `.mount`, the unit type of the mount faults in
# KE-15. `.mount` is kept here; known-noisy mount units are masked at the source by
# the `systemd_hygiene` role instead.
node_exporter_systemd_unit_exclude: '.+\.(automount|device|scope|slice)'

# Gate the exporter on its bind address existing, not merely on tailscaled having
# started. Without it the first start fails with `bind: cannot assign requested
# address` and recovers on the restart 15 s later, too briefly for
# SystemdUnitFailed (for: 15m) to see. See KE-18.
node_exporter_tailscale_gate: true
node_exporter_wait_script_src: "{{ playbook_dir }}/../../snippets/scripts/wait-for-tailscale-ip.sh"
node_exporter_wait_script: /usr/local/bin/wait-for-tailscale-ip.sh
node_exporter_wait_timeout: 90

# The gate lives in the generated unit. An older hand-written drop-in at this path
# would add a second, redundant ExecStartPre, so the role removes it.
node_exporter_obsolete_dropin: /etc/systemd/system/node_exporter.service.d/wait-tailscale.conf
