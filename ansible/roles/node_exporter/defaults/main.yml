---
node_exporter_version: "1.11.1"
node_exporter_port: 9100

# Split out of the download URL so the release host can be repointed at an internal
# mirror without editing a task. Overriding this is the supported way to install
# node_exporter on a node with no egress to github.com.
node_exporter_release_base: https://github.com/prometheus/node_exporter/releases/download

# On by default, fleet-wide. It used to default to "" and be switched on per host,
# which made it a trap: vm102's unit was hand-written and carried the flag, nothing
# in host_vars did, and the first fleet-wide run of this role silently rewrote the
# unit without it. The .prom files stayed on disk, node_exporter stopped reading
# them, `snapraid_sync_last_success_timestamp` vanished, and the SnapRAIDSyncStale
# rule quietly evaluated an expression with no series — an alert that can no longer
# fire, and never goes red to say so. (Introduced and caught on 2026-07-10.)
#
# The collector costs nothing on a node with no .prom files, so there is no reason
# to make its absence expressible. The role creates the directory itself.
node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector

# Enables the `systemd` collector, which exports `node_systemd_unit_state`.
# Without it a unit sitting in `failed` emits no metric at all, so no alert can
# fire on it — which is how calibre-import.service failed every 2 minutes for a
# month while every dashboard stayed green (KE-15). The collector reads unit
# state over the systemd D-Bus API; read-only property queries do not require
# root, so it works under the unprivileged `node_exporter` user. Verified on
# lxc260 before fleet rollout.
node_exporter_systemd_collector: true

# node_exporter's own default is `.+\.(automount|device|mount|scope|slice)`, which
# drops `.mount` units. Both mount faults found on 2026-07-10 — lxc220's `/books-rw`
# (KE-15) and vm100's stale `media-mergerfs.mount` — are exactly that unit type, so
# the stock exclude would filter out the failure class the collector was added for.
# `.mount` is therefore kept; the two known-noisy mount units are masked at the
# source by the `systemd_hygiene` role rather than filtered here.
node_exporter_systemd_unit_exclude: '.+\.(automount|device|scope|slice)'
