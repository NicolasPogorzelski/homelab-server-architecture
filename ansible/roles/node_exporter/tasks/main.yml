---
# The install steps are gated on the binary's own reported version. Without the
# guard the role re-downloads the tarball on every run (the cleanup task removes
# it again each time), and `--check` fails outright: get_url does not fetch in
# check mode, so the following unarchive cannot find the archive. A role that
# cannot be dry-run cannot be verified before it touches a node.
- name: Read the installed node_exporter version
  ansible.builtin.command:
    cmd: /usr/local/bin/node_exporter --version
  register: node_exporter_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the node_exporter binary
  vars:
    # node_exporter has printed --version to stderr in some releases and to
    # stdout in others; match against both rather than betting on one.
    node_exporter_version_output: >-
      {{ (node_exporter_installed.stdout | default('')) + (node_exporter_installed.stderr | default('')) }}
    # The upstream release artefact name, reused by the download, the unarchive,
    # the copy and the cleanup. Spelling it out five times invited them to drift.
    node_exporter_dist: node_exporter-{{ node_exporter_version }}.linux-amd64
  when: node_exporter_version not in node_exporter_version_output
  block:
    - name: Deploy node_exporter
      ansible.builtin.get_url:
        url: "{{ node_exporter_release_base }}/v{{ node_exporter_version }}/{{ node_exporter_dist }}.tar.gz"
        dest: /tmp/{{ node_exporter_dist }}.tar.gz
        mode: "0644"

    - name: Unarchive node_exporter
      ansible.builtin.unarchive:
        src: /tmp/{{ node_exporter_dist }}.tar.gz
        dest: /tmp/
        remote_src: true

    # Without this handler a version bump wrote the new binary to disk and left
    # the old process running until the next reboot.
    - name: Copy file with owner and permissions
      ansible.builtin.copy:
        src: /tmp/{{ node_exporter_dist }}/node_exporter
        dest: /usr/local/bin/node_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart node_exporter

    - name: Remove tarball and extracted directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/{{ node_exporter_dist }}.tar.gz
        - /tmp/{{ node_exporter_dist }}

- name: Deploy the wait-for-tailscale-ip script
  ansible.builtin.copy:
    src: "{{ node_exporter_wait_script_src }}"
    dest: "{{ node_exporter_wait_script }}"
    owner: root
    group: root
    mode: "0755"
  when: node_exporter_tailscale_gate

# No owner/group on purpose: on lxc260 this directory belongs to `postgres`, which
# is the user pg-backup.sh writes its .prom file as. Asserting owner: root here
# would silently break that backup's metric - the same class of failure this
# default-on collector is meant to prevent.
- name: Ensure the textfile collector directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    mode: "0755"
  when: node_exporter_textfile_dir | length > 0

- name: Generate UNIT
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

# Removed after the unit carrying the gate is in place, so an interrupted run
# never leaves the node with neither.
- name: Remove the superseded boot-gate drop-in
  ansible.builtin.file:
    path: "{{ node_exporter_obsolete_dropin }}"
    state: absent
  when: node_exporter_tailscale_gate
  notify: Restart node_exporter

- name: Enable Systemd
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    daemon_reload: true
    enabled: true
