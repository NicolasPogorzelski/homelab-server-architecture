---
# The role creates the account itself, so a rebuilt node does not start the unit
# into 217/USER. No uid is pinned: existing accounts sit on 996 or 999, and
# pinning one would renumber them.
- name: Create the group the exporter runs as
  ansible.builtin.group:
    name: "{{ node_exporter_user }}"
    system: true
    state: present

- name: Create the account the exporter runs as
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    system: true
    shell: /sbin/nologin
    home: "/home/{{ node_exporter_user }}"
    create_home: false
    state: present

# The install steps are gated on the installed version. Without the guard every
# run re-downloads the tarball, and --check fails because get_url does not fetch in
# check mode and unarchive then finds no archive.
- name: Read the installed node_exporter version
  ansible.builtin.command:
    cmd: /usr/local/bin/node_exporter --version
  register: node_exporter_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the node_exporter binary
  vars:
    # node_exporter has printed --version to stderr in some releases and to
    # stdout in others; match against both.
    node_exporter_version_output: >-
      {{ (node_exporter_installed.stdout | default('')) + (node_exporter_installed.stderr | default('')) }}
    # The upstream release artefact name, shared by download, unarchive, copy and
    # cleanup.
    node_exporter_dist: node_exporter-{{ node_exporter_version }}.linux-amd64
  when: node_exporter_version not in node_exporter_version_output
  block:
    - name: Deploy node_exporter
      ansible.builtin.get_url:
        url: "{{ node_exporter_release_base }}/v{{ node_exporter_version }}/{{ node_exporter_dist }}.tar.gz"
        dest: /tmp/{{ node_exporter_dist }}.tar.gz
        checksum: "sha256:{{ node_exporter_sha256 }}"
        mode: "0644"

    - name: Unarchive node_exporter
      ansible.builtin.unarchive:
        src: /tmp/{{ node_exporter_dist }}.tar.gz
        dest: /tmp/
        remote_src: true

    # The handler restarts the exporter, so a version bump does not leave the old
    # process running until the next reboot.
    - name: Copy file with owner and permissions
      ansible.builtin.copy:
        src: /tmp/{{ node_exporter_dist }}/node_exporter
        dest: /usr/local/bin/node_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart node_exporter

    - name: Remove tarball and extracted directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/{{ node_exporter_dist }}.tar.gz
        - /tmp/{{ node_exporter_dist }}

- name: Deploy the wait-for-tailscale-ip script
  ansible.builtin.copy:
    src: "{{ node_exporter_wait_script_src }}"
    dest: "{{ node_exporter_wait_script }}"
    owner: root
    group: root
    mode: "0755"
  when: node_exporter_tailscale_gate

# No owner/group on purpose: on lxc260 this directory belongs to `postgres`, the
# user pg-backup.sh writes its .prom file as; owner root would break that metric.
- name: Ensure the textfile collector directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    mode: "0755"
  when: node_exporter_textfile_dir | length > 0

- name: Generate UNIT
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

# Removed after the unit carrying the gate is in place, so an interrupted run
# never leaves the node with neither.
- name: Remove the superseded boot-gate drop-in
  ansible.builtin.file:
    path: "{{ node_exporter_obsolete_dropin }}"
    state: absent
  when: node_exporter_tailscale_gate
  notify: Restart node_exporter

- name: Enable Systemd
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    daemon_reload: true
    enabled: true
