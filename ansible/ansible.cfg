[defaults]
inventory = ./inventory/hosts.yml
remote_user = ansible
host_key_checking = True
roles_path = ./roles
vault_password_file = ~/.vault_pass

[ssh_connection]
# Ansible's default ssh_args plus a known_hosts file holding only keys verified
# out of band by playbooks/known-hosts.yml; strict, so a node presenting any other
# key is refused instead of being handed the run.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=~/.ssh/known_hosts.fleet -o StrictHostKeyChecking=yes
