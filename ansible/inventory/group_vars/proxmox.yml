---
# === SSH ===
#
# Root is the hypervisor's only administrative account (no ansible user, no
# sudo-capable admin) and there is no usable out-of-band console: the only GPU
# is passed through to vm100 with `x-vga=1`, and there is no serial console or
# BMC. Root keeps key login, password login is off. A correctly configured host
# reports changed=0.
ssh_hardening_permit_root_login: prohibit-password

# === Boot gates ===
#
# pveproxy binds only this host's Tailscale address (/etc/default/pveproxy), so
# it cannot start before that address exists; it exits instead of binding
# partially and stays down after systemd's start limit (KE-12).
tailscale_boot_gate_units:
  - pveproxy.service

# Drop-ins that predate the role. The role writes 10-wait-tailscale.conf and
# removes these, so they cannot override its directives.
tailscale_boot_gate_obsolete_dropins:
  - override.conf
  - wait-tailscale.conf

# === systemd hygiene ===
#
# rpcbind listens on port 111 although the host mounts no NFS (KE-3). Removing
# rpcbind and nfs-common, the fix on lxc210, would also remove proxmox-ve and
# pve-manager here, so the units are masked and stopped instead. Nothing running
# depends on them: rpc-statd starts only for an NFS mount, and sockets.target
# merely Wants the socket. To add NFS storage later, drop these entries.
systemd_hygiene_masked_units:
  - name: rpcbind.socket
    reason: "no NFS storage on this node; the socket is what holds port 111 open, so masking the service alone leaves it listening"
    action: mask
  - name: rpcbind.service
    reason: "no NFS storage on this node; removing the package would take proxmox-ve with it"
    action: mask

# === Journal retention ===
#
# Larger than the 512M fleet default. Guest journals sit in the thin pool, where
# capping them protects against the overflow behind KE-7; the host journal sits
# on the thick `pve-root` LV with ample free space. About a year of host journal
# keeps a before-and-after window for the intermittent KE-14 boot errors.
# KE-20 and KE-21 left nothing in the journal; netconsole covers those.
journald_system_max_use: 2G

# smart_metrics owns the collector timers here and enables smartmon, so
# apt_metrics must not mask any of them on this node.
apt_metrics_masked_timers: []

# The hypervisor filters at `input`, so the chain sees only traffic addressed to
# the host and never frames bridged to a guest.
lan_guard_hook: input

# Two LAN paths stay open because they must work without Tailscale: break-glass
# SSH from the admin workstations (no local console while vm100 holds the GPU),
# and netconsole from vm100, which netpoll sends below any userspace daemon.
lan_guard_allow:
  - proto: tcp
    port: 22
    sources: "{{ admin_lan_ips }}"
    reason: break-glass SSH from the two admin workstations, the host's only access without Tailscale
  - proto: udp
    port: 6666
    sources:
      - "{{ vm100_lan_ip }}"
    reason: netconsole from vm100, kernel messages sent by netpoll without Tailscale

# Exceptions to the binding rule that listener_metrics reports, each with its
# decision. The hypervisor's sshd stays unpinned on purpose
# (docs/decisions/sshd-listen-address.md).
listener_metrics_allowed:
  - { proto: tcp, port: 22, reason: "hypervisor sshd, step 4 of docs/decisions/sshd-listen-address.md" }
  - { proto: udp, port: 6666, reason: "netconsole receiver; netpoll cannot use Tailscale - docs/platform/proxmox-host.md" }
