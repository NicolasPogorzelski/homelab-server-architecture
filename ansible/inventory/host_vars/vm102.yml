---
# Native admin user that receives the break-glass key on this host.
breakglass_user: storage

# Units this node must not run. nmbd answers NetBIOS name queries and browse
# announcements on UDP 137/138 of every interface; no client here resolves the
# storage node that way - they use its Tailscale name or address - and SMB itself
# runs on 445 alone (`smb ports = 445`). Masked rather than disabled, so a package
# upgrade cannot quietly start it again.
systemd_hygiene_masked_units:
  - name: nmbd.service
    reason: >-
      NetBIOS name service, listening on UDP 137/138 on the LAN. Nothing on the
      platform uses NetBIOS names; `disable netbios = yes` in smb.conf goes with it.

# SMB over the LAN from the two nodes that still mount that way, the same pair
# smb_guard admits. Both tables drop what they do not accept, so the path has to
# be open in each. Goes away with the storage network (remediation plan).
lan_guard_allow:
  - proto: tcp
    port: 445
    sources:
      - "{{ proxmox_host_lan_ip }}"
      - "{{ vm100_lan_ip }}"
    reason: SMB mounts from the hypervisor and vm100 over the LAN, until the storage network replaces them

# === sshd bound to the Tailscale address only ===
# docs/decisions/sshd-listen-address.md, step 2. vm102 was never socket-activated,
# so ListenAddress binds as written. sshd exits 255 on a bind to an address
# tailscaled has not assigned yet, and the packaged unit refuses to restart on 255
# unless that list is cleared. The way back is the Proxmox console, as `storage`;
# this VM cannot be snapshotted, its pool disks are passed through.
tailscale_boot_gate_units:
  - ssh.service
tailscale_boot_gate_clear_restart_prevent: true

ssh_hardening_listen_address: "{{ ansible_host }}"

# Exceptions to the binding rule that listener_metrics reports. Each names its
# decision; remove the line when the decision is executed.
listener_metrics_allowed:
  - { proto: tcp, port: 445, reason: "Samba cannot bind tailscale0; smb_guard filters instead - docs/decisions/smb-bind-and-lan-access.md" }
