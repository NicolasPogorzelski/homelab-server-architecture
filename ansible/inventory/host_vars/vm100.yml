---
# Native admin user that receives the break-glass key on this host.
breakglass_user: gpu

# Docker Compose stacks on this node. dest = project_src on the node;
# src = subdir under repo docker/ that docker-compose-update syncs from.
compose_projects:
  - { dest: /opt/docker/audiobookshelf, src: audiobookshelf }
  - { dest: /opt/docker/jellyfin, src: jellyfin }

# Automount units whose paths the Compose stacks bind. docker.service is ordered
# after them, so a container cannot start onto a directory where autofs has not yet
# installed its trigger and end up serving an empty library.
docker_mount_ordering_units:
  - srv-media-filme.automount
  - srv-media-serien.automount
  - srv-media-audiobooks.automount
  - srv-media-podcasts.automount

# Units that can never succeed on this node. Masked by the systemd_hygiene role so
# that every remaining failed unit on the fleet is a real fault worth alerting on.
systemd_hygiene_masked_units:
  # A hand-written unit in /etc/systemd/system, not a package file: it must be
  # removed, not masked. `systemctl mask` would try to symlink over itself.
  - name: media-mergerfs.mount
    action: remove
    reason: >-
      Legacy VirtioFS mount for /media/mergerfs. The host no longer exports the
      `mergerfs` tag (`virtio-fs: tag <mergerfs> not found` at every boot), and
      nothing consumes the path: Jellyfin and Audiobookshelf read their libraries
      over autofs/CIFS from vm102. Already recorded as legacy in docs/nodes/vm100.md.

  # The four units below carried the two pool-wide media shares, replaced on
  # 2026-08-16 by four scoped shares on new paths under /srv/media. They were
  # only `systemctl disable`d that day, deliberately: disabling drops the boot
  # symlink without unmounting, and unmounting a live CIFS mount on this node is
  # what froze the guest in KE-20. The nightly power-off retired them, so all
  # four have been inactive since - verified 2026-08-17 before removal.
  - name: media-jellyfin.automount
    action: remove
    reason: >-
      Superseded by srv-media-filme.automount and srv-media-serien.automount.
      Mounted the pool-wide share [media-jf] at /media/jellyfin.
  - name: media-jellyfin.mount
    action: remove
    reason: >-
      Backing mount unit of media-jellyfin.automount, superseded with it.
  - name: media-audiobookshelf.automount
    action: remove
    reason: >-
      Superseded by srv-media-audiobooks.automount and srv-media-podcasts.automount.
      Mounted the pool-wide share [media-abs] at /media/audiobookshelf.
  - name: media-audiobookshelf.mount
    action: remove
    reason: >-
      Backing mount unit of media-audiobookshelf.automount, superseded with it.
