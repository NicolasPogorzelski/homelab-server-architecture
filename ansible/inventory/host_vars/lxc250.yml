---
# sshd binds the Tailscale address only, so SSH is unreachable for the first
# half minute after a boot. This node never used socket activation.
ssh_hardening_listen_address: "{{ ansible_host }}"

# Gated rather than only ordered (KE-18): this is the control node, holding the
# only copy of the vault password, the real inventory and the deployment key.
# If its sshd does not come up, the only way in is `pct exec` from the hypervisor.
tailscale_boot_gate_units:
  - ssh.service

# Debian's ssh.service sets RestartPreventExitStatus=255 and sshd exits 255 on a
# failed bind, so the restart backstop only works with that list cleared.
tailscale_boot_gate_clear_restart_prevent: true

# This is the only container with systemd-resolved, and with `resolve` ahead of
# `dns` in nsswitch.conf, `[!UNAVAIL=return]` ended every lookup at resolved's
# "not found", so MagicDNS names never resolved. Dropping `resolve` lets glibc use
# the /etc/resolv.conf that tailscaled writes. `myhostname` stays: it resolves
# the node's own name without a lookup.
nsswitch_hosts: "files myhostname dns"

# With `resolve` out of the path, systemd-resolved only served LLMNR and mDNS on
# 0.0.0.0:5355, unauthenticated, on the LAN. It is stopped and disabled; the role
# refuses if anything still points at the 127.0.0.53 stub.
nsswitch_disable_resolved: true
