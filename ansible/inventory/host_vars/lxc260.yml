---
# PostgreSQL tenants provisioned by the postgresql-provisioning role.
#
# Empty: the role is tested, but the live tenants (openwebui, paperless) are
# not adopted yet, because postgresql_user re-asserts the password and a mismatch
# would break the running service's login.
#
# To onboard a tenant, add a (non-secret) entry here and its password to the
# companion dict, then run playbooks/postgresql-provisioning.yml:
#
#   postgres_tenants:
#     - name: <svc>_db
#       user: <svc>_user
#       consumer_cidr: "{{ hostvars['lxc2xx'].ansible_host }}/32"
#   postgres_tenant_passwords:
#     <svc>_user: "{{ vault_<svc>_dbpass }}"
#
# Passwords stay out of the tenants list: it is the loop variable, and Ansible
# prints the whole item on a task failure. Only the no_log user task reads them.
postgres_tenants: []

# The role manages the exporter's DATA_SOURCE_NAME file from
# vault_postgres_exporter_dsn, owned root:600: systemd reads an EnvironmentFile
# as root before dropping to User=, so the service account never reads it.
postgres_exporter_manage_env: true

# The packages that ship these units are removed fleet-wide (group_vars/guests.yml);
# the leftover mask symlinks are removed with them.
systemd_hygiene_retired_units:
  - name: nvmf-autoconnect.service
    reason: >-
      Shipped by nvme-cli, which no guest installs any more.
  - name: openipmi.service
    reason: >-
      Shipped by openipmi, which no guest installs any more.

# Ships this node's journal to the receiver on lxc200. Exercise, not a needed
# control (docs/decisions/exercise-scope-before-terraform.md). Two nodes opt in:
# enough to correlate across senders without shipping every journal.
journal_upload_enabled: true

# === sshd bound to the Tailscale address only ===
# docs/decisions/sshd-listen-address.md; the reasoning is in lxc220's host_vars,
# the first node it ran on. ssh_hardening disables `ssh.socket` where the bind is
# pinned, and asserts the two gate lines before it writes the bind.
tailscale_boot_gate_units:
  - ssh.service

tailscale_boot_gate_clear_restart_prevent: true

ssh_hardening_listen_address: "{{ ansible_host }}"
