---
# Docker Compose stacks on this node. dest = project_src on the node;
# src = subdir under repo docker/ that docker-compose-update syncs from.
# Node dir basename ("calibreweb") differs from the repo dir name ("calibre-web").
compose_projects:
  - { dest: /srv/calibreweb, src: calibre-web }

# === sshd bound to the Tailscale address only ===
# docs/decisions/sshd-listen-address.md. This node was socket-activated, and under
# `ssh.socket` sshd never binds anything, so ListenAddress alone was inert here;
# ssh_hardening now disables the socket wherever the bind is pinned and lets
# ssh.service own the port. The gate is what makes the pin survive a boot: sshd
# exits 255 on a bind to an address tailscaled has not assigned yet, and Debian's
# unit refuses to restart on 255 unless that list is cleared. ssh_hardening
# asserts both gate lines before it writes the bind.
tailscale_boot_gate_units:
  - ssh.service

tailscale_boot_gate_clear_restart_prevent: true

ssh_hardening_listen_address: "{{ ansible_host }}"
