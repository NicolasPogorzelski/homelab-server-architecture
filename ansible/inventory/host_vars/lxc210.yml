---
# Nothing to mask: run-rpc_pipefs.mount came from nfs-common, which is removed
# below instead of masked.
systemd_hygiene_masked_units: []

# nfs-common and rpcbind on a node whose storage is CIFS (KE-3). Removing them
# closes rpcbind's wildcard listener on port 111. The role simulates the removal
# first and refuses if apt would remove anything else; cifs-utils is unaffected.
systemd_hygiene_absent_packages:
  - name: nfs-common
    reason: >-
      No NFS mount on this node - storage is CIFS to vm102 - and the package's
      run-rpc_pipefs.mount has failed at every boot since the container was built
      (KE-3).
  - name: rpcbind
    reason: >-
      The port mapper that resolves RPC program numbers to ports for NFS clients
      and servers. With nfs-common gone there is no RPC service left to map, and it
      binds every interface on a node that should bind only Tailscale.

# The mask symlink is removed too, so no mask is left for a unit that no longer
# exists.
systemd_hygiene_retired_units:
  - name: run-rpc_pipefs.mount
    reason: >-
      Shipped by nfs-common, which this node no longer installs.

# MariaDB's `time_zone = SYSTEM` resolves against the OS at server start; this
# is the only node with such a database, so the timezone role pins it here.
timezone_pin_mariadb: true

# Collabora Online (coolwsd) runs from an AppImage that the richdocumentscode app
# extracts into /tmp and starts as www-data: no package, no unit, no listen-address
# setting. It binds *:9983, and Nextcloud reaches it only through proxy.php over
# loopback, so the filter costs nothing. It runs without capability or seccomp
# confinement (not available in an unprivileged LXC), so the container boundary
# is the only isolation around the documents it parses.
nft_guard_local_only_ports:
  - port: 9983
    reason: >-
      Collabora Online (CODE AppImage, no listen-address setting). Reached only
      through Nextcloud's proxy.php over loopback.

# === sshd bound to the Tailscale address only ===
# docs/decisions/sshd-listen-address.md; the reasoning is in lxc220's host_vars,
# the first node it ran on. ssh_hardening disables `ssh.socket` where the bind is
# pinned, and asserts the two gate lines before it writes the bind.
tailscale_boot_gate_units:
  - ssh.service

tailscale_boot_gate_clear_restart_prevent: true

ssh_hardening_listen_address: "{{ ansible_host }}"

# Exceptions to the binding rule that listener_metrics reports. Each names its
# decision; remove the line when the decision is executed. MariaDB is not here on
# purpose: mariadb_bind keeps it on loopback, and a wildcard 3306 is a fault.
listener_metrics_allowed:
  - { proto: tcp, port: 80, reason: "Apache wildcard bind, deferred design decision - docs/nodes/lxc210.md" }
  - { proto: tcp, port: 443, reason: "Apache wildcard bind, deferred design decision - docs/nodes/lxc210.md" }
  - { proto: tcp, port: 9983, reason: "coolwsd takes no bind address from the app - docs/services/nextcloud.md" }
