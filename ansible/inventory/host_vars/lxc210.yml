---
# Nothing on this node needs masking any more. run-rpc_pipefs.mount sat here from
# the container's build until 2026-09-11: NFS client plumbing pulled in by
# nfs-common, on a node whose storage is CIFS (//vm102/Nextcloud), failing at every
# boot. It was masked rather than fixed, which is the distinction this change acts
# on - the mask treated a symptom whose cause was an installed package.
systemd_hygiene_masked_units: []

# The cause. nfs-common brought the mount above and pulled in rpcbind, which listens
# on 0.0.0.0:111 and [::]:111 - a wildcard bind on a node with no NFS mount, found
# by the 2026-08-17 audit and still open. Removing the package closes the listener
# and retires the mask in one step, which is cheaper than maintaining either.
#
# The role simulates the removal first and refuses if apt would take anything else.
# Nextcloud's storage is unaffected: cifs-utils is a separate package and CIFS needs
# no part of the NFS client stack.
systemd_hygiene_absent_packages:
  - name: nfs-common
    reason: >-
      No NFS mount on this node - storage is CIFS to vm102 - and the package's
      run-rpc_pipefs.mount has failed at every boot since the container was built
      (KE-3).
  - name: rpcbind
    reason: >-
      The port mapper that resolves RPC program numbers to ports for NFS clients
      and servers. With nfs-common gone there is no RPC service left to map, and it
      binds every interface on a node that should bind only Tailscale.

# Masked by this role until the package removal above made the mask pointless. The
# leftover symlink is removed rather than left: a mask for a unit that no longer
# exists reads at review time exactly like a mask that is still doing something.
systemd_hygiene_retired_units:
  - name: run-rpc_pipefs.mount
    reason: >-
      Shipped by nfs-common, which this node no longer installs.

# MariaDB shipped `time_zone = SYSTEM`, which resolves against the operating
# system at server start. This node is the only one on the fleet running a
# database that does that, so the timezone role pins it here rather than leaving
# what NOW() means to whatever the container happens to be set to.
timezone_pin_mariadb: true

# Collabora Online. The `richdocumentscode` Nextcloud app extracts an AppImage into
# /tmp and runs it as www-data, so there is no package, no unit and no listen
# address to set - measured 2026-09-09, after the 2026-08-17 audit had recorded it
# as a `coolwsd` service, which it is not. It binds *:9983 on a node whose Apache
# already violates the binding rule, and Nextcloud reaches it through proxy.php on
# its own web server, which means over loopback.
#
# So nothing legitimate arrives at this port from off the node, and the filter costs
# nothing. What it buys is more than tidiness: the process behind it runs with
# security.capabilities=false and security.seccomp=false, because capability jailing
# does not work in an unprivileged LXC, so the LibreOffice processes parsing
# untrusted documents are confined by the container boundary and nothing inside it.
nft_guard_local_only_ports:
  - port: 9983
    reason: >-
      Collabora Online (CODE AppImage, no listen-address setting). Reached only
      through Nextcloud's proxy.php over loopback.
