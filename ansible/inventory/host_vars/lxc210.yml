---
# node_exporter: enable the textfile collector so mariadb_backup.prom is scraped.
# Without this the backup script writes the metric and nothing reads it, and
# MariaDBBackupStale can never fire — an absent series produces no result, so the
# alert would look healthy for a backup that never ran. Same trap the PostgreSQL
# alert sat in for months before lxc260 got this line.
node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector

# Units that can never succeed on this node. Masked by the systemd_hygiene role so
# that every remaining failed unit on the fleet is a real fault worth alerting on.
systemd_hygiene_masked_units:
  - name: run-rpc_pipefs.mount
    reason: >-
      NFS client plumbing pulled in by the nfs-common dependency. This node has no
      NFS mount (storage is CIFS, //vm102/Nextcloud) and rpc-gssd.service is
      inactive, so the mount has failed at every boot since the container was
      built. Documented as KE-3, non-blocking.
