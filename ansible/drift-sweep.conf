# Which playbooks the weekly drift sweep runs in check mode, and which drift is
# held on purpose. Read by snippets/scripts/fleet-drift.sh; plain text because the
# control node has no YAML or JSON parser installed.
#
# Every playbook that imports preflight.yml appears in exactly one of [excluded]
# and [playbooks]; the repository validator enforces that.
#
# Excluded:
#   bootstrap-ansible-user, onboarding  connect as root to a node that has no
#                                       ansible user yet
#   apt-upgrade                         the apt module refreshes the package cache
#                                       even under --check, a write on every guest
#   docker-compose-update               pulls images; an unattended weekly pull is a
#                                       separate decision from a supervised run
#   offsite-backup                      the target VPS does not exist yet; add it
#                                       once the repository is reachable

[excluded]
apt-upgrade
bootstrap-ansible-user
docker-compose-update
offsite-backup
onboarding

# Included although not read-only under --check:
#   prometheus-config  stages the config and validates it with promtool, then
#                      removes the staged file
#   netconsole         sends one ping to prime the neighbour entry
#   nft-guard          loads and deletes an empty table to prove the node can load
#                      a filter at all

[playbooks]
apt-metrics
auditd
breakglass
calibre-import
chrony
docker-boot-retry
docker-mount-ordering
# The sweep checks its own deployment too.
fleet-drift
fleet-snapshot-schedule
guest-backup
homelab-schedule
jellyfin-user-prefs
jellyfin-watchdog
journal-central
journald
kernel-panic-policy
lan-guard
listener-metrics
mariadb-backup
mariadb-bind
mariadb-restore-test
netconsole
netplan-no-ra
nft-guard
nsswitch
node-exporter
paperless-env
paperless-inbox-scan
pg-backup
pg-restore-test
postgres-exporter
postgresql-boot-order
postgresql-provisioning
proxmox-host-units
prometheus-config
smart-metrics
snapraid-maintenance
ssh-hardening
storage-permissions
systemd-hygiene
tailscale-boot-gate
tailscale-cert
timezone
unattended-upgrades

# playbook  host  changed-tasks-expected
#
# Drift held on purpose, one line per playbook and host with its reason in a
# comment above. The alert fires on drift above these counts, so a second,
# unrelated difference in a held playbook still alerts.

[baseline]
# Empty: no drift is currently held.
