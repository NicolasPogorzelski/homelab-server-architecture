# Which playbooks the weekly drift sweep runs in check mode, and which drift is
# known and deliberately held.
#
# Read by snippets/scripts/fleet-drift.sh. Deliberately not YAML: the control
# node has no yq and no jq, and a sweep that needs a parser installed is a sweep
# that stops working after a rebuild.
#
# EXCLUDED ON PURPOSE, and why - the list below is a decision, not everything
# that happens to import preflight.yml:
#
#   bootstrap-ansible-user, onboarding  connect as root to a node that does not
#                                       yet have the ansible user; they describe
#                                       a machine that does not exist yet
#   apt-upgrade                         the apt module refreshes the package
#                                       cache even under --check, which is a
#                                       write on ten nodes every Sunday
#   docker-compose-update               pulls images; the standing hold on the
#                                       KE-13 disk was lifted on 2026-09-05, but
#                                       a weekly unattended pull is a different
#                                       decision from a supervised run
#   offsite-backup                      the target VPS does not exist yet, so the
#                                       role fails its own preflight against an
#                                       unreachable repository. Add it the same
#                                       day the machine answers - a sweep entry
#                                       that is red by construction teaches the
#                                       reader to skip the whole report
#
# The five names are repeated under [excluded] below so that something can read
# them. Written as prose alone from 2026-09-08 to 2026-09-16, the list could not
# be compared against the playbooks that exist, and three playbooks importing
# the preflight gate were in neither list - timezone, fleet-drift and
# fleet-snapshot-schedule. Check 44 now requires every gated playbook to appear
# in exactly one of the two sections.

[excluded]
apt-upgrade
bootstrap-ansible-user
docker-compose-update
offsite-backup
onboarding

# NOT read-only even in check mode, and included anyway:
#
#   prometheus-config  writes <dest>.staged and runs promtool inside the
#                      container, then removes it. That staging IS the
#                      validation, so a sweep that skipped it would lose the one
#                      check that reads the rules the way Prometheus will.
#   netconsole         sends one ping to prime the neighbour entry.
#   nft-guard          creates and immediately deletes an empty nftables table, to
#                      establish whether the node can load a filter at all. A role
#                      that skipped that probe under --check would report success
#                      for a node where the deploy cannot work, which is the one
#                      thing the probe exists to prevent. Measured 2026-09-12: it
#                      runs on lxc210 and the container can load a table.

[playbooks]
apt-metrics
breakglass
calibre-import
chrony
docker-mount-ordering
# The sweep and the snapshot deploy state of their own - a script and two unit
# files each - and were left out of the sweep by nobody's decision. Measured
# 2026-09-16, the deployed fleet-drift.sh was a commit behind this repository
# and nothing could say so, because the one playbook that would have reported it
# was the one excluded from the run. Checking itself is the point.
fleet-drift
fleet-snapshot-schedule
guest-backup
homelab-schedule
jellyfin-watchdog
journald
kernel-panic-policy
mariadb-backup
mariadb-restore-test
netconsole
nft-guard
nsswitch
node-exporter
paperless-env
paperless-inbox-scan
pg-backup
pg-restore-test
postgres-exporter
postgresql-boot-order
postgresql-provisioning
proxmox-host-units
prometheus-config
smart-metrics
snapraid-maintenance
ssh-hardening
storage-permissions
systemd-hygiene
tailscale-boot-gate
tailscale-cert
timezone
unattended-upgrades

# playbook  host  changed-tasks-expected
#
# Drift that is held on purpose. Each line needs a reason in a comment above it,
# and a line without one is a line nobody can revoke. The alert fires on drift
# ABOVE these numbers, because a rule that is red from the first day is a rule
# people learn to skip - the argument Check 23's rationale in CLAUDE.md makes.
#
# Numbers, not booleans: if a held playbook grows a second, unrelated difference,
# the count rises above the baseline and the alert fires.

[baseline]
# Empty since 2026-09-16, and that is the intended state rather than a gap. The
# three entries that stood here - homelab-schedule, ssh-hardening and
# node-exporter, all on proxmox-host, eight tasks between them - were applied
# that day and re-read at changed=0. A baseline outlives the drift it was
# written for in silence: it keeps subtracting, so the next real difference in
# the same playbook on the same host is absorbed rather than reported. Remove
# the line with the hold, in the same session.
