# Included in both Nextcloud virtual hosts on lxc210. Proxies the paths of
# Collabora Online to its container on loopback; the WebSocket path keeps an
# open document connected, which proxy.php of the built-in CODE could not.
# Paths as in Collabora's reverse proxy documentation for Apache.
AllowEncodedSlashes NoDecode
ProxyPreserveHost On

ProxyPass           /browser http://127.0.0.1:9980/browser retry=0
ProxyPassReverse    /browser http://127.0.0.1:9980/browser

ProxyPass           /hosting/discovery http://127.0.0.1:9980/hosting/discovery retry=0
ProxyPassReverse    /hosting/discovery http://127.0.0.1:9980/hosting/discovery
ProxyPass           /hosting/capabilities http://127.0.0.1:9980/hosting/capabilities retry=0
ProxyPassReverse    /hosting/capabilities http://127.0.0.1:9980/hosting/capabilities

# Both forms of the WebSocket path: /cool/<id>/ws and /cool/ws (used by 26.04).
ProxyPassMatch      "^/cool/(.*/)?ws$" ws://127.0.0.1:9980/cool/$1ws nocanon
ProxyPass           /cool/adminws ws://127.0.0.1:9980/cool/adminws
ProxyPass           /cool http://127.0.0.1:9980/cool
ProxyPassReverse    /cool http://127.0.0.1:9980/cool
